<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Flicky Cricket – iPhone &amp; Android</title>
<meta name="description" content="Get Flicky Cricket, the free arcade cricket game, on iPhone and Android. Play free in your browser now.">
<link rel="canonical" href="https://flickycricket.com/get/">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1630">
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../site.css">
<script>
// ONE place for the store links (Nov 16). Every "Get the app" button in the web game and on social links here.
// Flip ios/android to true when each store has the NEW game live.
var STORE = {
  iosLive: true,       // App Store listing (reused Flicky Cricket listing)
  androidLive: true,   // Google Play listing
  ios: 'https://apps.apple.com/app/id1090760276',
  android: 'https://play.google.com/store/apps/details?id=com.flickycricket.app',
  launch: '12 December'
};
(function () {
  var ua = navigator.userAgent || '', q = new URLSearchParams(location.search), src = q.get('src') || 'direct';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && 'ontouchend' in document), android = /Android/i.test(ua);
  var tag = function (u) { return u + (u.indexOf('?') < 0 ? '?' : '&') + 'utm_source=' + encodeURIComponent(src) + '&utm_medium=get'; };
  if (q.get('stay') !== '1') {
    if (ios && STORE.iosLive) { location.replace(STORE.ios + '?ct=' + encodeURIComponent(src)); return; }
    if (android && STORE.androidLive) { location.replace(STORE.android + '&referrer=' + encodeURIComponent('utm_source=' + src)); return; }
  }
  window._get = { ios: ios, android: android, tag: tag };
})();
</script>
<style>
.getBox{max-width:440px;margin:6vh auto;text-align:center;padding:0 18px}
.getBox img.ic{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.getBox h1{margin:16px 0 6px}
.getBox .store{display:block;margin:12px auto;max-width:320px;padding:14px 18px;border-radius:14px;font-weight:800;text-decoration:none;color:#fff;background:#1b2a4a;border:2px solid #2f4470}
.getBox .store.on{background:linear-gradient(#ffb03a,#e0721a);border-color:#050A14;color:#1a0e00}
.getBox .store.off{opacity:.75}
</style>
<!-- Google Tag Manager (Nov 16): website only, never inside the app; nothing is stored until the visitor says yes -->
<script>
(function () {
  try { if (window.Capacitor || /^(capacitor|ionic|file):/.test(location.protocol) || location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '') return; } catch (e) { return; }
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('consent', 'default', { analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', wait_for_update: 500 });
  var c = null; try { c = localStorage.getItem('fcCookies'); } catch (e) {}
  if (c === 'yes') gtag('consent', 'update', { analytics_storage: 'granted' });
  gtag('js', new Date());
  var s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-MDD8BRKF'; document.head.appendChild(s);
  dataLayer.push({ 'gtm.start': Date.now(), event: 'gtm.js' });
  if (c) return;
  var show = function () {
    var b = document.createElement('div'); b.id = 'fcCookieBar';
    b.setAttribute('style', 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:99999;width:min(94vw,420px);box-sizing:border-box;padding:12px 14px;border-radius:14px;border:2px solid #050A14;background:#0b1630;color:#fff;font:14px/1.35 Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.45)');
    b.innerHTML = 'Can we use cookies to see how people use the site and game? <a href="/privacy.html#website" style="color:#FFC93A">Privacy</a>' +
      '<div style="display:flex;gap:8px;margin-top:10px"><button data-c="yes" style="flex:1;height:38px;border-radius:10px;border:2px solid #050A14;background:#f5a623;color:#1a0e00;font-weight:700">Yes</button>' +
      '<button data-c="no" style="flex:1;height:38px;border-radius:10px;border:2px solid #2f4470;background:#1b2a4a;color:#fff;font-weight:700">No thanks</button></div>';
    b.addEventListener('click', function (e) { var v = e.target && e.target.getAttribute && e.target.getAttribute('data-c'); if (!v) return;
      try { localStorage.setItem('fcCookies', v); } catch (err) {}
      if (v === 'yes') gtag('consent', 'update', { analytics_storage: 'granted' });
      b.remove(); });
    document.body.appendChild(b);
  };
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
})();
</script>
<!-- End Google Tag Manager -->
</head>
<body>
<header class="top">
  <a class="brand" href="../"><img src="../img/icon.webp" alt="" width="40" height="40"><span>Flicky Cricket</span></a>
  <nav><a class="play topPlay on" href="../play/">▶ PLAY FREE</a></nav>
</header>
<main class="getBox">
  <img class="ic" src="../img/icon.webp" alt="Flicky Cricket icon">
  <h1>Get Flicky Cricket</h1>
  <p class="muted" id="getSub">Free on iPhone &amp; Android.</p>
  <a class="store" id="getIos" href="#">App Store</a>
  <a class="store" id="getAnd" href="#">Google Play</a>
  <a class="store on" href="../play/">▶ Play free in your browser now</a>
</main>
<script>
(function () {
  var g = window._get || { tag: function (u) { return u; } }, a = document.getElementById('getIos'), b = document.getElementById('getAnd');
  if (STORE.iosLive) { a.href = g.tag(STORE.ios); a.textContent = 'Download on the App Store'; a.className = 'store on'; }
  else { a.removeAttribute('href'); a.textContent = 'iPhone · coming ' + STORE.launch; a.className = 'store off'; }
  if (STORE.androidLive) { b.href = g.tag(STORE.android); b.textContent = 'Get it on Google Play'; b.className = 'store on'; }
  else { b.removeAttribute('href'); b.textContent = 'Android · coming ' + STORE.launch; b.className = 'store off'; }
  if (!STORE.iosLive && !STORE.androidLive) document.getElementById('getSub').textContent = 'Coming to iPhone & Android on ' + STORE.launch + '. Play free in your browser today.';
})();
</script>
</body>
</html>
