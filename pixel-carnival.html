<!DOCTYPE html>
<html lang="en">
<head>
<title>Pixel Carnival - Flicky Cricket</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  font-family:'Courier New',monospace;
}
#wrap { position:relative; display:inline-block; }
canvas#display {
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
#label {
  color:#f0c030;
  font-size:11px;
  letter-spacing:0.15em;
  text-align:center;
  margin-top:8px;
  text-transform:uppercase;
  opacity:0.7;
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="display"></canvas>
</div>
<p id="label">Flicky Cricket · Carnival Ground · Night Match</p>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  PIXEL CARNIVAL  —  90×60 game grid, P=6 → 540×360 display
//  Palette: 14 named colours, every pixel placed with intent
// ═══════════════════════════════════════════════════════════════════════════

const P  = 6;   // screen pixels per game pixel
const GW = 90;  // game grid width
const GH = 60;  // game grid height

const display = document.getElementById('display');
display.width  = GW * P;
display.height = GH * P;
const CTX = display.getContext('2d');
CTX.imageSmoothingEnabled = false;

// Off-screen pixel buffer (1-to-1 game pixels)
const buf = document.createElement('canvas');
buf.width = GW;  buf.height = GH;
const g = buf.getContext('2d');

// ─── PALETTE ────────────────────────────────────────────────────────────────
const C = {
  // Night sky gradient (4 bands)
  S0: '#04020e',  // near-black (top)
  S1: '#150840',  // deep indigo
  S2: '#431068',  // vivid violet
  S3: '#7a1245',  // crimson-magenta (horizon)
  // Tent
  TR: '#cc1e1e',  // carnival red
  TC: '#f0e8cc',  // warm cream
  TD: '#881212',  // tent shadow/dark red
  // Ground
  GG: '#267022',  // grass
  GL: '#39a835',  // grass light stripe
  SD: '#6e4a12',  // sawdust brown
  SD2:'#4e340c',  // sawdust dark
  PT: '#c4b06a',  // pitch (compressed earth)
  // Accents & lights
  WH: '#ffffff',
  GD: '#f0c030',  // gold
  GD2:'#c09820',  // dark gold
  TL: '#28bab0',  // teal
  OR: '#e06018',  // orange
  PK: '#d83898',  // pink
  BL: '#3880dc',  // blue
  // Outline
  OL: '#06030e',  // near-black outline
  // Moon
  MN: '#f8f0d8',  // moon face
  MN2:'#d8c8a8',  // moon shadow
};

// ─── PRIMITIVES ─────────────────────────────────────────────────────────────
const px_ = (x,y,col) => {
  if(x<0||x>=GW||y<0||y>=GH) return;
  g.fillStyle = col;
  g.fillRect(x|0, y|0, 1, 1);
};
const blk = (x,y,w,h,col) => { g.fillStyle=col; g.fillRect(x|0,y|0,w|0,h|0); };
const hln = (x1,x2,y,col) => { for(let x=x1|0;x<=(x2|0);x++) px_(x,y,col); };

function bline(x1,y1,x2,y2,col) {
  x1|=0; y1|=0; x2|=0; y2|=0;
  const dx=Math.abs(x2-x1), dy=Math.abs(y2-y1);
  const sx=x1<x2?1:-1, sy=y1<y2?1:-1;
  let e=dx-dy;
  for(;;) {
    px_(x1,y1,col);
    if(x1===x2&&y1===y2) break;
    const e2=e<<1;
    if(e2>-dy){e-=dy;x1+=sx;}
    if(e2< dx){e+=dx;y1+=sy;}
  }
}

function fillCirc(cx,cy,r,col) {
  for(let y=-r;y<=r;y++) for(let x=-r;x<=r;x++)
    if(x*x+y*y<=r*r) px_(cx+x,cy+y,col);
}

function circle(cx,cy,r,col) {
  // Midpoint circle, no gaps
  let x=r, y=0, e=1-r;
  while(x>=y) {
    px_(cx+x,cy+y,col); px_(cx-x,cy+y,col);
    px_(cx+x,cy-y,col); px_(cx-x,cy-y,col);
    px_(cx+y,cy+x,col); px_(cx-y,cy+x,col);
    px_(cx+y,cy-x,col); px_(cx-y,cy-x,col);
    y++;
    if(e<=0) { e+=2*y+1; }
    else { x--; e+=2*(y-x)+1; }
  }
}

function fillEllip(cx,cy,rx,ry,col) {
  const rx2=rx*rx, ry2=ry*ry;
  for(let y=-ry;y<=ry;y++) for(let x=-rx;x<=rx;x++)
    if(x*x*ry2+y*y*rx2<=rx2*ry2) px_(cx+x,cy+y,col);
}

// ─── SCENE LAYERS ───────────────────────────────────────────────────────────

// 1. NIGHT SKY  (y 0–35, dithered gradient)
function drawSky() {
  // Four solid bands
  blk(0,  0, GW, 10, C.S0);
  blk(0, 10, GW, 10, C.S1);
  blk(0, 20, GW, 10, C.S2);
  blk(0, 30, GW,  6, C.S3);

  // Checkerboard dithering at each band boundary (1 row each side)
  const bounds = [
    {y:9,  a:C.S0, b:C.S1},
    {y:19, a:C.S1, b:C.S2},
    {y:29, a:C.S2, b:C.S3},
  ];
  for(const {y,a,b} of bounds) {
    for(let x=0;x<GW;x++) {
      px_(x, y,   x%2===0 ? a : b);
      px_(x, y+1, x%2===0 ? b : a);
    }
  }
}

// 2. MOON (static, top-right sky area)
function drawMoon() {
  const mx=72, my=9, mr=6;
  // Glow halo (1-pixel feather)
  circle(mx,my,mr+2,'#3a2040');
  circle(mx,my,mr+1,'#6a3060');
  // Moon face
  fillCirc(mx,my,mr,C.MN);
  // Shadow crescent (occlusion from left)
  for(let y=-mr;y<=mr;y++) for(let x=-mr;x<=0;x++)
    if(x*x+y*y<=mr*mr && (x+2)*(x+2)+y*y<=mr*mr)
      px_(mx+x,my+y,C.MN2);
  // Outline
  circle(mx,my,mr,C.OL);
}

// 3. STARS  (twinkling, avoid moon and tent area)
const STAR_POS = [
  [ 3, 2],[10, 1],[17, 3],[25, 1],[35, 3],[44, 1],[54, 3],[63, 2],
  [ 6, 7],[13, 6],[22, 8],[31, 7],[41, 6],[51, 8],[60, 7],[68, 8],
  [ 1,13],[10,14],[19,12],[28,14],[38,12],[47,13],[57,14],[66,12],
  [ 4,18],[14,17],[23,19],[33,18],[43,17],[52,18],[62,19],
  [ 2,24],[11,23],[21,25],[30,24],[40,23],[50,25],[59,24],
];

function drawStars(t) {
  for(const [sx,sy] of STAR_POS) {
    const tw = (Math.sin(t*0.0018 + sx*1.71 + sy*2.33) + 1) * 0.5;
    if(tw > 0.20) {
      px_(sx,sy, C.WH);
      if(tw > 0.72) {
        // 4-point sparkle cross
        px_(sx-1,sy, C.GD);
        px_(sx+1,sy, C.GD);
        px_(sx,sy-1, C.GD);
        px_(sx,sy+1, C.GD);
      }
    }
  }
}

// 4. GROUND (elliptical cricket field)
function drawGround() {
  // Outer sawdust ring
  fillEllip(45,52,42,10,C.SD2);
  fillEllip(45,52,40, 9,C.SD);
  // Grass oval with mowing stripes
  const GCXY={cx:45,cy:52,rx:35,ry:7};
  for(let y=45;y<=59;y++) {
    for(let x=10;x<=80;x++) {
      const dx=(x-GCXY.cx)/GCXY.rx, dy=(y-GCXY.cy)/GCXY.ry;
      if(dx*dx+dy*dy<=1.0) {
        const stripe=Math.floor((y-45)/2)%2;
        px_(x,y, stripe===0 ? C.GL : C.GG);
      }
    }
  }
  // Cricket pitch (compressed earth)
  blk(40,48,10,7,C.PT);
  // Crease lines
  hln(40,49,48,C.WH);
  hln(40,49,54,C.WH);
  // Stumps — near end
  for(const sx of [42,45,48]) {
    bline(sx,45,sx,48,C.WH);
    px_(sx,45,C.GD);  // bail highlight
  }
  hln(41,49,45,'#c0a820');
  // Stumps — far end
  for(const sx of [42,45,48]) {
    bline(sx,54,sx,57,C.WH);
    px_(sx,54,C.GD);
  }
  hln(41,49,54,'#c0a820');
}

// 5. BIG TOP TENT (right side, 3 peaks)
//    Peaks: (63,24), (75,15), (88,24)
//    Base: y=36  Flanks: x=55..89
function drawTent() {
  const BASE = 36;

  // ── Left peak section: apex(63,24), base x 55..71 ──
  for(let y=24;y<=BASE;y++) {
    const t_ = (y-24)/(BASE-24);
    const xl = Math.round(63 - 8*t_);  // 63→55
    const xr = Math.round(63 + 8*t_);  // 63→71
    for(let x=xl;x<=xr;x++) {
      const s = Math.floor((x+y*0.5)/3)%2;
      px_(x,y, s===0 ? C.TR : C.TC);
    }
  }
  // Outline left peak
  bline(63,24, 55,BASE, C.OL);
  bline(63,24, 71,BASE, C.OL);

  // ── Center peak section: apex(75,15), base x 65..89 ──
  for(let y=15;y<=BASE;y++) {
    const t_ = (y-15)/(BASE-15);
    const xl = Math.round(75 - 10*t_);  // 75→65
    const xr = Math.round(75 + 14*t_);  // 75→89
    for(let x=xl;x<=xr;x++) {
      // Skip if already painted by left peak (left peak has priority)
      const s = Math.floor((x-y*0.4)/3)%2;
      px_(x,y, s===0 ? C.TR : C.TC);
    }
  }
  // Outline center peak (on top)
  bline(75,15, 65,BASE, C.OL);
  bline(75,15, 89,BASE, C.OL);
  // Right edge (screen boundary)
  bline(89,BASE, 89,15, C.OL);

  // Redraw left outline on top (center peak overwrote it)
  bline(63,24, 55,BASE, C.OL);

  // Peak finials (gold balls)
  fillCirc(63,23,2,C.GD);
  circle(63,23,2,C.GD2);
  px_(63,23,C.WH);

  fillCirc(75,14,2,C.GD);
  circle(75,14,2,C.GD2);
  px_(75,14,C.WH);

  // Horizontal scallop trim at base of each peak
  for(let x=55;x<=89;x+=4) {
    fillCirc(x+2, BASE+2, 2, C.TD);
    circle(x+2, BASE+2, 2, C.OL);
    const col=[C.TR,C.TC,C.GD,C.TR][Math.floor((x-55)/4)%4];
    px_(x+2,BASE+1,col);
  }

  // Bunting rope across tent front
  const BUNTS=[C.TR,C.GD,C.TL,C.PK,C.OR,C.BL,C.WH,C.TR,C.GD,C.TL,C.PK,C.OR];
  for(let i=0;i<12;i++) {
    const bx=55+i*3;
    const by=BASE-3 + Math.round(Math.sin(i*0.85+1)*1.5);
    if(bx>89) break;
    blk(bx,by,2,3,BUNTS[i]);
    px_(bx,by,C.OL); px_(bx+1,by,C.OL);
    if(i>0) {
      const pbx=55+(i-1)*3, pby=BASE-3+Math.round(Math.sin((i-1)*0.85+1)*1.5);
      bline(pbx+1,pby,bx,by,'#504050');
    }
  }
}

// 6. FERRIS WHEEL (left side, the HERO element)
//    Center: (20,26), Radius: 11
function drawFerrisWheel(t) {
  const fx=20, fy=26, fr=11;
  const ang = t * 0.0018; // rotation angle

  // A-frame support structure
  bline(fx,fy+fr,  fx-9,36, C.OL);
  bline(fx,fy+fr,  fx+9,36, C.OL);
  bline(fx-9,36,   fx+9,36, C.OL);
  // Cross brace
  bline(fx-6,33,   fx+6,33, C.OL);
  bline(fx-7,34,   fx-6,33, C.OL);
  bline(fx+7,34,   fx+6,33, C.OL);
  // Center axle post
  bline(fx,fy+fr-1, fx,36, C.OL);

  // Hub (drawn first, under spokes)
  fillCirc(fx,fy,3,'#484860');
  circle(fx,fy,3,C.OL);

  // 8 spokes
  for(let i=0;i<8;i++) {
    const a = ang + i*Math.PI/4;
    const sx = Math.round(fx + (fr-2)*Math.cos(a));
    const sy = Math.round(fy + (fr-2)*Math.sin(a));
    bline(fx,fy, sx,sy, '#707090');
  }

  // Outer rim — two rings for thickness
  circle(fx,fy,fr,  C.OL);
  circle(fx,fy,fr-1,'#505068');

  // 16 coloured rim lights (rotate with wheel)
  const LCOL=[C.GD,C.TR,C.TL,C.PK,C.OR,C.BL,C.WH,C.GD, C.TR,C.TL,C.PK,C.OR,C.BL,C.WH,C.GD,C.TR];
  for(let i=0;i<16;i++) {
    const a = ang + i*Math.PI/8;
    const lx=Math.round(fx + fr*Math.cos(a));
    const ly=Math.round(fy + fr*Math.sin(a));
    px_(lx,ly,LCOL[i]);
    // Twinkle: brighter alternate lights
    if(i%2===0) {
      const tw=(Math.sin(t*0.004+i)+1)*0.5;
      if(tw>0.5) px_(lx,ly,C.WH);
    }
  }

  // Hub centre cap
  fillCirc(fx,fy,2,'#909098');
  px_(fx,fy,C.WH);

  // 8 gondolas at spoke tips (coloured capsules)
  const GCOL=[C.TL,C.OR,C.PK,C.BL,C.TL,C.OR,C.PK,C.BL];
  for(let i=0;i<8;i++) {
    const a = ang + i*Math.PI/4;
    const gx=Math.round(fx + (fr+1)*Math.cos(a));
    const gy=Math.round(fy + (fr+1)*Math.sin(a));
    // Gondola body (3×4 capsule, hangs down from rim)
    // Gravity offset — gondola bottom always points down
    const hangA = Math.PI/2; // fixed downward
    fillCirc(gx,gy,2,GCOL[i]);
    blk(gx-1,gy,3,2,GCOL[i]);
    px_(gx,gy+2,C.OL);
    // Window highlight
    px_(gx-1,gy-1,C.WH);
    // Outline
    circle(gx,gy,2,C.OL);
  }
}

// 7. STRING LIGHTS  (catenary across sky, animated pulse)
function drawStringLights(t) {
  const LCOL=[C.GD,C.TR,C.TL,C.PK,C.OR,C.BL,C.WH,C.GD,C.TR,C.TL,C.PK,C.OR,C.BL,C.WH,C.GD];
  // Catenary: y offset = sag * sin(x/GW * π)
  const sag=3;
  let prevX=0, prevY=2+sag;
  for(let x=0;x<=GW;x++) {
    const y=Math.round(2 + sag*Math.sin((x/(GW-1))*Math.PI));
    // String
    if(x>0) bline(prevX,prevY, x,y, '#383038');
    prevX=x; prevY=y;
  }
  // Bulbs every 5 pixels
  for(let i=0;i<=(GW/5);i++) {
    const bx=i*5;
    const by=Math.round(2 + sag*Math.sin((bx/(GW-1))*Math.PI));
    const col=LCOL[i%LCOL.length];
    const tw=(Math.sin(t*0.003+i*1.3)+1)*0.5;
    px_(bx,by,col);
    if(tw>0.45) {
      px_(bx,by-1,col);  // bright bulb = 2 pixels tall
      // Glow halo (cross)
      if(tw>0.75) {
        px_(bx-1,by,col); px_(bx+1,by,col);
      }
    }
  }
}

// 8. SHOOTING STAR (occasional, animated)
function drawShootingStar(t) {
  // Fires every ~8s, lasts 1s
  const cycle=8000;
  const phase=t%cycle;
  if(phase>1200) return;
  const prog=phase/1200;
  const sx=Math.round(60+prog*20);
  const sy=Math.round(4+prog*8);
  px_(sx,sy,C.WH);
  // Tail
  for(let i=1;i<=5;i++) {
    const ta=i/5;
    const tx_=Math.round(sx-i*2);
    const ty_=Math.round(sy-i);
    if(tx_>=0&&ty_>=0) {
      const brightness=1-ta;
      if(brightness>0.6) px_(tx_,ty_,C.GD);
      else if(brightness>0.3) px_(tx_,ty_,'#805030');
    }
  }
}

// ─── MAIN RENDER LOOP ────────────────────────────────────────────────────────
function render(t) {
  // ── pixel canvas ──
  g.clearRect(0,0,GW,GH);

  drawSky();
  drawMoon();
  drawStars(t);
  drawShootingStar(t);
  drawGround();
  drawTent();
  drawFerrisWheel(t);
  drawStringLights(t);

  // ── scale up to display ──
  CTX.drawImage(buf, 0, 0, GW*P, GH*P);

  // ── CRT post-process ──
  // Scanlines
  CTX.fillStyle='rgba(0,0,0,0.09)';
  for(let y=0;y<GH*P;y+=2) CTX.fillRect(0,y,GW*P,1);

  // Vignette
  const vg=CTX.createRadialGradient(GW*P/2,GH*P/2,GH*P*0.25, GW*P/2,GH*P/2,GH*P*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.5)');
  CTX.fillStyle=vg;
  CTX.fillRect(0,0,GW*P,GH*P);

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
