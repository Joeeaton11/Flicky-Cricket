name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/friendly-bardeen-1e48u2, home-tidy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/play
          if [ ! -d www ]; then mkdir www && cp flicky-cricket.html www/index.html; fi
          cp -r www/. _site/play/
          cp -r site/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Tell Bing and other IndexNow engines about the pages (Nov 20, SEO)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          sleep 30
          KEY=$(ls site | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          URLS=$(grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed 's/<[^>]*>//g' | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -s -o /dev/null -w "IndexNow %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"flickycricket.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://flickycricket.com/$KEY.txt\",\"urlList\":$URLS}"
