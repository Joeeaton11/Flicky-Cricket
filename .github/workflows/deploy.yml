name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/friendly-bardeen-1e48u2, home-tidy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/play
          if [ ! -d www ]; then mkdir www && cp flicky-cricket.html www/index.html; fi
          cp -r www/. _site/play/
          cp -r site/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
