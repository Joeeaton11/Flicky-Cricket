<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Flicky Cricket Free – Arcade Cricket in Your Browser</title>
<link rel="canonical" href="https://flickycricket.com/play/"><meta name="robots" content="noindex">
<style>
@font-face{font-family:'Lilita One';src:url(assets/fonts/lilita.woff2) format('woff2')}
html,body{margin:0;height:100%;background:#071022;color:#fff;font-family:'Lilita One','Arial Black',Arial,sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;background:url(assets/ui/web/hero.webp) center/cover;filter:blur(2px) saturate(1.1);transform:scale(1.03)}
.bg:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(7,16,34,.35),rgba(7,16,34,.92) 75%)}
.wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:20px;box-sizing:border-box}
.phone{height:min(92vh,880px);aspect-ratio:9/19.5;border-radius:44px;border:12px solid #050A14;box-shadow:0 0 0 3px #2f4a85,0 30px 70px rgba(0,0,0,.6);overflow:hidden;background:#000;flex:none}
.phone iframe{width:100%;height:100%;border:0;display:block}
.side{width:300px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.side img.icon{width:96px;height:96px;border-radius:22px;border:3px solid #050A14;box-shadow:0 5px 0 #050A14}
.side h1{margin:0;font-weight:400;font-size:34px;line-height:1.05;color:#FFC93A;text-shadow:0 4px 0 #050A14}
.side p{margin:0;font:600 16px/1.45 Arial,sans-serif;color:#d6e2ff}
.qr{width:170px;height:170px;border-radius:14px;border:8px solid #fff;image-rendering:pixelated}
.badges{display:flex;gap:10px}.badges img{height:46px;display:block}
.small{font:600 13px Arial,sans-serif;color:#9fb3e0}
.home{color:#9fb3e0;font:600 14px Arial,sans-serif}
@media (max-width:820px){.side{display:none}}
</style></head><body><div class="bg"></div>
<div class="wrap">
  <div class="phone"><iframe id="g" title="Flicky Cricket" allow="autoplay; fullscreen; vibrate"></iframe></div>
  <div class="side">
    <img class="icon" alt="" src="assets/ui/badges/app_icon.webp">
    <h1>PLAYING ON A LAPTOP?</h1>
    <p>Flicky is made for your thumb. Scan to get the free app with 27 leagues, duels against real players, clubs and kit bags.</p>
    <img class="qr" alt="QR code to get the app" src="assets/ui/get_qr.webp">
    <div class="badges"><a href="https://apps.apple.com/app/id1090760276?ct=web_desk" target="_blank" rel="noopener"><img alt="Download on the App Store" src="assets/ui/badges/app_store.svg"></a>
      <a href="https://play.google.com/store/apps/details?id=com.flickycricket.app&referrer=utm_source%3Dweb%26utm_campaign%3Ddesk" target="_blank" rel="noopener"><img alt="Get it on Google Play" src="assets/ui/badges/google_play.png"></a></div>
    <div class="small">Free on iPhone &amp; Android</div>
    <a class="home" href="/">← flickycricket.com</a>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search); q.set('inframe', '1');
  document.getElementById('g').src = 'index.html?' + q.toString();
  document.getElementById('g').addEventListener('load', function () { try { this.contentWindow.focus(); } catch (e) {} });
</script>
</body></html>
