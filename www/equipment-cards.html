<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flicky Cricket — Equipment Cards</title>
<style>
  :root{--bg:#12151c;--card:#1e2230;--common:#9aa0b0;--common-d:rgba(154,160,176,0.35);--rare:#4a90d9;--rare-d:rgba(74,144,217,0.40);--epic:#9b59e8;--epic-d:rgba(155,89,232,0.40);--legendary:#e8a020;--legendary-d:rgba(232,160,32,0.45);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:28px 16px 56px;max-width:430px;margin:0 auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .topbar-title{font-size:12px;font-weight:700;letter-spacing:3px;color:#6a7080;text-transform:uppercase;}
  .coins{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;color:#f0c040;}
  .tabs{display:flex;gap:8px;margin-bottom:28px;}
  .tab{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;letter-spacing:1px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.45);border:1px solid transparent;cursor:pointer;}
  .tab.active{background:rgba(255,255,255,0.14);color:white;border-color:rgba(255,255,255,0.18);}
  .card{background:var(--card);border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,0.06);}
  .card.common{border-color:var(--common);box-shadow:0 0 20px var(--common-d);}
  .card.rare{border-color:var(--rare);box-shadow:0 0 24px var(--rare-d);}
  .card.epic{border-color:var(--epic);box-shadow:0 0 28px var(--epic-d);}
  .card.legendary{border-color:var(--legendary);box-shadow:0 0 32px var(--legendary-d);}
  .card-art{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .common .card-art{background:linear-gradient(160deg,#b8b4ac,#9a968e);}
  .rare .card-art{background:linear-gradient(160deg,#8aaac8,#6888aa);}
  .epic .card-art{background:linear-gradient(160deg,#9880c0,#7860a8);}
  .legendary .card-art{background:linear-gradient(160deg,#b89840,#907020);}
  .badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.50);backdrop-filter:blur(4px);border-radius:99px;padding:3px 8px;font-size:9px;font-weight:700;letter-spacing:1.5px;color:white;}
  .equipped{position:absolute;top:10px;right:10px;background:#22c45e;border-radius:99px;padding:3px 8px;font-size:9px;font-weight:700;letter-spacing:1px;color:white;}
  .lock{position:absolute;inset:0;background:rgba(0,0,0,0.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .lock-ico{font-size:28px;} .lock-lbl{font-size:10px;font-weight:700;letter-spacing:2px;}
  .common .lock-lbl{color:var(--common);}.rare .lock-lbl{color:var(--rare);}.epic .lock-lbl{color:var(--epic);}.legendary .lock-lbl{color:var(--legendary);}
  .info{padding:12px 14px 10px;}
  .iname{font-size:15px;font-weight:800;color:white;letter-spacing:0.5px;}
  .irarity{font-size:9px;font-weight:700;letter-spacing:2px;margin-top:2px;text-transform:uppercase;}
  .common .irarity{color:var(--common);}.rare .irarity{color:var(--rare);}.epic .irarity{color:var(--epic);}.legendary .irarity{color:var(--legendary);}
  .prog-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .prog-track{flex:1;height:4px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;}
  .prog-fill{height:100%;border-radius:99px;}
  .common .prog-fill{background:var(--common);}.rare .prog-fill{background:var(--rare);}.epic .prog-fill{background:var(--epic);}.legendary .prog-fill{background:var(--legendary);}
  .prog-val{font-size:10px;color:rgba(255,255,255,0.40);white-space:nowrap;}
  .hero-wrap{display:flex;justify-content:center;margin-bottom:32px;}
  .hero{width:215px;}.hero .card-art{height:290px;}.hero .iname{font-size:18px;}
  .sec{font-size:10px;font-weight:700;letter-spacing:3px;color:#5a6070;text-transform:uppercase;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid .card-art{height:185px;}
</style>
</head>
<body>
<div class="topbar"><span class="topbar-title">Flicky Cricket</span><span class="coins">4,005</span></div>
<div class="tabs"><div class="tab active">BAT</div><div class="tab">GLOVES</div><div class="tab">PADS</div><div class="tab">HELMET</div><div class="tab">SHOES</div></div>
<div class="hero-wrap"><div class="card common hero"><div class="card-art" id="h-art"><div class="badge">BAT</div><div class="equipped">EQUIPPED</div></div><div class="info"><div class="iname">The Blade</div><div class="irarity">Common</div><div class="prog-row"><div class="prog-track"><div class="prog-fill" style="width:95%"></div></div><span class="prog-val">19/20</span></div></div></div></div>
<div class="sec">Bat Collection</div>
<div class="grid">
  <div class="card rare"><div class="card-art" id="a1"><div class="badge">BAT</div></div><div class="info"><div class="iname">The Cobra</div><div class="irarity">Rare</div><div class="prog-row"><div class="prog-track"><div class="prog-fill" style="width:20%"></div></div><span class="prog-val">4/10</span></div></div></div>
  <div class="card common"><div class="card-art" id="a2"><div class="badge">BAT</div></div><div class="info"><div class="iname">The Slogger</div><div class="irarity">Common</div><div class="prog-row"><div class="prog-track"><div class="prog-fill" style="width:65%"></div></div><span class="prog-val">13/20</span></div></div></div>
  <div class="card epic"><div class="card-art" id="a3"><div class="badge">BAT</div><div class="lock"><div class="lock-ico">🔒</div><div class="lock-lbl">EPIC</div></div></div><div class="info"><div class="iname">The Mongoose</div><div class="irarity">Epic</div><div class="prog-row"><div class="prog-track"><div class="prog-fill" style="width:0%"></div></div><span class="prog-val">0/20</span></div></div></div>
  <div class="card legendary"><div class="card-art" id="a4"><div class="badge">BAT</div><div class="lock"><div class="lock-ico">🔒</div><div class="lock-lbl">LEGENDARY</div></div></div><div class="info"><div class="iname">The Ashes</div><div class="irarity">Legendary</div><div class="prog-row"><div class="prog-track"><div class="prog-fill" style="width:0%"></div></div><span class="prog-val">0/50</span></div></div></div>
</div>

<script>
const BATS = {
  blade:   {c1:'#c81020',c2:'#8a000e',name:'THE BLADE'},
  cobra:   {c1:'#1244d0',c2:'#06289a',name:'THE COBRA'},
  slogger: {c1:'#cc4808',c2:'#8a2c00',name:'THE SLOGGER'},
  mongoose:{c1:'#7a18cc',c2:'#4e0890',name:'THE MONGOOSE'},
  ashes:   {c1:'#b88c08',c2:'#7a5800',name:'THE ASHES'},
};

function makeBat(key) {
  const b = BATS[key];
  // ── Geometry — traced from Kookaburra reference photos ─────────────
  // ViewBox 200×340.
  // Blade is DOMINANT: 180px wide = 90% of viewbox. Blade fills the card.
  // Handle: 22px wide. Ratio 8.2:1.
  // Shoulder: gentle inward curve at blade top, then narrow handle.
  // This matches the actual Kookaburra silhouette.
  //
  const hx1=89, hx2=111;    // handle 22px wide
  const bx1=24, bx2=176;   // blade 152px wide
  const gripTop=14;
  const gripBot=100;
  const sholY=114;          // shoulder/blade top — FLAT horizontal step here
  const bladeBot=298;
  const toeY=312;

  // Flat horizontal shoulder — the cricket bat "T" shape
  // Grip goes straight down → steps horizontally outward → blade goes straight down
  // Small radius fillet at the two inside corners (rx=6 on the step)
  const O = 'M'+hx1+','+gripTop
    +' L'+hx1+','+gripBot
    +' Q'+hx1+','+sholY+' '+(hx1-6)+','+sholY   // left inner fillet
    +' L'+bx1+','+sholY
    +' L'+bx1+','+bladeBot
    +' Q100,'+toeY+' '+bx2+','+bladeBot
    +' L'+bx2+','+sholY
    +' L'+(hx2+6)+','+sholY
    +' Q'+hx2+','+sholY+' '+hx2+','+gripBot      // right inner fillet
    +' L'+hx2+','+gripTop+' Z';

  const BL='M'+bx1+','+sholY+' L'+bx1+','+bladeBot+' Q100,'+toeY+' '+bx2+','+bladeBot+' L'+bx2+','+sholY+' Z';

  let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 330" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display:block">';
  s+='<defs>';
  s+='<filter id="sh'+key+'" x="-15%" y="-4%" width="130%" height="112%"><feDropShadow dx="3" dy="7" stdDeviation="8" flood-color="rgba(0,0,0,0.55)"/></filter>';
  // Willow: pale cream, top-to-bottom only (NO left-right gradient = flat face, not cylinder)
  s+='<linearGradient id="wd'+key+'" x1="0" y1="0" x2="0" y2="1">';
  s+='<stop offset="0%" stop-color="#faf6e8"/>';
  s+='<stop offset="40%" stop-color="#f4eccc"/>';
  s+='<stop offset="100%" stop-color="#e6d8a0"/></linearGradient>';
  // Left edge bevel (dark strip on each side shows the bat is a flat slab not a cylinder)
  s+='<linearGradient id="bv'+key+'" x1="0" y1="0" x2="1" y2="0">';
  s+='<stop offset="0%" stop-color="rgba(40,20,0,0.22)"/>';
  s+='<stop offset="4%" stop-color="rgba(0,0,0,0)"/>';
  s+='<stop offset="96%" stop-color="rgba(0,0,0,0)"/>';
  s+='<stop offset="100%" stop-color="rgba(40,20,0,0.22)"/></linearGradient>';
  // Sticker
  s+='<linearGradient id="sk'+key+'" x1="0" y1="0" x2="0" y2="1">';
  s+='<stop offset="0%" stop-color="'+b.c1+'"/>';
  s+='<stop offset="100%" stop-color="'+b.c2+'"/></linearGradient>';
  // Grip: lateral gradient shows round cross-section
  s+='<linearGradient id="gp'+key+'" x1="0" y1="0" x2="1" y2="0">';
  s+='<stop offset="0%" stop-color="'+b.c2+'"/>';
  s+='<stop offset="20%" stop-color="'+b.c1+'"/>';
  s+='<stop offset="50%" stop-color="'+b.c1+'"/>';
  s+='<stop offset="80%" stop-color="'+b.c2+'"/>';
  s+='<stop offset="100%" stop-color="'+b.c2+'"/></linearGradient>';
  s+='<clipPath id="clF'+key+'"><path d="'+O+'"/></clipPath>';
  s+='<clipPath id="clB'+key+'"><path d="'+BL+'"/></clipPath>';
  s+='</defs>';

  // Drop shadow behind bat
  s+='<g filter="url(#sh'+key+')"><path d="'+O+'" fill="url(#wd'+key+')"/></g>';

  // Wood face
  s+='<path d="'+O+'" fill="url(#wd'+key+')"/>';

  // Edge bevel (thin dark gradient on left/right edges of blade — makes it look flat, not cylindrical)
  s+='<rect x="'+bx1+'" y="'+sholY+'" width="'+(bx2-bx1)+'" height="'+(bladeBot-sholY)+'"';
  s+=' fill="url(#bv'+key+')" clip-path="url(#clB'+key+')"/>';

  // Press grain lines
  s+='<g clip-path="url(#clB'+key+')" stroke="rgba(80,52,10,0.16)" stroke-width="0.9" fill="none">';
  for(let x=28; x<=172; x+=4){ s+='<line x1="'+x+'" y1="'+sholY+'" x2="'+x+'" y2="'+bladeBot+'"/>'; }
  s+='</g>';

  // ── STICKER — full blade width, upper blade ──
  const stkY = sholY + 6;
  const stkH = 82;
  const stkW = bx2 - bx1;
  s+='<rect x="'+bx1+'" y="'+stkY+'" width="'+stkW+'" height="'+stkH+'"';
  s+=' fill="url(#sk'+key+')" clip-path="url(#clB'+key+')"/>';
  // Left accent strip
  s+='<rect x="'+bx1+'" y="'+stkY+'" width="18" height="'+stkH+'"';
  s+=' fill="'+b.c2+'" clip-path="url(#clB'+key+')"/>';
  s+='<rect x="'+(bx1+18)+'" y="'+stkY+'" width="2.5" height="'+stkH+'"';
  s+=' fill="rgba(255,255,255,0.22)" clip-path="url(#clB'+key+')"/>';
  // Sheen
  s+='<polygon points="'+(bx1+22)+','+stkY+' '+bx2+','+stkY+' '+bx2+','+(stkY+24)+'"';
  s+=' fill="rgba(255,255,255,0.10)" clip-path="url(#clB'+key+')"/>';
  // Bottom shadow
  s+='<rect x="'+bx1+'" y="'+(stkY+stkH-2)+'" width="'+stkW+'" height="2.5"';
  s+=' fill="rgba(0,0,0,0.28)" clip-path="url(#clB'+key+')"/>';

  // Text
  const txC = (bx1+22 + bx2) / 2;
  s+='<text x="'+txC+'" y="'+(stkY+stkH*0.38)+'" text-anchor="middle" dominant-baseline="middle"';
  s+=' font-family="\'Arial Black\',Impact,sans-serif" font-size="22" font-weight="900" letter-spacing="1" fill="white">FLICKY</text>';
  s+='<text x="'+txC+'" y="'+(stkY+stkH*0.70)+'" text-anchor="middle" dominant-baseline="middle"';
  s+=' font-family="\'Arial Black\',Impact,sans-serif" font-size="8" font-weight="700" letter-spacing="4" fill="rgba(255,255,255,0.58)">CRICKET</text>';

  // Bat name on bare wood
  const nameY = stkY + stkH + 14;
  s+='<text x="100" y="'+nameY+'" text-anchor="middle" dominant-baseline="middle"';
  s+=' font-family="\'Arial Black\',Impact,sans-serif" font-size="7.5" font-weight="800" fill="rgba(55,34,4,0.36)">'+b.name+'</text>';

  // Wicket icon
  const wy = nameY+24;
  [89,100,111].forEach(cx=>{
    s+='<rect x="'+(cx-1.5)+'" y="'+(wy-11)+'" width="3" height="22" rx="1" fill="rgba(55,34,4,0.24)"/>';
  });
  s+='<rect x="88" y="'+(wy-14)+'" width="12" height="2.5" rx="1" fill="rgba(55,34,4,0.29)"/>';
  s+='<rect x="99" y="'+(wy-14)+'" width="12" height="2.5" rx="1" fill="rgba(55,34,4,0.29)"/>';

  // Bat outline (gives crisp edge, makes blade pop from card background)
  s+='<path d="'+O+'" fill="none" stroke="rgba(30,16,2,0.35)" stroke-width="1.8"/>';

  // ── COLLAR (black rubber band just above shoulder) ──
  s+='<rect x="'+(hx1-1)+'" y="'+gripBot+'" width="24" height="14" rx="2" fill="#0e0804"/>';
  s+='<rect x="'+hx1+'" y="'+(gripBot+1)+'" width="22" height="3" rx="1" fill="rgba(255,255,255,0.08)"/>';

  // ── GRIP ──
  s+='<rect x="'+hx1+'" y="'+gripTop+'" width="22" height="'+(gripBot-gripTop)+'" rx="4" fill="url(#gp'+key+')"/>';
  // Diagonal grip tape
  s+='<g clip-path="url(#clF'+key+')" fill="none" stroke="rgba(0,0,0,0.40)" stroke-width="3.2" stroke-linecap="butt">';
  for(let i=0;i<18;i++){
    const y0=gripTop+5+i*5;
    if(y0<gripBot-1){ s+='<line x1="'+hx1+'" y1="'+y0+'" x2="'+hx2+'" y2="'+(y0-5)+'"/>'; }
  }
  s+='</g>';
  s+='<g clip-path="url(#clF'+key+')" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" stroke-linecap="butt">';
  for(let i=0;i<18;i++){
    const y0=gripTop+8+i*5;
    if(y0<gripBot-1){ s+='<line x1="'+hx1+'" y1="'+y0+'" x2="'+hx2+'" y2="'+(y0-5)+'"/>'; }
  }
  s+='</g>';
  s+='<rect x="'+hx1+'" y="'+(gripTop+4)+'" width="5" height="'+(gripBot-gripTop-8)+'" rx="2.5" fill="rgba(255,255,255,0.18)"/>';

  // ── KNOB ──
  s+='<ellipse cx="100" cy="'+(gripTop+9)+'" rx="17" ry="10" fill="'+b.c2+'"/>';
  s+='<ellipse cx="100" cy="'+(gripTop+6)+'" rx="11" ry="6" fill="'+b.c1+'"/>';
  s+='<ellipse cx="95" cy="'+(gripTop+4)+'" rx="4" ry="2.5" fill="rgba(255,255,255,0.25)"/>';

  s+='</svg>';
  return s;
}

document.getElementById('h-art').insertAdjacentHTML('beforeend', makeBat('blade'));
document.getElementById('a1').insertAdjacentHTML('beforeend', makeBat('cobra'));
document.getElementById('a2').insertAdjacentHTML('beforeend', makeBat('slogger'));
document.getElementById('a3').insertAdjacentHTML('beforeend', makeBat('mongoose'));
document.getElementById('a4').insertAdjacentHTML('beforeend', makeBat('ashes'));
</script>
</body>
</html>
