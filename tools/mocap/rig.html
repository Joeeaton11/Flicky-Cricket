  return pts.map(p => { const v = (Array.isArray(p) ? new THREE.Vector3(...p) : p).clone().project(c); return [(v.x + 1) / 2 * WD * 2, (1 - v.y) / 2 * HT * 2]; }); };

  for (const dx of [-17, 17]) for (const dy of [-17, 17]) for (const dz of [-14, 17]) out.push(c.clone().add(new THREE.Vector3(dx, dy, dz))); return out; };
