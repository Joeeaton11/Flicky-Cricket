<title>Deep Cup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@500;600&display=swap');
/* Layout: same league card shell as the other cards — sunken Atlantis under the sea, above a stats grid */
:root {
  color-scheme: dark;
  --page: #08060c;
  --card: #100c14;
  --ink: #ffffff;
  --muted: rgba(255,255,255,0.36);
  --tier: #ffd75e;
  --gold: #f0c030;
  --eng: #80f8ff;
  --silver: #b8c8d8;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 16px;
}
.card {
  width: min(540px, 100%);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.70),
    0 60px 120px rgba(0,0,0,0.40);
}
.art { position: relative; line-height: 0; }
canvas { display: block; width: 100%; height: auto; background: #0e5a86; }
.ovl {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 70px 18px 16px;
  background: linear-gradient(to bottom,
    rgba(16,12,20,0)    0%,
    rgba(16,12,20,0.52) 30%,
    rgba(16,12,20,0.92) 62%,
    rgba(16,12,20,1)   100%);
  pointer-events: none;
}
.pip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--display);
  font-weight: 700; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tier); margin-bottom: 8px;
}
.pip::before {
  content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--tier); box-shadow: 0 0 8px var(--tier);
}
.nm {
  font-family: var(--display); font-weight: 900;
  font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  color: var(--ink); text-shadow: 0 2px 24px rgba(0,0,0,1); margin-bottom: 5px;
}
.sub {
  font-family: var(--display); font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.info {
  padding: 13px 16px 17px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 9px 13px;
}
.lbl { display:block; font-family:var(--display); font-weight:700; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.26); margin-bottom:4px; }
.val { font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.02em; line-height:1; font-variant-numeric: tabular-nums; }
.cw { color:rgba(255,255,255,0.82); }
.cy { color:var(--gold); }
.ce { color:var(--eng); }
.cs { color:var(--silver); }
</style>

<div class="card">
  <div class="art">
    <canvas id="c" width="620" height="355" aria-label="Sunken Atlantis under a bright sea: the domes and towers of the drowned city in the blue haze, a shipwreck on the left, temple ruins on the right, coral and swaying kelp, light rippling on the sand; a school of fish, a sea turtle and jellyfish; a humpback whale glides overhead; at the centre the Trident of Atlantis, a gold trident holding a glowing orb, which flares and lights up the city"></canvas>
    <div class="ovl">
      <div class="pip">Tier 6 · Wildest Worlds</div>
      <div class="nm">Deep Cup</div>
      <div class="sub">Atlantis Cricket · The Trident of Atlantis</div>
    </div>
  </div>
  <div class="info">
    <div class="stat"><span class="lbl">Entry Cost</span><span class="val cw">12,000 coins</span></div>
    <div class="stat"><span class="lbl">Win Reward</span><span class="val cy">+14,400</span></div>
    <div class="stat"><span class="lbl">Unlock</span><span class="val ce">615 Trophies</span></div>
    <div class="stat"><span class="lbl">Prize</span><span class="val cs">Platinum Chest</span></div>
  </div>
</div>


<script>
const PI = Math.PI, TAU = PI * 2;
const SHOW = 24.0;                                 // length of the shared schedule, seconds
// the story: a bright calm sea over sunken Atlantis; the turtle paddles across, the school of fish wheels over the reef → a humpback whale glides
// overhead, its shadow sweeping the sand, and the school scatters and re-forms (headline 1) → the trident's orb gathers light and flares; a ring of
// light runs out across the sand and Atlantis wakes, its domes and windows lighting up from the centre outward, then slowly dims (headline 2)
const WHALE = [4.0, 13.0];                         // the whale's pass, right to left
const WAKE = [14.5, 21.5];                         // the trophy flares and the city lights up
const TURTLE_LAP = 24.0;                           // the turtle crosses once a loop, left to right
function win(m, [a, b]) { return m >= a && m <= b ? (m - a) / (b - a) : -1; }
const ease = (u) => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const lerp = (a, b, u) => a + (b - a) * u;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mkRnd = (s) => { let q = s; return () => { q = (q * 16807) % 2147483647; return (q - 1) / 2147483646; }; };
const poly = (ctx, pts) => { ctx.beginPath(); pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); };
const line = (ctx, pts) => { ctx.beginPath(); pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); };
function smooth(ctx, pts) { const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; const s = mid(pts[n - 1], pts[0]); ctx.beginPath(); ctx.moveTo(s[0], s[1]); for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n], m = mid(p, q); ctx.quadraticCurveTo(p[0], p[1], m[0], m[1]); } ctx.closePath(); }
const sideGrad = (ctx, cx, R, stops) => { const g = ctx.createLinearGradient(cx - R, 0, cx + R, 0); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
const GOLD = [[0, '#7a4e14'], [0.16, '#f0c868'], [0.26, '#fff2c4'], [0.38, '#e2b048'], [0.68, '#a87020'], [1, '#4e300c']];
function gem(ctx, x, y, r, c0, c1) { const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r); g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, c0); g.addColorStop(1, c1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function soft(ctx, x, y, r, col, a) { if (a <= 0.002) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${col},${Math.min(1, a).toFixed(3)})`); g.addColorStop(1, `rgba(${col},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
const HZ = 0.60;                                   // where the far sea floor meets the haze
const SAND = 0.70;                                 // the near sand's edge
const CITY = { x: 0.665, y: 0.585 };                 // the centre of the city, behind the trophy: the wake spreads out from here

// the temple ruins are drawn at their original size and shrunk toward their right-hand foot, so the city can stand clear beside them
const RT = { ax: 604, ay: 258, s: 0.76 };
function ruinT(ctx) { ctx.translate(RT.ax, RT.ay); ctx.scale(RT.s, RT.s); ctx.translate(-RT.ax, -RT.ay); }
const ruinP = (x, y) => [RT.ax + (x - RT.ax) * RT.s, RT.ay + (y - RT.ay) * RT.s];

// ════════ THE SEA TURTLE — a green turtle in profile, swimming right: a domed shell of plates, a beaked head on a wrinkled neck,
// long front flippers that sweep down and back together, small rear flippers trailing ════════
function seaTurtle(c, x, y, s, t, ph) {
  c.save(); c.translate(x, y); c.scale(s, s);
  const st = Math.sin(t * 1.6 + ph), fl = st * 0.6;                                   // the stroke: front flippers sweep through ±0.75 rad
  const flipper = (far, L) => { c.save(); c.translate(far ? 10 : 13, far ? 1 : 5); c.rotate(-0.3 + fl * (far ? 0.8 : 0.9));
    const g = c.createLinearGradient(0, 0, -L, 0); g.addColorStop(0, far ? '#3a5a38' : '#5a7a4a'); g.addColorStop(1, far ? '#2a4428' : '#7a9a5a'); c.fillStyle = g;
    c.beginPath(); c.moveTo(0, -3); c.quadraticCurveTo(-L * 0.45, -9, -L, -2); c.quadraticCurveTo(-L * 0.5, 4, 0, 4); c.closePath(); c.fill();
    if (!far) { c.fillStyle = 'rgba(30,50,30,0.5)'; for (let k = 1; k < 5; k++) { c.beginPath(); c.ellipse(-L * k / 5.4, -1.5, 2.2, 1.4, 0, 0, TAU); c.fill(); } }
    c.restore(); };
  flipper(true, 34);
  // rear flippers
  c.fillStyle = '#3e5e3a'; c.save(); c.translate(-20, 5); c.rotate(-0.4 - st * 0.2); c.beginPath(); c.ellipse(-7, 0, 9, 3.4, 0, 0, TAU); c.fill(); c.restore();
  // the head and neck reaching forward
  c.fillStyle = '#6a8a58'; c.beginPath(); c.moveTo(18, -4); c.quadraticCurveTo(28, -7, 34, -5); c.quadraticCurveTo(41, -4, 41, 1); c.quadraticCurveTo(38, 5, 31, 5); c.quadraticCurveTo(24, 6, 18, 6); c.closePath(); c.fill();
  c.fillStyle = 'rgba(40,60,36,0.5)'; [[30, -3, 3], [26, 1, 2.4], [35, -1, 2]].forEach(([a, b, r]) => { c.beginPath(); c.arc(a, b, r * 0.6, 0, TAU); c.fill(); });   // head scales
  c.fillStyle = '#d8d0a0'; c.beginPath(); c.moveTo(38, 2); c.quadraticCurveTo(41, 3, 40.5, 1); c.lineTo(41, 0.5); c.fill();   // the beak
  c.fillStyle = '#101810'; c.beginPath(); c.arc(35.5, -2.2, 1.3, 0, TAU); c.fill(); c.fillStyle = '#fff'; c.fillRect(35.6, -2.9, 0.6, 0.6);
  // the shell: a dome with a pale plastron below and scutes on top
  c.fillStyle = '#e8d8a0'; c.beginPath(); c.ellipse(-1, 4, 23, 5, 0, 0, PI); c.fill();
  const sg = c.createLinearGradient(0, -18, 0, 6); sg.addColorStop(0, '#8a7a3a'); sg.addColorStop(0.5, '#6a5a2a'); sg.addColorStop(1, '#3a3218'); c.fillStyle = sg;
  c.beginPath(); c.moveTo(-24, 4); c.bezierCurveTo(-22, -14, 14, -18, 22, 3); c.closePath(); c.fill();
  c.save(); c.beginPath(); c.moveTo(-24, 4); c.bezierCurveTo(-22, -14, 14, -18, 22, 3); c.closePath(); c.clip();
  c.strokeStyle = 'rgba(240,220,150,0.55)'; c.lineWidth = 1;
  [[-14, -2, 7, 6], [-2, -6, 8, 7], [10, -3, 7, 6], [-8, -10, 6, 4], [4, -11, 6, 4]].forEach(([a, b, w, h]) => { c.beginPath(); c.moveTo(a - w, b); c.lineTo(a - w * 0.5, b - h); c.lineTo(a + w * 0.5, b - h); c.lineTo(a + w, b); c.lineTo(a + w * 0.5, b + h); c.lineTo(a - w * 0.5, b + h); c.closePath(); c.stroke(); });
  c.fillStyle = 'rgba(255,240,180,0.25)'; c.beginPath(); c.ellipse(-2, -10, 14, 4, -0.1, 0, TAU); c.fill();   // light on its back
  c.restore();
  c.strokeStyle = 'rgba(30,24,10,0.7)'; c.lineWidth = 1; c.beginPath(); c.moveTo(-24, 4); c.lineTo(22, 3); c.stroke();
  flipper(false, 40);
  c.restore();
}
// ════════ THE HUMPBACK WHALE — profile, swimming left: a long body with a knobbly snout, ventral grooves, a pale belly, a small dorsal hump,
// very long white-edged pectoral fins, and flukes that beat slowly up and down ════════
function whale(c, x, y, s, t) {
  c.save(); c.translate(x, y); c.scale(s, s);
  const beat = Math.sin(t * 1.1), tailY = beat * 9, finA = Math.sin(t * 1.1 - 1) * 0.12;
  // far pectoral fin, darker, behind the body
  c.save(); c.translate(-34, 8); c.rotate(0.55 + finA); c.fillStyle = '#16304a'; c.beginPath(); c.moveTo(0, -4); c.quadraticCurveTo(30, -6, 66, 6); c.quadraticCurveTo(34, 8, 0, 5); c.closePath(); c.fill(); c.restore();
  // the body: blunt head at left, tapering to the tail stock, which bends with the beat
  const body = () => { c.beginPath(); c.moveTo(-100, 0);
    c.bezierCurveTo(-98, -16, -60, -24, -10, -22); c.bezierCurveTo(30, -20, 70, -12, 104, -4 + tailY * 0.6);
    c.lineTo(108, 2 + tailY * 0.7); c.bezierCurveTo(70, 8, 30, 20, -20, 22); c.bezierCurveTo(-70, 22, -98, 14, -100, 0); c.closePath(); };
  body(); const g = c.createLinearGradient(0, -24, 0, 22); g.addColorStop(0, '#1a3a58'); g.addColorStop(0.55, '#2a5070'); g.addColorStop(0.75, '#6a90a8'); g.addColorStop(1, '#a8c4d0'); c.fillStyle = g; c.fill();
  c.save(); body(); c.clip();
  c.strokeStyle = 'rgba(20,40,60,0.45)'; c.lineWidth = 1.1; for (let k = 0; k < 9; k++) { const yy = 10 + k * 1.6; c.beginPath(); c.moveTo(-94 + k * 1.5, yy); c.quadraticCurveTo(-60, yy + 3, -26 + k * 2, yy + 1); c.stroke(); }   // throat grooves
  c.fillStyle = 'rgba(220,235,240,0.5)'; [[-88, -12], [-80, -16], [-72, -18], [-90, -4], [-84, -8]].forEach(([a, b]) => { c.beginPath(); c.arc(a, b, 1.8, 0, TAU); c.fill(); });   // tubercles on the snout
  c.fillStyle = 'rgba(160,210,240,0.22)'; c.beginPath(); c.ellipse(-20, -18, 70, 5, 0.02, 0, TAU); c.fill();   // sunlight on its back
  c.restore();
  c.fillStyle = '#1a3a58'; c.beginPath(); c.moveTo(40, -17); c.quadraticCurveTo(48, -24, 54, -15); c.closePath(); c.fill();   // the dorsal hump
  c.fillStyle = '#0a1828'; c.beginPath(); c.arc(-74, 4, 1.8, 0, TAU); c.fill(); c.strokeStyle = 'rgba(10,24,40,0.6)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-100, 2); c.quadraticCurveTo(-82, 8, -62, 6); c.stroke();   // eye and mouth line
  // the flukes, seen nearly edge-on, beating
  c.save(); c.translate(106, 1 + tailY * 0.7); c.rotate(beat * 0.35); c.fillStyle = '#1a3a58'; c.beginPath(); c.moveTo(0, -2); c.quadraticCurveTo(12, -16, 28, -20); c.quadraticCurveTo(18, -6, 22, 0); c.quadraticCurveTo(18, 6, 28, 18); c.quadraticCurveTo(12, 14, 0, 2); c.closePath(); c.fill();
  c.fillStyle = 'rgba(200,220,230,0.5)'; c.beginPath(); c.moveTo(4, 2); c.quadraticCurveTo(14, 12, 26, 16); c.quadraticCurveTo(14, 10, 4, 1); c.fill(); c.restore();
  // near pectoral fin: long, white underneath with a knobbly leading edge
  c.save(); c.translate(-40, 10); c.rotate(0.45 + finA); const fg = c.createLinearGradient(0, -6, 0, 8); fg.addColorStop(0, '#2a4a68'); fg.addColorStop(1, '#d8e8f0'); c.fillStyle = fg;
  c.beginPath(); c.moveTo(0, -5); c.quadraticCurveTo(34, -8, 74, 4); c.quadraticCurveTo(38, 10, 0, 6); c.closePath(); c.fill();
  c.fillStyle = 'rgba(230,240,245,0.8)'; for (let k = 1; k < 7; k++) { c.beginPath(); c.arc(k * 10, -5 + k * 1.2, 1.4, 0, TAU); c.fill(); } c.restore();
  c.restore();
}
// ════════ A JELLYFISH — a translucent pulsing bell with frilled arms and long trailing tentacles ════════
function jelly(c, x, y, s, t, ph) {
  const p = 0.5 + 0.5 * Math.sin(t * 2.2 + ph), w = 12 * s * (0.85 + 0.25 * (1 - p)), h = 10 * s * (0.8 + 0.3 * p);
  c.save(); c.globalCompositeOperation = 'lighter'; soft(c, x, y, w * 2.4, '255,150,220', 0.12); c.restore();
  c.strokeStyle = 'rgba(255,200,235,0.35)'; c.lineWidth = 0.8 * s; for (let k = 0; k < 6; k++) { const ox = x + (k - 2.5) * w * 0.32; c.beginPath(); c.moveTo(ox, y); for (let j = 1; j <= 8; j++) c.lineTo(ox + Math.sin(t * 1.6 + j * 0.8 + k + ph) * 2.5 * s, y + j * 5 * s); c.stroke(); }
  c.fillStyle = 'rgba(255,170,220,0.45)'; for (let k = 0; k < 3; k++) { c.beginPath(); c.ellipse(x + (k - 1) * w * 0.3, y + 6 * s, 2.2 * s, 7 * s, Math.sin(t + k) * 0.2, 0, TAU); c.fill(); }   // oral arms
  const g = c.createRadialGradient(x, y - h * 0.6, 1, x, y - h * 0.3, w); g.addColorStop(0, 'rgba(255,240,250,0.8)'); g.addColorStop(0.6, 'rgba(255,160,215,0.5)'); g.addColorStop(1, 'rgba(230,110,190,0.25)'); c.fillStyle = g;
  c.beginPath(); c.moveTo(x - w, y); c.bezierCurveTo(x - w, y - h * 1.3, x + w, y - h * 1.3, x + w, y); for (let k = 0; k <= 8; k++) c.lineTo(x + w - k * w / 4, y + (k % 2 ? 2 : 0) * s); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,220,240,0.6)'; c.lineWidth = 0.8; c.beginPath(); c.ellipse(x, y - h * 0.45, w * 0.45, h * 0.35, 0, 0, TAU); c.stroke();
}

// ════════ STILL SCENE — the sea, the drowned city in the haze, the shipwreck, the temple ruins, the sand, the coral and the stumps ════════
// the city's windows, placed once so the wake can light the same ones the still layer draws dark
const WINDOWS = [], DOMES = [];
const WATER = (y) => { const u = y; return u < 0.5 ? [lerp(70, 22, u * 2), lerp(190, 112, u * 2), lerp(214, 160, u * 2)] : [lerp(22, 8, (u - 0.5) * 2), lerp(112, 60, (u - 0.5) * 2), lerp(160, 104, (u - 0.5) * 2)]; };
const haze = (y, a) => { const [r, g, b] = WATER(y); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
function building(ctx, W, H, b, rnd, dist) {   // one city building: a drum, a hall or a tower, lit from above, its windows recorded
  const { x, base, w, h, kind } = b, X = W * x, B = H * base, top = B - h, wall = dist ? ['#3e86a4', '#2c6c8c'] : ['#4a92ac', '#2e6c88'];
  const g = ctx.createLinearGradient(0, top, 0, B); g.addColorStop(0, wall[0]); g.addColorStop(1, wall[1]); ctx.fillStyle = g;
  if (kind === 'dome') { DOMES.push([X, top + w * 0.47, w / 2, Math.hypot(X - W * CITY.x, (top - H * CITY.y) * 1.6), dist]); ctx.fillRect(X - w / 2, top + w * 0.45, w, h - w * 0.45); ctx.beginPath(); ctx.arc(X, top + w * 0.47, w / 2, PI, TAU); ctx.fill();
    ctx.fillStyle = dist ? '#78bccc' : '#8ad0dc'; ctx.beginPath(); ctx.arc(X, top + w * 0.47, w / 2, PI * 1.05, PI * 1.55); ctx.lineTo(X, top + w * 0.47); ctx.fill();   // light on the dome
    ctx.strokeStyle = 'rgba(20,70,95,0.4)'; ctx.lineWidth = 0.8; for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.ellipse(X, top + w * 0.47, Math.abs(k) * w * 0.12 + 0.1, w / 2, 0, PI, TAU); ctx.stroke(); }   // ribs
    ctx.fillStyle = wall[0]; ctx.fillRect(X - 1.6, top - w * 0.12, 3.2, w * 0.16); ctx.fillStyle = dist ? '#a89060' : '#d8b860'; ctx.beginPath(); ctx.arc(X, top - w * 0.14, 1.8, 0, TAU); ctx.fill(); }
  else if (kind === 'tower') { ctx.fillRect(X - w / 2, top + w, w, h - w); ctx.beginPath(); ctx.moveTo(X - w / 2 - 2, top + w); ctx.lineTo(X, top - w * 0.6); ctx.lineTo(X + w / 2 + 2, top + w); ctx.fill();
    ctx.fillStyle = 'rgba(150,220,235,0.35)'; ctx.beginPath(); ctx.moveTo(X, top - w * 0.6); ctx.lineTo(X - w / 2 - 2, top + w); ctx.lineTo(X - w * 0.1, top + w); ctx.fill();
    ctx.fillStyle = 'rgba(160,225,240,0.4)'; for (let y = top + w + 10; y < B - 6; y += 16) ctx.fillRect(X - w / 2 - 1, y, w + 2, 1.6);   // bands
    ctx.fillStyle = wall[1]; ctx.fillRect(X - w / 2 - 3, top + w + 2, w + 6, 3);   // a balcony ring
    ctx.fillStyle = dist ? '#a89060' : '#e0c060'; ctx.beginPath(); ctx.moveTo(X - 1.4, top - w * 0.45); ctx.lineTo(X, top - w * 0.6 - 7); ctx.lineTo(X + 1.4, top - w * 0.45); ctx.fill(); }   // a gilded tip
  else { ctx.fillRect(X - w / 2, top + 6, w, h - 6); ctx.beginPath(); ctx.moveTo(X - w / 2 - 3, top + 6); ctx.lineTo(X, top - 3); ctx.lineTo(X + w / 2 + 3, top + 6); ctx.fill();   // a columned hall with a pediment
    ctx.strokeStyle = dist ? 'rgba(20,70,95,0.6)' : 'rgba(20,70,95,0.7)'; ctx.lineWidth = 1; for (let cx = X - w / 2 + 3; cx < X + w / 2 - 1; cx += 5) { line(ctx, [[cx, top + 8], [cx, B]]); ctx.stroke(); } }
  ctx.fillStyle = 'rgba(160,225,240,0.28)'; ctx.fillRect(X - w / 2, top + (kind === 'dome' ? w * 0.45 : kind === 'tower' ? w : 6), w, 1.2);   // a lit cornice

// ════════ THE HUMPBACK, redrawn: a long streamlined body that flexes with each fluke beat, a knobbly flat head, throat grooves running back to

// ════════ THE WRECK, ALIVE — its torn sail stirs in the current; an octopus arm curls out of a gun port, feels about and draws back in;

  { const px = -18, py = lerp(wreckCurve(SHEER, px), wreckCurve(KEEL, px), 0.27), cyc = (t % 12) / 12, ext = Math.max(0, Math.min(1, Math.sin(cyc * PI) * 1.6));

      for (let i = 0; i <= N; i++) { const u = i / N, a = -2.1 + u * (0.5 + Math.sin(t * 1.3) * 0.5) + u * u * 1.6 * (0.6 + 0.4 * Math.sin(t * 0.9 + 1)) + u ** 4 * 4.2; pts.push(i === 0 ? [px, py] : null); if (i) { const [x0, y0] = pts[i - 1]; pts[i] = [x0 + Math.cos(a) * L / N, y0 + Math.sin(a) * L / N]; } }
