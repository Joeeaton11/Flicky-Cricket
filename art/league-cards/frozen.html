<title>Frozen Ashes Ice Urn</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@500;600&display=swap');
/* Layout: same league card shell as the other cards — a frozen fjord at polar twilight, above a stats grid */
:root {
  color-scheme: dark;
  --page: #070810;
  --card: #0c0f1c;
  --ink: #ffffff;
  --muted: rgba(255,255,255,0.36);

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 16px;
}
.card {
  width: min(540px, 100%);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.70),
    0 60px 120px rgba(0,0,0,0.40);
}
.art { position: relative; line-height: 0; }
canvas { display: block; width: 100%; height: auto; background: #3a3a80; }
.ovl {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 70px 18px 16px;
  background: linear-gradient(to bottom,
    rgba(12,15,28,0)    0%,
    rgba(12,15,28,0.52) 30%,
    rgba(12,15,28,0.92) 62%,
    rgba(12,15,28,1)   100%);
  pointer-events: none;
}
.pip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--display);
  font-weight: 700; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tier); margin-bottom: 8px;
}
.pip::before {
  content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--tier); box-shadow: 0 0 8px var(--tier);
}
.nm {
  font-family: var(--display); font-weight: 900;
  font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  color: var(--ink); text-shadow: 0 2px 24px rgba(0,0,0,1); margin-bottom: 5px;
}
.sub {
  font-family: var(--display); font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.info {
  padding: 13px 16px 17px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 9px 13px;
}
.lbl { display:block; font-family:var(--display); font-weight:700; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.26); margin-bottom:4px; }
.val { font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.02em; line-height:1; font-variant-numeric: tabular-nums; }
.cw { color:rgba(255,255,255,0.82); }
.cy { color:var(--gold); }
.ce { color:var(--eng); }
.cs { color:var(--silver); }
</style>

<div class="card">
  <div class="art">

  </div>
</div>

<script>
const PI = Math.PI, TAU = PI * 2;
const SHOW = 24.0;                                 // length of the shared schedule, seconds
const AURORA = [3.0, 10.0];                        // headline 1: the northern lights brighten, ripple faster and flare pink at the hem, then settle
const SLED = [0.4, 23.6];                          // a husky team runs along the far ice from behind the hut's point and disappears behind the glacier
const CRACK = 12.4;                                // a crack opens at the cliff top; chips of ice fall
const TOPPLE = [13.3, 14.2];                       // headline 2: the iceberg's second peak leans out, breaks away and falls into the sea
const HIT = 14.9;                                  // ... splash: a fountain of spray, a mist cloud drifting downwind, rings spreading; the floes rock as the swell reaches them
const REFORM = [21.4, 23.6];                       // the cliff face frosts back over, ready for the next loop
const NARWHAL = [19.0, 23.0];
// ice magic (frost, the snowflake swirl, snowfall) is scheduled with its drawing code further down                      // two narwhals surface in the sun's glow, tusks first, and dive again
const TURN_SECONDS = 12.0;
function win(m, [a, b]) { return m >= a && m <= b ? (m - a) / (b - a) : -1; }
const ease = (u) => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const lerp = (a, b, u) => a + (b - a) * u;
const SUN = { x: 0.335, y: 0.492 };                // a low pink sun sitting on the horizon between the glacier and the urn, lighting everything from the left
const HZ = 0.500;                                  // the far ice / horizon line
const WTOP = 0.507, SHORE = 0.632;                 // the open water runs from the far ice to the near shore
// the iceberg: a tall pinnacle berg on the left with a second peak and a natural arch; its second peak is the piece that calves
const WL = 0.566;                                  // the berg's waterline
const BERG = [[-0.02, WL], [-0.02, 0.44], [0.02, 0.38], [0.045, 0.36], [0.07, 0.29], [0.095, 0.21], [0.11, 0.185], [0.125, 0.22], [0.14, 0.30], [0.155, 0.33], [0.18, 0.31], [0.205, 0.265], [0.225, 0.29], [0.25, 0.37], [0.275, 0.43], [0.29, 0.50], [0.30, WL]];
const ARCH = [[0.136, WL], [0.138, 0.50], [0.147, 0.472], [0.158, 0.466], [0.168, 0.476], [0.174, 0.51], [0.176, WL]];
const PIECE = [[0.168, 0.320], [0.18, 0.31], [0.205, 0.265], [0.225, 0.29], [0.25, 0.37], [0.262, 0.399], [0.232, 0.41], [0.205, 0.40], [0.186, 0.37]];
const PIVOT = [0.262, 0.399];
const IMPACT = { x: 0.272, y: 0.566 };
function along(pts, f) { for (let i = 0; i < pts.length - 1; i++) { const [a, ya] = pts[i], [b, yb] = pts[i + 1]; if (f >= a && f <= b) return ya + (yb - ya) * (f - a) / (b - a); } return f < pts[0][0] ? pts[0][1] : pts[pts.length - 1][1]; }
function mkRnd(s) { let q = s; return () => { q = (q * 16807) % 2147483647; return (q - 1) / 2147483646; }; }
function smooth(ctx, pts) {                        // a closed curve through the midpoints of the given points
  const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const s = mid(pts[n - 1], pts[0]); ctx.beginPath(); ctx.moveTo(s[0], s[1]);
  for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n], m = mid(p, q); ctx.quadraticCurveTo(p[0], p[1], m[0], m[1]); }
  ctx.closePath();
}
const PEAKS = [[-0.03, 0.13, 0.11], [0.19, 0.20, 0.13], [0.545, 0.25, 0.12], [0.90, 0.25, 0.10], [1.02, 0.21, 0.10], [0.715, 0.10, 0.165]];   // x, summit y, half-width at the horizon
const FLOES = [[0.285, 0.604, 0.060, 5.3, 0.0], [0.375, 0.530, 0.034, 6.1, 1.3], [0.47, 0.552, 0.050, 4.7, 2.1], [0.585, 0.524, 0.040, 5.9, 0.7], [0.625, 0.578, 0.036, 6.6, 3.0], [0.712, 0.588, 0.140, 7.3, 1.8], [0.905, 0.606, 0.060, 5.5, 2.6]];
const BEARFLOE = 5;

// ════════ STILL SCENE — a fjord at polar twilight: pink sun, snowy peaks, the far ice, a tidewater glacier, open water, a red hut on a point ════════
function draw(ctxReal, W, H, part) {
  let ctx = part === 'sky' ? ctxReal : SCRATCH;
  const rnd = mkRnd(9090);
  const SX = W * SUN.x, SY = H * SUN.y, G = H * HZ;

  // ── Sky: deep indigo overhead, through violet and rose, to a peach glow on the horizon ──
  { const g = ctx.createLinearGradient(0, 0, 0, G); g.addColorStop(0, '#121848'); g.addColorStop(0.32, '#2c2f78'); g.addColorStop(0.58, '#6a4c9c'); g.addColorStop(0.80, '#d4789e'); g.addColorStop(0.93, '#ffa88c'); g.addColorStop(1, '#ffc896'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, G + 6);
    const sg = ctx.createRadialGradient(SX, SY, 0, SX, SY, W * 0.42); sg.addColorStop(0, 'rgba(255,214,170,0.85)'); sg.addColorStop(0.18, 'rgba(255,170,150,0.40)'); sg.addColorStop(1, 'rgba(255,150,170,0)'); ctx.fillStyle = sg; ctx.fillRect(0, 0, W, G + 6);
    // stars in the darker sky
    for (let i = 0; i < 70; i++) { const x = rnd() * W, y = rnd() * H * 0.30, a = (1 - y / (H * 0.30)) * (0.35 + rnd() * 0.6); ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`; ctx.beginPath(); ctx.arc(x, y, 0.3 + rnd() * 0.8, 0, TAU); ctx.fill(); }
    // the sun, half set
    const r = H * 0.032, dg = ctx.createRadialGradient(SX - r * 0.2, SY - r * 0.3, 0, SX, SY, r); dg.addColorStop(0, '#fffbe8'); dg.addColorStop(0.7, '#ffe0a8'); dg.addColorStop(1, 'rgba(255,190,140,0.9)'); ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(SX, SY, r, 0, TAU); ctx.fill(); }

  ctx = part === 'back' ? ctxReal : SCRATCH;

  // ── Mountains: sunward faces glowing pink, shaded faces cool lavender-blue, snowfields and ridgelines ──
  // a paler, farther range first for depth, then the main peaks: jagged ridgelines with shoulders and sub-summits, a crooked spine
  // splitting the sunlit face from the shaded one, rock showing through in gullies
  const range = (peaks, far, seed0) => peaks.forEach(([fx, fy, hw], i) => {
    const rr = mkRnd(seed0 + i * 31), ax = W * fx, ay = H * fy, l = ax - W * hw, r = ax + W * hw, by = G + 2;
    const side = (x0, x1, n) => { const pts = []; for (let k = 1; k < n; k++) { const u = k / n, sag = Math.sin(u * PI) * (by - ay) * (0.10 + rr() * 0.06), bump = (rr() - 0.5) * (by - ay) * 0.09 + (k === 2 ? -(by - ay) * 0.10 : 0);
      pts.push([lerp(x0, x1, u) + (rr() - 0.5) * W * hw * 0.08, lerp(ay, by, u) + sag * 0.4 + bump]); } return pts; };
    const L = side(ax, l, 7), R = side(ax, r, 6);
    const spine = []; for (let k = 1; k <= 6; k++) { const u = k / 6; spine.push([ax + W * hw * (0.06 + 0.22 * u) + (rr() - 0.5) * W * hw * 0.10, lerp(ay, by, u)]); }
    const outline = () => { ctx.beginPath(); ctx.moveTo(l, by); for (let k = L.length - 1; k >= 0; k--) ctx.lineTo(L[k][0], L[k][1]); ctx.lineTo(ax, ay); R.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(r, by); ctx.closePath(); };
    const lit = ctx.createLinearGradient(l, ay, ax, by); lit.addColorStop(0, far ? '#f6d4e6' : '#ffe6f0'); lit.addColorStop(0.5, far ? '#d8b0d4' : '#f2b6ce'); lit.addColorStop(1, far ? '#a890c8' : '#c48cba');
    outline(); ctx.fillStyle = lit; ctx.fill();
    const sh = ctx.createLinearGradient(ax, ay, r, by); sh.addColorStop(0, far ? '#a8a8dc' : '#9c9cdc'); sh.addColorStop(1, far ? '#7a7ab8' : '#5c5aa4');
    ctx.fillStyle = sh; ctx.beginPath(); ctx.moveTo(ax, ay); spine.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(r, by); for (let k = R.length - 1; k >= 0; k--) ctx.lineTo(R[k][0], R[k][1]); ctx.closePath(); ctx.fill();
    ctx.save(); outline(); ctx.clip();
    // gullies of dark rock running down both faces
    for (let k = 0; k < (far ? 5 : 11); k++) { const u = 0.15 + rr() * 0.7, onLit = rr() < 0.45, x0 = onLit ? lerp(ax, l, u * 0.7) : lerp(ax, r, u * 0.6), y0 = lerp(ay, by, u * 0.75), len = 6 + rr() * 16;
      ctx.strokeStyle = onLit ? `rgba(150,90,140,${far ? 0.25 : 0.45})` : `rgba(50,44,110,${far ? 0.25 : 0.5})`; ctx.lineWidth = 0.8 + rr() * 1.4;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + (onLit ? -1 : 1) * len * 0.35 + (rr() - 0.5) * 3, y0 + len * 0.6); ctx.lineTo(x0 + (onLit ? -1 : 1) * len * 0.5, y0 + len); ctx.stroke(); }
    // snow light along the spine
    ctx.strokeStyle = far ? 'rgba(255,240,248,0.45)' : 'rgba(255,244,250,0.75)'; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.moveTo(ax, ay); spine.slice(0, 4).forEach(([x, y]) => ctx.lineTo(x - 0.8, y)); ctx.stroke();
    const hero = !far && i === peaks.length - 1;
    if (hero) {
      // the big peak: broken rock bands slanting across both faces, bright snowfields between, a hanging glacier on the shaded side
      for (let k = 0; k < 4; k++) { const v = 0.24 + k * 0.17, y = lerp(ay, by, v), xa = lerp(ax, l, v * 0.92), xb = lerp(ax, r, v * 0.9);
        const band = (dy, col, lw) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(xa, y + dy + (xa - ax) * 0.10); ctx.quadraticCurveTo(ax, y + dy - 2 + (rr() - 0.5) * 3, xb, y + dy + (xb - ax) * 0.10); ctx.stroke(); };
        band(0, `rgba(120,70,130,${(0.30 - k * 0.04).toFixed(2)})`, 2.6 + rr() * 1.5); band(-2.2, 'rgba(255,240,248,0.40)', 0.9); }
    }
    ctx.restore();
    if (hero) { const pg = ctx.createRadialGradient(ax + 16, ay + 3, 0, ax + 16, ay + 3, 26); pg.addColorStop(0, 'rgba(255,240,250,0.45)'); pg.addColorStop(1, 'rgba(255,240,250,0)');   // spindrift blowing off the summit
      ctx.fillStyle = pg; ctx.save(); ctx.translate(ax + 16, ay + 3); ctx.scale(1, 0.22); ctx.translate(-ax - 16, -ay - 3); ctx.beginPath(); ctx.arc(ax + 16, ay + 3, 26, 0, TAU); ctx.fill(); ctx.restore(); }
  });
  range([[0.10, 0.27, 0.10], [0.47, 0.31, 0.09], [0.62, 0.29, 0.09], [0.76, 0.30, 0.10], [0.90, 0.28, 0.09]], true, 700);
  range(PEAKS, false, 500);
  // a pink haze where the mountains meet the ice
  { const hg = ctx.createLinearGradient(0, G - H * 0.08, 0, G); hg.addColorStop(0, 'rgba(255,190,200,0)'); hg.addColorStop(1, 'rgba(255,196,196,0.55)'); ctx.fillStyle = hg; ctx.fillRect(0, G - H * 0.08, W, H * 0.08); }
  // the far sea ice: a bright strip along the foot of the mountains
  { const g = ctx.createLinearGradient(0, G - 2, 0, G + 5); g.addColorStop(0, '#f4d8e8'); g.addColorStop(0.45, '#dcc8e6'); g.addColorStop(1, '#9a90c8'); ctx.fillStyle = g; ctx.fillRect(0, G - 2, W, 7);
    const sg = ctx.createRadialGradient(SX, G, 0, SX, G, W * 0.22); sg.addColorStop(0, 'rgba(255,236,220,0.75)'); sg.addColorStop(1, 'rgba(255,220,220,0)'); ctx.fillStyle = sg; ctx.fillRect(0, G - 2, W, 7); }   // brightest under the sun

  ctx = part === 'mid' ? ctxReal : SCRATCH;

  // ── The water: the sky's colours mirrored, darkening towards us ──
  { const top = H * WTOP, bot = H * (SHORE + 0.04);
    const g = ctx.createLinearGradient(0, top, 0, bot); g.addColorStop(0, '#b47aa8'); g.addColorStop(0.25, '#6a5aa6'); g.addColorStop(0.6, '#34428a'); g.addColorStop(1, '#22306c'); ctx.fillStyle = g; ctx.fillRect(0, top, W, bot - top);
    // the sun's path on the water, broken into ripples
    for (let y = top + 1; y < bot; y += 2.2) { const d = (y - top) / (bot - top), w = W * (0.012 + d * 0.05) * (0.6 + rnd() * 0.7), x = SX + (rnd() - 0.5) * W * 0.012 * (1 + d * 3);
      ctx.fillStyle = `rgba(255,${200 - d * 40 | 0},${170 - d * 30 | 0},${(0.75 - d * 0.45).toFixed(2)})`; ctx.fillRect(x - w / 2, y, w, 1.1); }
    // the mountains' pink reflections, soft and wobbly
    ctx.fillStyle = 'rgba(240,170,200,0.16)'; PEAKS.forEach(([fx, , hw]) => { for (let k = 0; k < 6; k++) { const w = W * hw * (1 - k * 0.15) * 1.2; ctx.fillRect(W * fx - w / 2 + (rnd() - 0.5) * 6, top + 2 + k * 3.2, w, 1.4); } }); }

  // ── The iceberg: a great sculpted pinnacle berg with an arch, lit pink on its sunward faces ──
  drawBerg(ctx, W, H);

  // ── The point on the right: dark rocks under deep snow, a red fishing hut with a lit window, an upturned boat ──
  { const P = [[0.765, 0.556], [0.79, 0.528], [0.83, 0.516], [0.88, 0.512], [0.94, 0.505], [1.01, 0.500], [1.01, 0.578], [0.92, 0.572], [0.84, 0.568], [0.78, 0.566]];
    ctx.fillStyle = '#3a3458'; ctx.beginPath(); P.forEach(([x, y], i) => i ? ctx.lineTo(W * x, H * y) : ctx.moveTo(W * x, H * y)); ctx.closePath(); ctx.fill();
    // rock faces at the water's edge
    for (let k = 0; k < 9; k++) { const x = W * (0.775 + rnd() * 0.23), y = H * (0.556 + rnd() * 0.012); ctx.fillStyle = rnd() < 0.5 ? '#4a4270' : '#282444'; ctx.beginPath(); ctx.moveTo(x - 5, y + 6); ctx.lineTo(x - 2, y - 3); ctx.lineTo(x + 4, y - 2); ctx.lineTo(x + 6, y + 6); ctx.fill(); }
    // snow blanket, lit pink on its sunward rise
    const sg = ctx.createLinearGradient(W * 0.77, 0, W, 0); sg.addColorStop(0, '#ffe2ee'); sg.addColorStop(0.4, '#f4eaf8'); sg.addColorStop(1, '#c4c8ec');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(W * 0.768, H * 0.552);
    ctx.quadraticCurveTo(W * 0.79, H * 0.522, W * 0.83, H * 0.514); ctx.lineTo(W * 0.94, H * 0.503); ctx.lineTo(W * 1.01, H * 0.498); ctx.lineTo(W * 1.01, H * 0.556);
    for (let x = 1.0; x > 0.77; x -= 0.02) ctx.lineTo(W * x, H * (0.552 + Math.sin(x * 90) * 0.004)); ctx.closePath(); ctx.fill();
    // the reflection of the point in the water
    ctx.fillStyle = 'rgba(30,26,70,0.35)'; ctx.fillRect(W * 0.78, H * 0.572, W * 0.22, H * 0.012);
    // the hut: gable end towards us, side wall in shade, deep snow on the roof
    const hx = W * 0.862, hy = H * 0.513, hw = 21, hh = 17, rh = 13, sd = 14;
    ctx.fillStyle = 'rgba(60,60,130,0.35)'; ctx.beginPath(); ctx.moveTo(hx + hw, hy); ctx.lineTo(hx + hw + sd + 18, hy + 2); ctx.lineTo(hx + hw + 4, hy + 4); ctx.closePath(); ctx.fill();   // shadow, cast right
    ctx.fillStyle = '#7a1e22'; ctx.beginPath(); ctx.moveTo(hx + hw, hy); ctx.lineTo(hx + hw + sd, hy - 4); ctx.lineTo(hx + hw + sd, hy - hh - 4); ctx.lineTo(hx + hw, hy - hh); ctx.closePath(); ctx.fill();      // side wall
    const wg = ctx.createLinearGradient(hx - hw, 0, hx + hw, 0); wg.addColorStop(0, '#e05048'); wg.addColorStop(1, '#a8302c'); ctx.fillStyle = wg;
    ctx.beginPath(); ctx.moveTo(hx - hw, hy); ctx.lineTo(hx + hw, hy); ctx.lineTo(hx + hw, hy - hh); ctx.lineTo(hx, hy - hh - rh); ctx.lineTo(hx - hw, hy - hh); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(80,16,20,0.45)'; ctx.lineWidth = 0.6; for (let y = hy - 3; y > hy - hh - rh; y -= 3) { const ins = Math.max(0, (hy - hh - y)) / rh * hw; ctx.beginPath(); ctx.moveTo(hx - hw + ins, y); ctx.lineTo(hx + hw - ins, y); ctx.stroke(); }
    ctx.strokeStyle = '#fff4ec'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(hx - hw - 2, hy - hh + 1); ctx.lineTo(hx, hy - hh - rh - 1); ctx.lineTo(hx + hw + 2, hy - hh + 1); ctx.stroke();       // barge boards
    ctx.fillStyle = '#fff4ec'; ctx.fillRect(hx - hw, hy - hh, 1.4, hh); ctx.fillRect(hx + hw - 1.4, hy - hh, 1.4, hh);
