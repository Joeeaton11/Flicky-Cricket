<title>Frontier Cup Sheriff's Star</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@500;600&display=swap');
/* Layout: same league card shell as the other cards — a frontier town in red-rock country at high noon, above a stats grid */
:root {
  color-scheme: dark;
  --page: #070810;
  --card: #0c0f1c;
  --ink: #ffffff;
  --muted: rgba(255,255,255,0.36);
  --tier: #b884ff;
  --gold: #f0c030;
  --eng: #ffd080;
  --silver: #b8c8d8;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 16px;
}
.card {
  width: min(540px, 100%);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.70),
    0 60px 120px rgba(0,0,0,0.40);
}
.art { position: relative; line-height: 0; }
canvas { display: block; width: 100%; height: auto; background: #4aa0e8; }
.ovl {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 70px 18px 16px;
  background: linear-gradient(to bottom,
    rgba(12,15,28,0)    0%,
    rgba(12,15,28,0.52) 30%,
    rgba(12,15,28,0.92) 62%,
    rgba(12,15,28,1)   100%);
  pointer-events: none;
}
.pip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--display);
  font-weight: 700; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tier); margin-bottom: 8px;
}
.pip::before {
  content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--tier); box-shadow: 0 0 8px var(--tier);
}
.nm {
  font-family: var(--display); font-weight: 900;
  font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  color: var(--ink); text-shadow: 0 2px 24px rgba(0,0,0,1); margin-bottom: 5px;
}
.sub {
  font-family: var(--display); font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.info {
  padding: 13px 16px 17px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 9px 13px;
}
.lbl { display:block; font-family:var(--display); font-weight:700; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.26); margin-bottom:4px; }
.val { font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.02em; line-height:1; font-variant-numeric: tabular-nums; }
.cw { color:rgba(255,255,255,0.82); }
.cy { color:var(--gold); }
.ce { color:var(--eng); }
.cs { color:var(--silver); }
</style>

<div class="card">
  <div class="art">
    <canvas id="c" width="620" height="355" aria-label="High noon on Main Street, Flicky Gulch: looking down the street between the jail, the general store and the undertaker&#39;s on one side and the saloon, the bank and the hotel on the other, out across the plain to blue mountains, red mesas and a train. A tumbleweed clips the stumps; robbers burst out of the bank and a gunfight breaks out — the sheriff behind barrels, the deputy in the jail door, a gunman on the saloon balcony. The sheriff shoots the balcony gunman&#39;s hat off and he falls head first into a hay cart, then shoots the gun out of the leader&#39;s hand and the loot sack bursts into banknotes. The deputy marches them to jail as the train whistles. The Sheriff&#39;s Star sways centre stage."></canvas>
    <div class="ovl">
      <div class="pip">Tier 4 · Early Fantasy</div>
      <div class="nm">Frontier Cup</div>
      <div class="sub">Wild West Cricket · The Sheriff's Star</div>
    </div>
  </div>
  <div class="info">
    <div class="stat"><span class="lbl">Entry Cost</span><span class="val cw">2,800 coins</span></div>
    <div class="stat"><span class="lbl">Win Reward</span><span class="val cy">+3,360</span></div>
    <div class="stat"><span class="lbl">Unlock</span><span class="val ce">250 Trophies</span></div>
    <div class="stat"><span class="lbl">Prize</span><span class="val cy">Gold Chest</span></div>
  </div>
</div>

const HZ = 0.420, CAM = 1.7, FOC = 0.3226;

  { const g = ctx.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#1a5cc8'); g.addColorStop(0.5, '#4a9ae4'); g.addColorStop(0.88, '#a8d4f0'); g.addColorStop(1, '#eef4ee'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz + 4);

    ctx.beginPath(); ctx.moveTo(-4, hz + 2); pk.forEach(([fx, fy]) => ctx.lineTo(W * fx, H * fy)); ctx.lineTo(W + 4, hz + 2); ctx.closePath(); const g = ctx.createLinearGradient(0, H * 0.25, 0, hz); g.addColorStop(0, '#8a96c4'); g.addColorStop(1, '#b8c4dc'); ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle = 'rgba(70,80,130,0.30)'; for (let i = 1; i < pk.length - 1; i++) { const [fx, fy] = pk[i]; ctx.beginPath(); ctx.moveTo(W * fx, H * fy); ctx.lineTo(W * (fx + 0.035), hz + 2); ctx.lineTo(W * (fx + 0.012), hz + 2); ctx.closePath(); ctx.fill(); }

    ctx.save(); ctx.clip(); ctx.strokeStyle = 'rgba(110,40,20,0.25)'; ctx.lineWidth = 0.7; for (let y = yt + 4; y < hz; y += 3 + rnd() * 3) seg([x0, y], [x1, y + (rnd() - 0.5) * 1.5]);
    for (let k = 0; k < 6; k++) { const x = x0 + rnd() * (x1 - x0), l = 4 + rnd() * (hz - yt) * 0.5, sg = ctx.createLinearGradient(0, yt, 0, yt + l); sg.addColorStop(0, 'rgba(80,26,14,0.45)'); sg.addColorStop(1, 'rgba(80,26,14,0)'); ctx.fillStyle = sg; ctx.fillRect(x, yt + 2, 1.2, l); }

  // ── the street: wide through town, a dusty road on out across the plain; wheel ruts, hoofprints, the left side in the buildings' shade ──
