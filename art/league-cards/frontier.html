<title>Frontier Cup Sheriff's Star</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@500;600&display=swap');
/* Layout: same league card shell as the other cards — a frontier town in red-rock country at high noon, above a stats grid */
:root {
  color-scheme: dark;
  --page: #070810;
  --card: #0c0f1c;
  --ink: #ffffff;
  --muted: rgba(255,255,255,0.36);
  --tier: #b884ff;
  --gold: #f0c030;
  --eng: #ffd080;
  --silver: #b8c8d8;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 16px;
}
.card {
  width: min(540px, 100%);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.70),
    0 60px 120px rgba(0,0,0,0.40);
}
.art { position: relative; line-height: 0; }
canvas { display: block; width: 100%; height: auto; background: #4aa0e8; }
.ovl {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 70px 18px 16px;
  background: linear-gradient(to bottom,
    rgba(12,15,28,0)    0%,
    rgba(12,15,28,0.52) 30%,
    rgba(12,15,28,0.92) 62%,
    rgba(12,15,28,1)   100%);
  pointer-events: none;
}
.pip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--display);
  font-weight: 700; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tier); margin-bottom: 8px;
}
.pip::before {
  content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--tier); box-shadow: 0 0 8px var(--tier);
}
.nm {
  font-family: var(--display); font-weight: 900;
  font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  color: var(--ink); text-shadow: 0 2px 24px rgba(0,0,0,1); margin-bottom: 5px;
}
.sub {
  font-family: var(--display); font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.info {
  padding: 13px 16px 17px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 9px 13px;
}
.lbl { display:block; font-family:var(--display); font-weight:700; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.26); margin-bottom:4px; }
.val { font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.02em; line-height:1; font-variant-numeric: tabular-nums; }
.cw { color:rgba(255,255,255,0.82); }
.cy { color:var(--gold); }
.ce { color:var(--eng); }
.cs { color:var(--silver); }
</style>

<div class="card">
  <div class="art">
    <canvas id="c" width="620" height="355" aria-label="High noon in red-rock country: tall red buttes and a long mesa under a deep blue sky; a frontier town with a general store, a two-storey saloon with a balcony and swinging doors, a sheriff's office and a water tower; a horse at the hitching rail; a windmill turning and saguaro cacti; a steam train thundering across a wooden trestle over a canyon, whistling, and disappearing into a tunnel through a red-rock outcrop; chickens scattering; a FLICKY GULCH, POP. 11 town sign; a high-noon showdown across the trophy between a white-hatted sheriff and a black-hatted outlaw, who draw as a tumbleweed rolls between them — the outlaw's hat is shot off and spins back onto his head, and a stray shot springs a leak in the water tower; a hawk circling, vultures on the saloon, prairie dogs popping up, a rattlesnake by a cow skull, prickly pear and desert flowers; a tumbleweed bouncing in and snagging on the stumps; a roadrunner dashing through; and the Sheriff's Star, a big gold ball-tipped badge with a turquoise heart, swaying on its post on a wooden plinth"></canvas>
    <div class="ovl">
      <div class="pip">Tier 4 · Early Fantasy</div>
      <div class="nm">Frontier Cup</div>
      <div class="sub">Wild West Cricket · The Sheriff's Star</div>
    </div>
  </div>
  <div class="info">
    <div class="stat"><span class="lbl">Entry Cost</span><span class="val cw">2,800 coins</span></div>
    <div class="stat"><span class="lbl">Win Reward</span><span class="val cy">+3,360</span></div>
    <div class="stat"><span class="lbl">Unlock</span><span class="val ce">250 Trophies</span></div>
    <div class="stat"><span class="lbl">Prize</span><span class="val cy">Gold Chest</span></div>
  </div>
</div>

<script>
const PI = Math.PI;
const SHOW = 24.0;                                 // length of the shared schedule, seconds
const TRAIN = [1.8, 11.4];                         // a steam train comes in from the right, thunders over the trestle and pulls away behind the town
const WHISTLE = [4.0, 5.4];                        // ...blowing its whistle as it crosses the canyon
const HORSE_TOSS = [8.2, 9.2];                     // the horse throws its head as the train rumbles past
const DOORS = [9.4, 11.2];                         // the saloon's swinging doors flap in the train's draught
const TUMBLE = [12.4, 21.6];                       // a tumbleweed bounces in, snags on the stumps, then hops over them and rolls away
const DUST = [16.8, 23.6];                         // a little dust devil whirls across the far desert
const RUNNER = [21.9, 23.9];                       // a roadrunner streaks in from the right, skids to a stop, looks about, and dashes off left
function win(m, [a, b]) { return m >= a && m <= b ? (m - a) / (b - a) : -1; }
const ease = (u) => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const lerp = (a, b, u) => a + (b - a) * u;
function hash(n) { const u = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return u - Math.floor(u); }

const GROUND = 0.600;                              // the foreground's back edge
const HZ = 0.420;                                  // where the buttes stand on the far desert
const TY = 0.445;                                  // the railway (rail top)
const GORGE = [0.635, 0.965, 0.745, 0.855];        // the canyon the trestle crosses: rim left, rim right, floor left, floor right
const BW = 0.585;                                  // the town's boardwalk
const STUMPS = { x: 0.650, y: 0.690 };
const PORTAL = 0.402;                              // the railway runs into a tunnel through a red-rock outcrop here, between the town and the trophy
const DUEL = [18.8, 21.2];                         // high noon: the sheriff and the outlaw draw — the sheriff shoots the outlaw's hat clean off, the outlaw's shot holes the water tower
const SHERIFF = { x: 0.232, y: 0.702 }, OUTLAW = { x: 0.800, y: 0.702 };
const gorgeY = (x, W, H) => { const [a, b, c, d] = GORGE.map(f => f * W), y0 = H * TY + 3, y1 = H * GROUND + 3; if (x <= a || x >= b) return y0; if (x < c) return lerp(y0, y1, (x - a) / (c - a)); if (x <= d) return y1; return lerp(y1, y0, (x - d) / (b - d)); };

// ════════ STILL SCENE — red-rock country at high noon: buttes and a mesa, the far desert, the railway and its trestle, the town, the foreground ════════
function draw(ctxReal, W, H, part) {
  let ctx = part === 'sky' ? ctxReal : SCRATCH;
  let seed = 7171;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const G = H * GROUND, SX = W * SUN.x, SY = H * SUN.y, hz = H * HZ, ty = H * TY;

  // ── Sky: deep blue overhead, paling to a hot white haze at the horizon; the sun a white-hot disc in a soft bloom ──
  { const g = ctx.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#1258c4'); g.addColorStop(0.45, '#3a92e2'); g.addColorStop(0.85, '#9ccff0'); g.addColorStop(1, '#e4f2f4'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz + 4);
    const sg = ctx.createRadialGradient(SX, SY, 0, SX, SY, W * 0.30); sg.addColorStop(0, 'rgba(255,255,245,1)'); sg.addColorStop(0.07, 'rgba(255,253,230,0.70)'); sg.addColorStop(0.25, 'rgba(255,250,220,0.18)'); sg.addColorStop(1, 'rgba(255,250,220,0)'); ctx.fillStyle = sg; ctx.fillRect(0, 0, W, hz + 4);
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(SX, SY, H * 0.028, 0, PI * 2); ctx.fill(); }

  ctx = part === 'back' ? ctxReal : SCRATCH;
  // ── the long mesa on the left, far off and hazy, its sunlit face toward us-left, shade on the right ──
  const rock = (pts, lit, shade, hazeA) => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); const xs = pts.map(p => p[0]), x0 = Math.min(...xs), x1 = Math.max(...xs); const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, lit); g.addColorStop(0.55, lit); g.addColorStop(0.8, shade); g.addColorStop(1, shade); ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.clip(); ctx.strokeStyle = 'rgba(120,40,20,0.22)'; ctx.lineWidth = 0.8; const ys = pts.map(p => p[1]), yt = Math.min(...ys); for (let y = yt + 5; y < hz; y += 4 + rnd() * 4) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y + (rnd() - 0.5) * 2); ctx.stroke(); }
      for (let k = 0; k < 14; k++) { const x = x0 + rnd() * (x1 - x0); ctx.strokeStyle = 'rgba(110,36,18,0.18)'; ctx.beginPath(); ctx.moveTo(x, yt); ctx.lineTo(x + (rnd() - 0.5) * 4, hz); ctx.stroke(); }
      for (let k = 0; k < 9; k++) { const x = x0 + (0.1 + 0.8 * rnd()) * (x1 - x0), w = 1.5 + rnd() * 2.5, len = (hz - yt) * (0.3 + 0.6 * rnd()); const gg = ctx.createLinearGradient(x - w, 0, x + w, 0); gg.addColorStop(0, 'rgba(90,26,12,0)'); gg.addColorStop(0.5, 'rgba(90,26,12,0.30)'); gg.addColorStop(1, 'rgba(255,190,140,0.20)'); ctx.fillStyle = gg;
        ctx.beginPath(); ctx.moveTo(x - w, yt + 3); ctx.quadraticCurveTo(x - w * 0.6 + (rnd() - 0.5) * 3, yt + len * 0.5, x, yt + len); ctx.quadraticCurveTo(x + w * 0.6, yt + len * 0.5, x + w, yt + 3); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle = 'rgba(110,34,16,0.55)'; ctx.fillRect(x0, yt - 2, x1 - x0, 5); ctx.fillStyle = 'rgba(255,210,170,0.45)'; ctx.fillRect(x0, yt + 3, (x1 - x0) * 0.6, 1);
      const bs = ctx.createLinearGradient(0, hz - 14, 0, hz); bs.addColorStop(0, 'rgba(90,26,12,0)'); bs.addColorStop(1, 'rgba(90,26,12,0.30)'); ctx.fillStyle = bs; ctx.fillRect(x0, hz - 14, x1 - x0, 14);
      ctx.fillStyle = `rgba(200,225,240,${hazeA})`; ctx.fillRect(x0, yt - 2, x1 - x0, hz - yt + 4); ctx.restore(); };
  rock([[-6, hz], [-6, H * 0.300], [W * 0.05, H * 0.292], [W * 0.09, H * 0.296], [W * 0.15, H * 0.290], [W * 0.24, H * 0.298], [W * 0.27, H * 0.318], [W * 0.29, H * 0.330], [W * 0.31, H * 0.372], [W * 0.355, hz]], '#e2885a', '#b85e3e', 0.30);
  // the buttes on the right: a great block with a slender spire beside it, and a second butte at the edge
  rock([[W * 0.648, hz], [W * 0.668, H * 0.300], [W * 0.680, H * 0.205], [W * 0.688, H * 0.198], [W * 0.776, H * 0.200], [W * 0.784, H * 0.212], [W * 0.792, H * 0.300], [W * 0.814, hz]], '#e2723e', '#a8472a', 0.10);
  rock([[W * 0.806, hz], [W * 0.812, H * 0.330], [W * 0.818, H * 0.250], [W * 0.824, H * 0.244], [W * 0.830, H * 0.258], [W * 0.834, H * 0.340], [W * 0.842, hz]], '#e2723e', '#a8472a', 0.10);
  rock([[W * 0.858, hz], [W * 0.874, H * 0.330], [W * 0.884, H * 0.262], [W * 0.892, H * 0.256], [W * 1.02, H * 0.258], [W * 1.02, hz]], '#de6c3a', '#a24428', 0.14);
  // talus fans at their feet
  [[W * 0.62, W * 0.84], [W * 0.84, W * 1.02], [-6, W * 0.37]].forEach(([a, b]) => { const g = ctx.createLinearGradient(0, hz - 10, 0, hz + 2); g.addColorStop(0, 'rgba(214,120,76,0)'); g.addColorStop(1, 'rgba(214,120,76,0.9)'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(a, hz + 2); ctx.quadraticCurveTo((a + b) / 2, hz - 14, b, hz + 2); ctx.closePath(); ctx.fill(); });
  // ── the far desert: pale and hot at the horizon, warming toward us, dotted with scrub ──
  { const g = ctx.createLinearGradient(0, hz, 0, G); g.addColorStop(0, '#f2c890'); g.addColorStop(0.5, '#e8a868'); g.addColorStop(1, '#d88c4c'); ctx.fillStyle = g; ctx.fillRect(0, hz, W, G - hz + 4);
    for (let k = 0; k < 110; k++) { const y = hz + 3 + Math.pow(rnd(), 1.3) * (G - hz), x = rnd() * W, s = 0.6 + (y - hz) / (G - hz) * 2.4; ctx.fillStyle = rnd() < 0.5 ? 'rgba(120,120,60,0.55)' : 'rgba(150,140,70,0.5)'; ctx.beginPath(); ctx.ellipse(x, y, s * 1.4, s * 0.6, 0, 0, PI * 2); ctx.fill(); } }
  // ── the canyon: a notch cut into the desert — a ragged west wall in shade, a sunlit east wall stepped with ledges, banded in reds, a dark floor with a ribbon of river ──
  { const [a, b, c, d] = GORGE.map(f => f * W), y0 = ty + 3, y1 = G + 3, mid = (c + d) / 2;
    const jag = (x0, ya, x1, yb, n, amp, sd) => { const pts = []; for (let i = 0; i <= n; i++) { const u = i / n, k = (i === 0 || i === n) ? 0 : (hash(sd + i) - 0.5) * amp; pts.push([lerp(x0, x1, u) + k, lerp(ya, yb, u) + (i % 2 ? amp * 0.15 : 0)]); } return pts; };
    const L = jag(a, y0, c, y1, 9, 6, 11), Rw = jag(b, y0, d, y1, 9, 6, 37);
    // the far end of the canyon, deep in shade
    const fg = ctx.createLinearGradient(0, y0, 0, y1); fg.addColorStop(0, '#a04428'); fg.addColorStop(1, '#5a1e12'); ctx.fillStyle = fg; ctx.fillRect(a, y0, b - a, y1 - y0);
    // west wall (facing east, in shade)
    const lg = ctx.createLinearGradient(a, 0, mid, 0); lg.addColorStop(0, '#9a3e24'); lg.addColorStop(1, '#6e2616'); ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(a - 2, y0); L.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(mid - 10, y1); ctx.lineTo(lerp(a, mid, 0.55), y0); ctx.closePath(); ctx.fill();
    // east wall (facing west into the sun), lit, with ledges catching light
    const rg = ctx.createLinearGradient(mid, 0, b, 0); rg.addColorStop(0, '#d4643a'); rg.addColorStop(1, '#f09060'); ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(b + 2, y0); Rw.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(mid + 10, y1); ctx.lineTo(lerp(b, mid, 0.55), y0); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.moveTo(b + 2, y0); Rw.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(mid + 10, y1); ctx.lineTo(lerp(b, mid, 0.55), y0); ctx.closePath(); ctx.clip();
    [['rgba(255,200,150,0.55)', 0.18], ['rgba(140,50,24,0.40)', 0.30], ['rgba(255,190,140,0.45)', 0.48], ['rgba(140,50,24,0.40)', 0.62], ['rgba(255,200,150,0.40)', 0.80]].forEach(([c2, u]) => { const y = lerp(y0, y1, u); ctx.fillStyle = c2; ctx.beginPath(); ctx.moveTo(mid, y); ctx.lineTo(b + 4, y - 2); ctx.lineTo(b + 4, y + 1.6); ctx.lineTo(mid, y + 2.4); ctx.closePath(); ctx.fill(); }); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.moveTo(a - 2, y0); L.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(mid - 10, y1); ctx.lineTo(lerp(a, mid, 0.55), y0); ctx.closePath(); ctx.clip();
    [0.22, 0.42, 0.66].forEach(u => { const y = lerp(y0, y1, u); ctx.fillStyle = 'rgba(40,10,6,0.30)'; ctx.fillRect(a - 4, y, mid - a + 4, 2.2); ctx.fillStyle = 'rgba(220,120,80,0.25)'; ctx.fillRect(a - 4, y - 1, mid - a + 4, 1); }); ctx.restore();
    // ragged rim lines
    ctx.strokeStyle = 'rgba(255,220,180,0.65)'; ctx.lineWidth = 1; ctx.beginPath(); Rw.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); ctx.strokeStyle = 'rgba(60,16,8,0.6)'; ctx.beginPath(); L.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    // the floor: a dark slot with the river glinting
    ctx.fillStyle = '#4a180e'; ctx.fillRect(mid - 14, y1 - 6, 28, 8); ctx.fillStyle = '#3a8ec4'; ctx.beginPath(); ctx.moveTo(mid - 12, y1 - 2); ctx.quadraticCurveTo(mid, y1 - 5, mid + 12, y1 - 2); ctx.lineTo(mid + 13, y1 + 2); ctx.lineTo(mid - 13, y1 + 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(mid - 8, y1 - 2); ctx.lineTo(mid + 2, y1 - 3); ctx.stroke(); }
  // ── the railway: an embankment of gravel and sleepers, a steel rail glinting; over the canyon, the timber trestle ──
  { const [a, b] = [GORGE[0] * W, GORGE[1] * W];
    [[W * PORTAL - 6, a + 2], [b - 2, W + 4]].forEach(([x0, x1]) => { ctx.fillStyle = '#b8764a'; ctx.beginPath(); ctx.moveTo(x0, ty + 7); ctx.lineTo(x0 + 2, ty + 1); ctx.lineTo(x1 - 2, ty + 1); ctx.lineTo(x1, ty + 7); ctx.closePath(); ctx.fill(); ctx.fillStyle = 'rgba(80,40,20,0.35)'; for (let x = x0; x < x1; x += 2.2) ctx.fillRect(x, ty + 2 + rnd() * 4, 1, 1); });
    // trestle bents down into the canyon: chunky timber towers, splayed, braced with a single X per tier, a waling beam every other tier
    const bents = []; for (let x = W * 0.628; x <= W * 0.972; x += 19) { const yb = gorgeY(x, W, H); if (yb > ty + 6) bents.push([x, yb]); }
    bents.forEach(([x, yb], i) => { const tiers = Math.max(1, Math.round((yb - ty) / 16)), th = (yb - ty - 2) / tiers;
      for (let k = 0; k < tiers; k++) { const ya = ty + 2 + k * th, yb2 = ya + th, wa = lerp(3, 6.5, (ya - ty) / (H * GROUND - ty)), wb = lerp(3, 6.5, (yb2 - ty) / (H * GROUND - ty));
        ctx.strokeStyle = '#4a2810'; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.moveTo(x - wa, ya); ctx.lineTo(x + wb, yb2); ctx.moveTo(x + wa, ya); ctx.lineTo(x - wb, yb2); ctx.stroke();
        ctx.strokeStyle = '#5a3418'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - wb - 1, yb2); ctx.lineTo(x + wb + 1, yb2); ctx.stroke(); }
      ctx.strokeStyle = '#3e2410'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(x - 3, ty + 2); ctx.lineTo(x - 6.5, yb); ctx.moveTo(x + 3, ty + 2); ctx.lineTo(x + 6.5, yb); ctx.stroke();
      ctx.strokeStyle = 'rgba(240,190,130,0.75)'; ctx.lineWidth = 0.6; ctx.beginPath(); ctx.moveTo(x - 3.8, ty + 2); ctx.lineTo(x - 7.3, yb); ctx.moveTo(x + 2.2, ty + 2); ctx.lineTo(x + 5.7, yb); ctx.stroke();
      ctx.fillStyle = 'rgba(40,10,6,0.35)'; ctx.beginPath(); ctx.ellipse(x + 3, yb + 1, 6, 1.4, 0, 0, PI * 2); ctx.fill(); });
    // longitudinal walings tying the bents together near the top
    [ty + 9, ty + 20].forEach(y => { const sp = bents.filter(([, yb]) => yb > y + 3); if (sp.length < 2) return; ctx.strokeStyle = '#4a2810'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(sp[0][0] - 6, y); ctx.lineTo(sp[sp.length - 1][0] + 6, y); ctx.stroke(); });
    // the deck
    ctx.fillStyle = '#4a2a14'; ctx.fillRect(W * 0.618, ty + 0.5, W * 0.364, 3.5); ctx.fillStyle = 'rgba(230,180,120,0.6)'; ctx.fillRect(W * 0.618, ty + 0.5, W * 0.364, 0.8);
    // sleepers and the rail along the whole line
    const rx0 = W * PORTAL - 6; ctx.fillStyle = '#5a3a20'; for (let x = rx0; x < W; x += 4.5) ctx.fillRect(x, ty - 0.6, 2.4, 1.6);
    ctx.fillStyle = '#5a5a62'; ctx.fillRect(rx0, ty - 2, W - rx0, 1.6); ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(rx0, ty - 2, W - rx0, 0.5); }

  ctx = part === 'mid' ? ctxReal : SCRATCH;
  // ── a craggy red-rock outcrop the railway tunnels into: a jagged skyline, a sunlit west face, a shaded east face with a hard edge between,

// ════════ THE TROPHY — the Sheriff's Star: a thick gold ball-tipped badge in an engraved ring, a turquoise heart, swaying on a gold post above a wooden plinth.
// It's flat, so it sways (never spins side-on); its thickness shows on the edge as it turns, and its shine is driven by the sway angle. ════════
function drawPlinth(ctx, W, H, tx, tb) {

  const g = ctx.createLinearGradient(tx - pw, 0, tx + pw, 0); g.addColorStop(0, '#e2aa72'); g.addColorStop(0.5, '#ac6c3c'); g.addColorStop(1, '#6a3a1a'); ctx.fillStyle = g; ctx.fillRect(tx - pw, top, pw * 2, ph);

  const qw = pw * 1.5, qh = ph * 0.44, qx = tx - qw / 2, qy = top + ph * 0.30, pg = ctx.createLinearGradient(0, qy, 0, qy + qh); pg.addColorStop(0, '#fff2b8'); pg.addColorStop(0.5, '#e0b450'); pg.addColorStop(1, '#a87420'); ctx.fillStyle = pg; ctx.fillRect(qx, qy, qw, qh);
  ctx.strokeStyle = 'rgba(110,60,10,0.7)'; ctx.lineWidth = 0.5; ctx.strokeRect(qx + 1, qy + 1, qw - 2, qh - 2);
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#2a1806'; ctx.font = `800 ${(qh * 0.42).toFixed(1)}px 'Barlow Condensed', 'Arial Narrow', sans-serif`; ctx.fillText("THE SHERIFF'S STAR", tx, qy + qh * 0.36, qw * 0.88); ctx.font = `700 ${(qh * 0.28).toFixed(1)}px 'Barlow Condensed', 'Arial Narrow', sans-serif`; ctx.fillText('FRONTIER CUP', tx, qy + qh * 0.76, qw * 0.6); ctx.restore();

}
// the badge's outline (ring plus star plus ball tips) at the origin, unscaled
function badgePath(ctx, R) { ctx.beginPath(); ctx.arc(0, 0, R * 0.80, 0, PI * 2);
  ctx.moveTo(Math.cos(-PI / 2) * R, Math.sin(-PI / 2) * R); for (let i = 0; i < 10; i++) { const a = -PI / 2 + i * PI / 5, r = i % 2 ? R * 0.42 : R; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath();
  for (let i = 0; i < 5; i++) { const a = -PI / 2 + i * PI * 2 / 5, bx = Math.cos(a) * R * 1.07, by = Math.sin(a) * R * 1.07; ctx.moveTo(bx + R * 0.115, by); ctx.arc(bx, by, R * 0.115, 0, PI * 2); } }
function drawTrophy(ctx, W, H, phi, t) {

  // the stand: a gold cup on the plinth, a turned post with collars, a yoke that holds the badge
  { const gG = (x0, x1) => { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, '#fff2b8'); g.addColorStop(0.3, '#f0c040'); g.addColorStop(0.75, '#a87418'); g.addColorStop(1, '#5a3808'); return g; };
    ctx.fillStyle = 'rgba(90,40,16,0.32)'; ctx.beginPath(); ctx.ellipse(tx + 6, top + 1, 18, 2.6, 0, 0, PI * 2); ctx.fill();
    ctx.fillStyle = gG(tx - 14, tx + 14); ctx.beginPath(); ctx.ellipse(tx, top - 1, 14, 3.5, 0, 0, PI * 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(tx - 14, top - 1); ctx.quadraticCurveTo(tx - 6, top - 5, tx - 4, top - 12); ctx.lineTo(tx + 4, top - 12); ctx.quadraticCurveTo(tx + 6, top - 5, tx + 14, top - 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = gG(tx - 3.5, tx + 3.5); ctx.fillRect(tx - 3.2, cy + R * 0.78, 6.4, top - 12 - cy - R * 0.78);
    [top - 14, cy + R * 0.95, cy + R * 0.82].forEach((y, i) => { ctx.fillStyle = gG(tx - 6, tx + 6); ctx.beginPath(); ctx.ellipse(tx, y, i ? 5.5 : 6.5, 2.2, 0, 0, PI * 2); ctx.fill(); }); }

  { const rg = ctx.createLinearGradient(-R, -R, R, R); rg.addColorStop(0, '#fff6cc'); rg.addColorStop(0.35, '#f2c848'); rg.addColorStop(0.75, '#b07a18'); rg.addColorStop(1, '#6a4408'); ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, R * 0.80, 0, PI * 2); ctx.arc(0, 0, R * 0.60, 0, PI * 2, true); ctx.fill('evenodd');
    [R * 0.785, R * 0.615].forEach(rr => { ctx.strokeStyle = '#8a5a10'; ctx.lineWidth = R * 0.03; ctx.beginPath(); ctx.arc(0, 0, rr, 0, PI * 2); ctx.stroke(); ctx.strokeStyle = 'rgba(255,240,190,0.85)'; ctx.lineWidth = 0.6; for (let i = 0; i < 64; i++) { const a = i / 64 * PI * 2; ctx.beginPath(); ctx.moveTo(Math.cos(a) * (rr - 1.2), Math.sin(a) * (rr - 1.2)); ctx.lineTo(Math.cos(a + 0.05) * (rr + 1.2), Math.sin(a + 0.05) * (rr + 1.2)); ctx.stroke(); } });
    ctx.save(); ctx.fillStyle = '#5a3606'; ctx.font = `800 ${(R * 0.135).toFixed(1)}px 'Barlow Condensed', 'Arial Narrow', sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const txt = 'FRONTIER CUP ✦ CHAMPIONS ✦ '; const step = 0.118; for (let i = 0; i < txt.length; i++) { const a = -PI / 2 + (i - txt.length / 2 + 0.5) * step; ctx.save(); ctx.rotate(a + PI / 2); ctx.fillText(txt[i], 0, -R * 0.70); ctx.restore(); } ctx.restore(); }

    ctx.strokeStyle = 'rgba(255,250,220,0.8)'; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(...tip); ctx.stroke();
    ctx.strokeStyle = '#7a4c0c'; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.moveTo(...in1); ctx.lineTo(...tip); ctx.lineTo(...in2); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,70,10,0.55)'; ctx.lineWidth = 0.6; [-1, 1].forEach(sd => { const b = a + sd * 0.12; ctx.beginPath(); ctx.moveTo(Math.cos(b) * R * 0.30, Math.sin(b) * R * 0.30); for (let q = 1; q <= 6; q++) { const u = q / 6, rr = lerp(R * 0.30, R * 0.80, u), w = Math.sin(u * PI * 2) * 0.10 * sd; ctx.lineTo(Math.cos(b + w) * rr, Math.sin(b + w) * rr); } ctx.stroke(); });
    const bx = Math.cos(a) * R * 1.07, by = Math.sin(a) * R * 1.07, br = R * 0.115, bg = ctx.createRadialGradient(bx - br * 0.4, by - br * 0.45, 0, bx, by, br); bg.addColorStop(0, '#fffdf0'); bg.addColorStop(0.35, '#f6cc48'); bg.addColorStop(1, '#7a4c0c'); ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, by, br, 0, PI * 2); ctx.fill(); }

    ctx.strokeStyle = 'rgba(120,70,10,0.8)'; ctx.lineWidth = 0.6; for (let i = 0; i < 28; i++) { const a = i / 28 * PI * 2; ctx.beginPath(); ctx.moveTo(Math.cos(a) * br * 0.86, Math.sin(a) * br * 0.86); ctx.lineTo(Math.cos(a + 0.12) * br * 0.98, Math.sin(a + 0.12) * br * 0.98); ctx.stroke(); }
    const gr = br * 0.72, gg = ctx.createRadialGradient(-gr * 0.35, -gr * 0.4, 0, 0, 0, gr); gg.addColorStop(0, '#d8fff6'); gg.addColorStop(0.35, '#38d0bc'); gg.addColorStop(1, '#0a5e5a'); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, gr, 0, PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(10,70,60,0.35)'; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(-gr * 0.5, gr * 0.1); ctx.quadraticCurveTo(0, gr * 0.3, gr * 0.4, -gr * 0.2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.ellipse(-gr * 0.35, -gr * 0.4, gr * 0.22, gr * 0.12, -0.6, 0, PI * 2); ctx.fill(); }

function drawAtmos(ctx, W, H) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(W * SUN.x, H * SUN.y, 0, W * SUN.x, H * SUN.y, W * 0.7); g.addColorStop(0, 'rgba(255,250,220,0.12)'); g.addColorStop(0.3, 'rgba(255,240,200,0.04)'); g.addColorStop(1, 'rgba(255,240,200,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

// ════════ PAINT — sky → clouds → hawk → rock, desert, canyon, railway → train & smoke → dust → town & windmill → horse → foreground → poster → tumbleweed → stumps → trophy → light ════════
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const SCRATCH = document.createElement('canvas').getContext('2d');
const skyL = document.createElement('canvas'); skyL.width = 620; skyL.height = 355;
const back = document.createElement('canvas'); back.width = 620; back.height = 355;
const mid = document.createElement('canvas'); mid.width = 620; mid.height = 355;

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TURN_SECONDS = 7.5;
function paintBase() {

  const b = back.getContext('2d'); b.clearRect(0, 0, 620, 355); draw(b, 620, 355, 'back');
  const d = mid.getContext('2d'); d.clearRect(0, 0, 620, 355); draw(d, 620, 355, 'mid');

  drawPrairieDogs(ctx, 620, 355, t);
  ctx.drawImage(mid, 0, 0);

  drawLeak(ctx, 620, 355, t);
  drawChickens(ctx, 620, 355, t);
  drawDoors(ctx, 620, 355, t);
  drawWindmill(ctx, 620, 355, t);
  drawHorse(ctx, 620, 355, t);
  ctx.drawImage(front, 0, 0);
  drawSnake(ctx, 620, 355, t);
  drawPoster(ctx, 620, 355, t);
  drawCowboy(ctx, 620, 355, t, 'S');
  drawCowboy(ctx, 620, 355, t, 'O');
  drawTumbleweed(ctx, 620, 355, t);
  drawRoadrunner(ctx, 620, 355, t);

function loop(ms) { frame(ms); if (!reduceMotion) requestAnimationFrame(loop); }
paintBase(); frame(0);
if (!reduceMotion) requestAnimationFrame(loop);
let repainted = false;
const repaint = () => { if (!repainted) { repainted = true; paintBase(); if (reduceMotion) frame(0); } };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(repaint).catch(() => {});
setTimeout(repaint, 2000);
