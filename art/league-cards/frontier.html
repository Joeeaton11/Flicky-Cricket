<title>Frontier Cup Sheriff's Star</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@500;600&display=swap');
/* Layout: same league card shell as the other cards — a frontier town in red-rock country at high noon, above a stats grid */
:root {
  color-scheme: dark;
  --page: #070810;
  --card: #0c0f1c;
  --ink: #ffffff;
  --muted: rgba(255,255,255,0.36);
  --tier: #b884ff;
  --gold: #f0c030;
  --eng: #ffd080;
  --silver: #b8c8d8;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 16px;
}
.card {
  width: min(540px, 100%);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.70),
    0 60px 120px rgba(0,0,0,0.40);
}
.art { position: relative; line-height: 0; }
canvas { display: block; width: 100%; height: auto; background: #4aa0e8; }
.ovl {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 70px 18px 16px;
  background: linear-gradient(to bottom,
    rgba(12,15,28,0)    0%,
    rgba(12,15,28,0.52) 30%,
    rgba(12,15,28,0.92) 62%,
    rgba(12,15,28,1)   100%);
  pointer-events: none;
}
.pip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--display);
  font-weight: 700; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tier); margin-bottom: 8px;
}
.pip::before {
  content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--tier); box-shadow: 0 0 8px var(--tier);
}
.nm {
  font-family: var(--display); font-weight: 900;
  font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  color: var(--ink); text-shadow: 0 2px 24px rgba(0,0,0,1); margin-bottom: 5px;
}
.sub {
  font-family: var(--display); font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.info {
  padding: 13px 16px 17px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 9px 13px;
}
.lbl { display:block; font-family:var(--display); font-weight:700; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.26); margin-bottom:4px; }
.val { font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.02em; line-height:1; font-variant-numeric: tabular-nums; }
.cw { color:rgba(255,255,255,0.82); }
.cy { color:var(--gold); }
.ce { color:var(--eng); }
.cs { color:var(--silver); }
</style>

<div class="card">
  <div class="art">
    <canvas id="c" width="620" height="355" aria-label="High noon in Flicky Gulch: a frontier main street with a store, a saloon and a barber&#39;s, a water tower by the railroad, and across a red-rock gulch a timber trestle under Monument Valley buttes. A tumbleweed clips the stumps and the bail flips up and drops straight back on; the noon train steams across the trestle and blows its whistle, a hound on the saloon porch howls along, vultures lift off a dead tree, a windpump turns, a dust devil wanders the desert and a roadrunner streaks past. The Sheriff&#39;s Star sways centre stage."></canvas>
    <div class="ovl">
      <div class="pip">Tier 4 · Early Fantasy</div>
      <div class="nm">Frontier Cup</div>
      <div class="sub">Wild West Cricket · The Sheriff's Star</div>
    </div>
  </div>
  <div class="info">
    <div class="stat"><span class="lbl">Entry Cost</span><span class="val cw">2,800 coins</span></div>
    <div class="stat"><span class="lbl">Win Reward</span><span class="val cy">+3,360</span></div>
    <div class="stat"><span class="lbl">Unlock</span><span class="val ce">250 Trophies</span></div>
    <div class="stat"><span class="lbl">Prize</span><span class="val cy">Gold Chest</span></div>
  </div>
</div>

<script>
const PI = Math.PI;
const SHOW = 24.0;                                 // length of the shared schedule, seconds
const TUMBLE = [1.6, 7.4];                         // a tumbleweed rolls in, clips the stumps — the bail flips up and drops straight back on — then hops over and rolls on out of town
const TRAIN = { t0: 7.4, v: 72 };                  // the noon train: smoke over the rooftops first, then it steams out across the trestle
const WHISTLE = [11.6, 14.6];                      // two blasts on the whistle
const HOWL = [11.75, 13.0];                        // the hound on the saloon porch wakes and howls along
const HORSE_TOSS = [11.7, 13.1];                   // the horse throws its head at the whistle
const SPOOK = 11.85, ROOST = 19.4;                 // the vultures lift off the dead tree at the whistle and drift back later
const RR = [15.0, 17.2];                           // a roadrunner dashes in, stops, looks about, and is gone in a streak of dust
function win(m, [a, b]) { return m >= a && m <= b ? (m - a) / (b - a) : -1; }
const ease = (u) => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const lerp = (a, b, u) => a + (b - a) * u;
const env = (m, a, b, ri, fo) => m < a - ri ? 0 : m < a ? ease((m - a + ri) / ri) : m < b ? 1 : m < b + fo ? 1 - ease((m - b) / fo) : 0;
function hash(n) { const u = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return u - Math.floor(u); }
const SUN = { x: 0.16, y: 0.07 };                  // a high white noon sun, a little left: light from above-left, short shadows to the right
const BASE = 0.590;                                // the boardwalk, and the foot of the ridge
const HZ = 0.385;                                  // the far desert horizon under the buttes
const PT = 0.430;                                  // the top of the ridge the railroad runs along
const STUMPS = { x: 0.615, y: 0.690 };
// the gulch the trestle spans: the cut through the ridge, down to the creek bed
const NOTCH = [[0.395, PT], [0.430, 0.490], [0.470, 0.545], [0.540, 0.568], [0.670, 0.568], [0.730, 0.545], [0.772, 0.490], [0.805, PT]];
function notchY(fx) { const n = NOTCH.length; if (fx <= NOTCH[0][0] || fx >= NOTCH[n - 1][0]) return PT; for (let i = 0; i < n - 1; i++) { const [a, ya] = NOTCH[i], [b, yb] = NOTCH[i + 1]; if (fx <= b) return lerp(ya, yb, (fx - a) / (b - a)); } return PT; }
const TREE = { x: 0.830, y: 0.645 };               // the dead tree the vultures sit in
const MILL = { x: 0.955, y: 0.650, hub: 0.310 };    // the windpump
const PERCH = [[-19, 0.449, 1], [21, 0.432, -1]];   // where the vultures sit (offset from the tree in px, height, facing)

// ════════ STILL SCENE — Flicky Gulch at high noon: the store, the saloon and the barber's on the left, the water tower by the line; across the gulch the railroad
// runs along a red ridge and over a timber trestle; Monument-Valley buttes on the horizon; a dead tree, a saguaro and a windpump on the near side ════════
function draw(ctxReal, W, H, part) {
  let ctx = part === 'sky' ? ctxReal : SCRATCH;
  let seed = 7373;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const G = H * BASE, SX = W * SUN.x, SY = H * SUN.y, hz = H * HZ, pt = H * PT;

  // ── Sky: deep blue overhead, a hot white haze at the horizon; the sun a white-hot disc in a soft bloom ──
  { const g = ctx.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#1258c4'); g.addColorStop(0.45, '#3a92e2'); g.addColorStop(0.85, '#9ccff0'); g.addColorStop(1, '#e4f2f4'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz + 4);
    const sg = ctx.createRadialGradient(SX, SY, 0, SX, SY, W * 0.30); sg.addColorStop(0, 'rgba(255,255,245,1)'); sg.addColorStop(0.07, 'rgba(255,253,230,0.70)'); sg.addColorStop(0.25, 'rgba(255,250,220,0.18)'); sg.addColorStop(1, 'rgba(255,250,220,0)'); ctx.fillStyle = sg; ctx.fillRect(0, 0, W, hz + 4);
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(SX, SY, H * 0.028, 0, PI * 2); ctx.fill(); }

  ctx = part === 'far' ? ctxReal : SCRATCH;
  // ── the buttes on the horizon: a long mesa behind the town, the two Mittens and a broad butte; caprock, gullies, talus, haze ──
  const rock = (pts, lit, shade, hazeA) => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); const xs = pts.map(p => p[0]), x0 = Math.min(...xs), x1 = Math.max(...xs); const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, lit); g.addColorStop(0.6, lit); g.addColorStop(0.85, shade); g.addColorStop(1, shade); ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.clip(); const yt = Math.min(...pts.map(p => p[1]));
    ctx.strokeStyle = 'rgba(120,40,20,0.22)'; ctx.lineWidth = 0.8; for (let y = yt + 5; y < hz; y += 4 + rnd() * 4) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y + (rnd() - 0.5) * 2); ctx.stroke(); }
    for (let k = 0; k < 7; k++) { const x = x0 + (0.1 + 0.8 * rnd()) * (x1 - x0), w = 1.5 + rnd() * 2.5, len = (hz - yt) * (0.3 + 0.6 * rnd()); const gg = ctx.createLinearGradient(x - w, 0, x + w, 0); gg.addColorStop(0, 'rgba(90,26,12,0)'); gg.addColorStop(0.5, 'rgba(90,26,12,0.30)'); gg.addColorStop(1, 'rgba(255,190,140,0.20)'); ctx.fillStyle = gg;
      ctx.beginPath(); ctx.moveTo(x - w, yt + 3); ctx.quadraticCurveTo(x - w * 0.6, yt + len * 0.5, x, yt + len); ctx.quadraticCurveTo(x + w * 0.6, yt + len * 0.5, x + w, yt + 3); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = 'rgba(110,34,16,0.55)'; ctx.fillRect(x0, yt - 2, x1 - x0, 5); ctx.fillStyle = 'rgba(255,210,170,0.45)'; ctx.fillRect(x0, yt + 3, (x1 - x0) * 0.6, 1);
    ctx.fillStyle = `rgba(200,225,240,${hazeA})`; ctx.fillRect(x0, yt - 2, x1 - x0, hz - yt + 4); ctx.restore(); };
  const P = (fx, fy) => [W * fx, H * fy];
  rock([P(-0.01, HZ), P(-0.01, 0.262), P(0.14, 0.255), P(0.27, 0.262), P(0.30, 0.300), P(0.34, HZ)], '#e2885a', '#b85e3e', 0.30);
  // the left Mitten: a talus skirt, a tall square-shouldered block, a thin thumb
  rock([P(0.515, HZ), P(0.545, 0.335), P(0.565, 0.325), P(0.568, 0.180), P(0.575, 0.172), P(0.632, 0.174), P(0.636, 0.325), P(0.66, 0.338), P(0.69, HZ)], '#e8743c', '#a84828', 0.18);
  rock([P(0.641, 0.330), P(0.643, 0.236), P(0.648, 0.230), P(0.654, 0.236), P(0.656, 0.330)], '#e8743c', '#a84828', 0.18);
  // the right Mitten
  rock([P(0.680, HZ), P(0.705, 0.345), P(0.722, 0.335), P(0.725, 0.205), P(0.732, 0.198), P(0.778, 0.200), P(0.781, 0.335), P(0.80, 0.348), P(0.82, HZ)], '#e46e3a', '#a44628', 0.20);
  rock([P(0.708, 0.338), P(0.710, 0.262), P(0.714, 0.256), P(0.719, 0.262), P(0.721, 0.338)], '#e46e3a', '#a44628', 0.20);
  // a broad butte out at the edge
  rock([P(0.84, HZ), P(0.865, 0.320), P(0.880, 0.312), P(0.884, 0.232), P(0.89, 0.226), P(1.02, 0.228), P(1.02, HZ)], '#de6c3a', '#a24428', 0.24);
  // ── the far desert on top of the ridge: sand, scrub, a wash ──
  { const g = ctx.createLinearGradient(0, hz, 0, pt); g.addColorStop(0, '#f2cc96'); g.addColorStop(1, '#e8ac6c'); ctx.fillStyle = g; ctx.fillRect(0, hz, W, pt - hz + 1);
    for (let k = 0; k < 50; k++) { const y = hz + 2 + rnd() * (pt - hz - 3), x = W * (0.35 + rnd() * 0.65), s = 0.5 + (y - hz) / (pt - hz) * 1.3; ctx.fillStyle = 'rgba(120,120,60,0.5)'; ctx.beginPath(); ctx.ellipse(x, y, s * 1.4, s * 0.6, 0, 0, PI * 2); ctx.fill(); } }
  // ── the ridge: a band of red rock in layers, the gulch cut through it with the creek in its bed ──
  { ctx.beginPath(); ctx.moveTo(-2, pt); NOTCH.forEach(([fx, fy]) => ctx.lineTo(W * fx, H * fy)); ctx.lineTo(W + 2, pt); ctx.lineTo(W + 2, G + 8); ctx.lineTo(-2, G + 8); ctx.closePath();
    const g = ctx.createLinearGradient(0, pt, 0, G); g.addColorStop(0, '#e0905e'); g.addColorStop(0.5, '#c86c42'); g.addColorStop(1, '#a8522e'); ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.clip(); ctx.strokeStyle = 'rgba(110,40,18,0.28)'; ctx.lineWidth = 0.9; for (let y = pt + 4; y < G + 8; y += 3.5 + rnd() * 3) { ctx.beginPath(); ctx.moveTo(0, y); for (let x = 0; x <= W; x += 40) ctx.lineTo(x, y + (rnd() - 0.5) * 1.6); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,215,175,0.35)'; for (let y = pt + 9; y < G; y += 11 + rnd() * 6) ctx.fillRect(0, y, W, 1); ctx.restore();
    ctx.fillStyle = 'rgba(255,225,190,0.65)'; ctx.fillRect(0, pt, W * NOTCH[0][0], 1.2); ctx.fillRect(W * NOTCH[NOTCH.length - 1][0], pt, W, 1.2); }
  // the cut: the far wall in shade, the left wall in shade, the right wall in sun; a sandy bed and the creek
  { const pts = NOTCH.map(([fx, fy]) => [W * fx, H * fy]), n = pts.length, c = pts[3], d = pts[4], by = c[1];
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath(); const g = ctx.createLinearGradient(0, pt, 0, by); g.addColorStop(0, '#b45a36'); g.addColorStop(1, '#8a3e24'); ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.clip(); ctx.strokeStyle = 'rgba(70,24,10,0.30)'; ctx.lineWidth = 0.7; for (let y = pt + 5; y < by; y += 4 + rnd() * 3) { ctx.beginPath(); ctx.moveTo(pts[0][0], y); ctx.lineTo(pts[n - 1][0], y + (rnd() - 0.5) * 2); ctx.stroke(); }
    // the left wall turned from the sun, the right wall catching it
    ctx.fillStyle = 'rgba(60,20,8,0.32)'; ctx.beginPath(); ctx.moveTo(...pts[0]); for (let i = 1; i <= 3; i++) ctx.lineTo(...pts[i]); for (let i = 3; i >= 0; i--) ctx.lineTo(pts[i][0] + 10 + i * 4, pts[i][1]); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,150,0.45)'; ctx.beginPath(); ctx.moveTo(...pts[n - 1]); for (let i = n - 2; i >= 4; i--) ctx.lineTo(...pts[i]); for (let i = 4; i <= n - 1; i++) ctx.lineTo(pts[i][0] - 8 - (n - 1 - i) * 4, pts[i][1]); ctx.closePath(); ctx.fill();
    // a sandy bed and the creek winding along it
    ctx.fillStyle = '#d8a46a'; ctx.beginPath(); ctx.moveTo(pts[2][0] + 6, pts[2][1] + 4); ctx.lineTo(c[0], by - 3); ctx.lineTo(d[0], by - 3); ctx.lineTo(pts[5][0] - 6, pts[5][1] + 4); ctx.lineTo(pts[5][0], by + 8); ctx.lineTo(pts[2][0], by + 8); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#4a9ac8'; ctx.beginPath(); ctx.moveTo(c[0] - 14, by - 0.5); for (let x = c[0] - 14; x <= d[0] + 14; x += 8) ctx.lineTo(x, by - 1.2 + Math.sin(x * 0.07) * 1.2); for (let x = d[0] + 14; x >= c[0] - 14; x -= 8) ctx.lineTo(x, by + 1.8 + Math.sin(x * 0.07) * 1.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(200,235,255,0.7)'; for (let x = c[0] - 8; x < d[0] + 8; x += 9 + rnd() * 8) ctx.fillRect(x, by - 0.6 + Math.sin(x * 0.07) * 1.2, 3, 0.6);
    [[0.49, 0], [0.53, 1], [0.69, 0], [0.715, 1]].forEach(([fx, s]) => { ctx.fillStyle = s ? '#5a8a4a' : '#4a7a3a'; ctx.beginPath(); ctx.ellipse(W * fx, by - 3.5, 4, 2.4, 0, 0, PI * 2); ctx.fill(); }); }
  // ── the water tower beside the line: a staved tank with iron hoops on a braced timber frame, the spout swung up ──
  { const x = W * 0.372, tb = H * 0.237, tt = H * 0.170, tw = 15, gy = pt;
    ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 1.6; [[-11, -9], [11, 9]].forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(x + a, gy); ctx.lineTo(x + b, tb); ctx.stroke(); });
    ctx.lineWidth = 0.8; for (let y = tb + 8; y < gy - 4; y += 12) { const f = (yy) => lerp(9, 11, (yy - tb) / (gy - tb)); ctx.beginPath(); ctx.moveTo(x - f(y), y); ctx.lineTo(x + f(y + 12), y + 12); ctx.moveTo(x + f(y), y); ctx.lineTo(x - f(y + 12), y + 12); ctx.stroke(); }
    const g = ctx.createLinearGradient(x - tw, 0, x + tw, 0); g.addColorStop(0, '#d8a46a'); g.addColorStop(0.6, '#a8703c'); g.addColorStop(1, '#6a4020'); ctx.fillStyle = g; ctx.fillRect(x - tw, tt, tw * 2, tb - tt);
    ctx.strokeStyle = 'rgba(70,40,16,0.5)'; ctx.lineWidth = 0.5; for (let xx = x - tw + 3; xx < x + tw; xx += 3) { ctx.beginPath(); ctx.moveTo(xx, tt); ctx.lineTo(xx, tb); ctx.stroke(); }
    ctx.strokeStyle = '#3a3a40'; ctx.lineWidth = 1.2; [tt + 4, (tt + tb) / 2, tb - 3].forEach(y => { ctx.beginPath(); ctx.moveTo(x - tw, y); ctx.lineTo(x + tw, y); ctx.stroke(); });
    ctx.fillStyle = '#7a4a28'; ctx.beginPath(); ctx.moveTo(x - tw - 2, tt + 1); ctx.lineTo(x, tt - 9); ctx.lineTo(x + tw + 2, tt + 1); ctx.closePath(); ctx.fill(); ctx.fillStyle = 'rgba(255,220,170,0.5)'; ctx.beginPath(); ctx.moveTo(x - tw - 2, tt + 1); ctx.lineTo(x, tt - 9); ctx.lineTo(x - 2, tt + 1); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a3a40'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x + tw - 2, tb - 4); ctx.lineTo(x + tw + 9, tb - 12); ctx.stroke(); ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(x + tw + 9, tb - 12); ctx.lineTo(x + tw + 4, tt + 2); ctx.stroke(); }
  // ── the railroad along the ridge top and the timber trestle across the gulch: bents, X-bracing, girts, the deck, ties and rails ──
  { const x0 = W * 0.385, x1 = W * 0.815, deck = pt + 3.5, step = 15;
    const bents = []; for (let x = x0 + 4; x <= x1 - 2; x += step) { const b = H * notchY(x / W); if (b > deck + 3) bents.push([x, b]); }
    ctx.lineCap = 'round';
    for (let i = 0; i + 1 < bents.length; i++) { const [xa, ba] = bents[i], [xb, bb] = bents[i + 1], bot = Math.min(ba, bb); ctx.strokeStyle = '#6a4626'; ctx.lineWidth = 0.75;
      for (let y = deck + 1; y < bot - 2; y += 11) { const y2 = Math.min(y + 11, bot); ctx.beginPath(); ctx.moveTo(xa, y); ctx.lineTo(xb, y2); ctx.moveTo(xb, y); ctx.lineTo(xa, y2); ctx.stroke(); ctx.lineWidth = 0.9; ctx.beginPath(); ctx.moveTo(xa, y2); ctx.lineTo(xb, y2); ctx.stroke(); ctx.lineWidth = 0.75; } }
    bents.forEach(([x, b]) => { const sp = (b - deck) * 0.07; [[-1, '#5a3a1e'], [1, '#7a5230']].forEach(([s, c]) => { ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + s * 1.2, deck); ctx.lineTo(x + s * (1.2 + sp), b); ctx.stroke(); });
      ctx.strokeStyle = 'rgba(240,200,150,0.55)'; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(x - 1.6, deck); ctx.lineTo(x - 1.6 - sp, b); ctx.stroke(); ctx.fillStyle = '#8a7a60'; ctx.fillRect(x - 3 - sp, b - 1.5, 6 + sp * 2, 2); });
    ctx.fillStyle = '#4a2e18'; ctx.fillRect(x0, pt - 0.5, x1 - x0, 4.5); ctx.fillStyle = '#6a4424'; ctx.fillRect(x0, pt + 0.6, x1 - x0, 1.6); ctx.fillStyle = 'rgba(255,220,180,0.5)'; ctx.fillRect(x0, pt + 3.6, x1 - x0, 0.6);
    ctx.fillStyle = '#3a2414'; for (let x = 0; x < W; x += 3.2) ctx.fillRect(x, pt - 1.6, 1.8, 1.4);
    ctx.fillStyle = '#9a9aa4'; ctx.fillRect(0, pt - 2.1, W, 0.8); }

  ctx = part === 'town' ? ctxReal : SCRATCH;
  // ── building kit ──
