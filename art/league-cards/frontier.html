<title>Frontier Cup Sheriff's Star</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@500;600&display=swap');
/* Layout: same league card shell as the other cards — a frontier town in red-rock country at high noon, above a stats grid */
:root {
  color-scheme: dark;
  --page: #070810;
  --card: #0c0f1c;
  --ink: #ffffff;
  --muted: rgba(255,255,255,0.36);
  --tier: #b884ff;
  --gold: #f0c030;
  --eng: #ffd080;
  --silver: #b8c8d8;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 16px;
}
.card {
  width: min(540px, 100%);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.70),
    0 60px 120px rgba(0,0,0,0.40);
}
.art { position: relative; line-height: 0; }
canvas { display: block; width: 100%; height: auto; background: #4aa0e8; }
.ovl {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 70px 18px 16px;
  background: linear-gradient(to bottom,
    rgba(12,15,28,0)    0%,
    rgba(12,15,28,0.52) 30%,
    rgba(12,15,28,0.92) 62%,
    rgba(12,15,28,1)   100%);
  pointer-events: none;
}
.pip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--display);
  font-weight: 700; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tier); margin-bottom: 8px;
}
.pip::before {
  content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--tier); box-shadow: 0 0 8px var(--tier);
}
.nm {
  font-family: var(--display); font-weight: 900;
  font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  color: var(--ink); text-shadow: 0 2px 24px rgba(0,0,0,1); margin-bottom: 5px;
}
.sub {
  font-family: var(--display); font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.info {
  padding: 13px 16px 17px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 9px 13px;
}
.lbl { display:block; font-family:var(--display); font-weight:700; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.26); margin-bottom:4px; }
.val { font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.02em; line-height:1; font-variant-numeric: tabular-nums; }
.cw { color:rgba(255,255,255,0.82); }
.cy { color:var(--gold); }
.ce { color:var(--eng); }
.cs { color:var(--silver); }
</style>

<div class="card">
  <div class="art">
    <canvas id="c" width="620" height="355" aria-label="High noon in Flicky Gulch: a frontier main street under red buttes, the jail, store and barber on one side, the saloon, bank and hotel on the other. A tumbleweed rolls down the empty street; the bank doors burst open and masked robbers run for cover, one behind an overturned wagon, one round the saloon corner, a lookout on the balcony. The sheriff fires from behind barrels and the deputy trades shots from the barber&#39;s corner; the sheriff shoots the lookout&#39;s hat off and he topples into the water trough, then bursts the loot sack in a shower of banknotes. The gang give up and the deputy marches them into the jail."></canvas>
    <div class="ovl">
      <div class="pip">Tier 4 · Early Fantasy</div>
      <div class="nm">Frontier Cup</div>
      <div class="sub">Wild West Cricket · The Sheriff's Star</div>
    </div>
  </div>
  <div class="info">
    <div class="stat"><span class="lbl">Entry Cost</span><span class="val cw">2,800 coins</span></div>
    <div class="stat"><span class="lbl">Win Reward</span><span class="val cy">+3,360</span></div>
    <div class="stat"><span class="lbl">Unlock</span><span class="val ce">250 Trophies</span></div>
    <div class="stat"><span class="lbl">Prize</span><span class="val cy">Gold Chest</span></div>
  </div>
</div>

<script>
const PI = Math.PI;
const SHOW = 26.0;                                 // length of the shared schedule, seconds
const TUMBLE = [0.1, 3.3];                         // the hush: a tumbleweed rolls down the empty street, snags on the stumps, and blows on out of town
const BURST = 3.3;                                 // the bank doors burst open: the leader dives behind the wagon with the loot, his partner runs for the saloon corner
const HORSE_TOSS = [3.9, 5.3];                     // the horse throws its head at the first shot
const HIT_HAT = 8.9, SPLASH = 9.75;                // headline 1: the sheriff shoots the lookout's hat off — he topples off the balcony into the water trough
const BREAK = 13.0, POP = 13.5;                    // headline 2: the leader makes a break for it — the sheriff's shot bursts the loot sack and banknotes rain down
// every shot: [time, who fires, where it lands (fractions of the card), what it hits]
const SHOTS = [
  [3.90, 'O3', 0.300, 0.620, 'wood'], [4.60, 'S', 0.770, 0.612, 'wood'], [4.85, 'S', 0.700, 0.398, 'wood'],
  [5.30, 'S', 0.790, 0.615, 'wood'], [5.60, 'S', 0.760, 0.625, 'wood'], [5.95, 'O1', 0.300, 0.597, 'dirt'], [6.10, 'O3', 0.270, 0.618, 'wood'],
  [6.80, 'D', 0.636, 0.520, 'wood'], [7.10, 'D', 0.636, 0.548, 'wood'], [7.40, 'O2', 0.356, 0.505, 'wood'], [7.70, 'O2', 0.356, 0.535, 'wood'], [7.95, 'O3', 0.320, 0.628, 'wood'],
  [HIT_HAT, 'S', 0, 0, 'hat'],
  [11.00, 'O1', 0.262, 0.615, 'wood'], [11.25, 'O1', 0.310, 0.622, 'wood'], [11.50, 'S', 0.780, 0.612, 'wood'], [11.90, 'O2', 0.356, 0.520, 'wood'], [12.15, 'D', 0.636, 0.530, 'wood'], [12.40, 'O1', 0.290, 0.612, 'wood'],
  [POP, 'S', 0, 0, 'sack'],
];
function win(m, [a, b]) { return m >= a && m <= b ? (m - a) / (b - a) : -1; }
const ease = (u) => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const lerp = (a, b, u) => a + (b - a) * u;
function hash(n) { const u = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return u - Math.floor(u); }
const SUN = { x: 0.16, y: 0.07 };                  // a high white noon sun, a little left: light from above-left, short shadows to the right
const BASE = 0.590;                                // the boardwalks along the fronts of the buildings
const HZ = 0.420;                                  // the far desert horizon, seen down the side street
const STUMPS = { x: 0.615, y: 0.690 };
const JAIL = 0.077;                                // the jail door, where it all ends
const TR = { x0: 0.628, x1: 0.716, top: 0.604, base: 0.664 };   // the water trough in front of the saloon
const LOOKS = {
  sheriff: { hat: '#efe2c0', band: '#7a4a24', shirt: '#5a8ab8', vest: '#7a4a2a', badge: 1, tache: '#7a4a24', hair: '#8a5a2a', neck: '#e8c060', trous: '#6a5a48' },
  deputy: { hat: '#9a7448', band: '#3a2214', shirt: '#d0a040', vest: '#4a3a2a', badge: 1, hair: '#3a2214', neck: '#2a50b0', trous: '#5a4a3a' },
  robber: { hat: '#1c1618', band: '#9a9aa4', shirt: '#4a3a34', vest: '#1e1a1c', mask: '#c8202a', hair: '#1a1210', trous: '#3a3036' },
  gang1: { hat: '#5a3a24', band: '#2a1a10', shirt: '#3a6a3a', vest: '#2a1e18', mask: '#2a50b0', hair: '#3a2214', trous: '#4a3a2a' },
  gang3: { hat: '#2a2a30', band: '#e0b040', shirt: '#7a2a2a', vest: '#1e1a1c', mask: '#1e1a1c', hair: '#c88a40', trous: '#2a2224' },
};

// ════════ STILL SCENE — Flicky Gulch at high noon: the law's side of the street on the left (jail, general store, barber), the gang's side on the right
// (saloon, bank, hotel), the street running off between them into red-rock country; the overturned wagon and the barrels out in the street ════════
function draw(ctxReal, W, H, part) {
  let ctx = part === 'sky' ? ctxReal : SCRATCH;
  let seed = 7373;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const G = H * BASE, SX = W * SUN.x, SY = H * SUN.y, hz = H * HZ;

  // ── Sky: deep blue overhead, a hot white haze at the horizon; the sun a white-hot disc in a soft bloom ──
  { const g = ctx.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#1258c4'); g.addColorStop(0.45, '#3a92e2'); g.addColorStop(0.85, '#9ccff0'); g.addColorStop(1, '#e4f2f4'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz + 4);
    const sg = ctx.createRadialGradient(SX, SY, 0, SX, SY, W * 0.30); sg.addColorStop(0, 'rgba(255,255,245,1)'); sg.addColorStop(0.07, 'rgba(255,253,230,0.70)'); sg.addColorStop(0.25, 'rgba(255,250,220,0.18)'); sg.addColorStop(1, 'rgba(255,250,220,0)'); ctx.fillStyle = sg; ctx.fillRect(0, 0, W, hz + 4);
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(SX, SY, H * 0.028, 0, PI * 2); ctx.fill(); }

  ctx = part === 'far' ? ctxReal : SCRATCH;
  // ── red rock on the horizon: a long mesa behind the law's side, buttes behind the gang's; caprock, gullies, haze ──
  const rock = (pts, lit, shade, hazeA) => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); const xs = pts.map(p => p[0]), x0 = Math.min(...xs), x1 = Math.max(...xs); const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, lit); g.addColorStop(0.6, lit); g.addColorStop(0.85, shade); g.addColorStop(1, shade); ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.clip(); const yt = Math.min(...pts.map(p => p[1]));
    ctx.strokeStyle = 'rgba(120,40,20,0.22)'; ctx.lineWidth = 0.8; for (let y = yt + 5; y < hz; y += 4 + rnd() * 4) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y + (rnd() - 0.5) * 2); ctx.stroke(); }
    for (let k = 0; k < 9; k++) { const x = x0 + (0.1 + 0.8 * rnd()) * (x1 - x0), w = 1.5 + rnd() * 2.5, len = (hz - yt) * (0.3 + 0.6 * rnd()); const gg = ctx.createLinearGradient(x - w, 0, x + w, 0); gg.addColorStop(0, 'rgba(90,26,12,0)'); gg.addColorStop(0.5, 'rgba(90,26,12,0.30)'); gg.addColorStop(1, 'rgba(255,190,140,0.20)'); ctx.fillStyle = gg;
      ctx.beginPath(); ctx.moveTo(x - w, yt + 3); ctx.quadraticCurveTo(x - w * 0.6, yt + len * 0.5, x, yt + len); ctx.quadraticCurveTo(x + w * 0.6, yt + len * 0.5, x + w, yt + 3); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = 'rgba(110,34,16,0.55)'; ctx.fillRect(x0, yt - 2, x1 - x0, 5); ctx.fillStyle = 'rgba(255,210,170,0.45)'; ctx.fillRect(x0, yt + 3, (x1 - x0) * 0.6, 1);
    ctx.fillStyle = `rgba(200,225,240,${hazeA})`; ctx.fillRect(x0, yt - 2, x1 - x0, hz - yt + 4); ctx.restore(); };
  rock([[-6, hz], [-6, H * 0.300], [W * 0.10, H * 0.294], [W * 0.20, H * 0.300], [W * 0.29, H * 0.316], [W * 0.33, H * 0.350], [W * 0.37, hz]], '#e2885a', '#b85e3e', 0.28);
  rock([[W * 0.53, hz], [W * 0.556, H * 0.330], [W * 0.566, H * 0.258], [W * 0.574, H * 0.252], [W * 0.66, H * 0.255], [W * 0.668, H * 0.268], [W * 0.676, H * 0.330], [W * 0.70, hz]], '#e2723e', '#a8472a', 0.16);
  rock([[W * 0.78, hz], [W * 0.80, H * 0.300], [W * 0.81, H * 0.205], [W * 0.82, H * 0.198], [W * 1.02, H * 0.200], [W * 1.02, hz]], '#de6c3a', '#a24428', 0.14);
  // ── the far desert, and the street running off between the buildings into it ──
  { const g = ctx.createLinearGradient(0, hz, 0, G); g.addColorStop(0, '#f2c890'); g.addColorStop(0.5, '#e8a868'); g.addColorStop(1, '#d88c4c'); ctx.fillStyle = g; ctx.fillRect(0, hz, W, G - hz + 6);
    for (let k = 0; k < 60; k++) { const y = hz + 3 + Math.pow(rnd(), 1.3) * (G - hz), x = W * (0.34 + rnd() * 0.32), s = 0.5 + (y - hz) / (G - hz) * 2; ctx.fillStyle = 'rgba(120,120,60,0.5)'; ctx.beginPath(); ctx.ellipse(x, y, s * 1.4, s * 0.6, 0, 0, PI * 2); ctx.fill(); }
    ctx.fillStyle = 'rgba(250,215,165,0.55)'; ctx.beginPath(); ctx.moveTo(W * 0.37, G + 6); ctx.lineTo(W * 0.63, G + 6); ctx.lineTo(W * 0.504, hz + 1); ctx.lineTo(W * 0.496, hz + 1); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(160,96,50,0.30)'; ctx.lineWidth = 1; [[0.45, 0.499], [0.55, 0.501]].forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(W * a, G + 6); ctx.lineTo(W * b, hz + 2); ctx.stroke(); });
    // telegraph poles marching off beside the street, wires sagging between them
    const poles = [0, 0.38, 0.62, 0.78, 0.88].map(u => { const e = 1 - (1 - u) * (1 - u) * 0, x = lerp(W * 0.622, W * 0.507, u), b = lerp(G + 2, hz + 1.5, u), h = lerp(62, 5, u); return [x, b, h]; });
    poles.forEach(([x, b, h]) => { ctx.fillStyle = '#6a4424'; ctx.fillRect(x - Math.max(0.5, h * 0.025), b - h, Math.max(1, h * 0.05), h); ctx.fillRect(x - h * 0.12, b - h * 0.92, h * 0.24, Math.max(0.6, h * 0.025)); });
    ctx.strokeStyle = 'rgba(60,40,30,0.55)'; ctx.lineWidth = 0.5; [-0.1, 0.1].forEach(o => { ctx.beginPath(); poles.forEach(([x, b, h], i) => { const px = x + o * h, py = b - h * 0.92; if (!i) ctx.moveTo(px, py); else { const [x0, b0, h0] = poles[i - 1]; ctx.quadraticCurveTo((x0 + o * h0 + px) / 2, (b0 - h0 * 0.92 + py) / 2 + h * 0.08, px, py); } }); ctx.stroke(); }); }
  // ── the water tower out back: a staved tank with iron hoops on a braced timber frame ──
  { const x = W * 0.385, tb = H * 0.237, tt = H * 0.170, tw = 15, gy = H * 0.535;
    ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 1.6; [[-11, -9], [11, 9]].forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(x + a, gy); ctx.lineTo(x + b, tb); ctx.stroke(); });
    ctx.lineWidth = 0.8; for (let y = tb + 10; y < gy - 4; y += 14) { const f = (yy) => lerp(9, 11, (yy - tb) / (gy - tb)); ctx.beginPath(); ctx.moveTo(x - f(y), y); ctx.lineTo(x + f(y + 14), y + 14); ctx.moveTo(x + f(y), y); ctx.lineTo(x - f(y + 14), y + 14); ctx.stroke(); }
    const g = ctx.createLinearGradient(x - tw, 0, x + tw, 0); g.addColorStop(0, '#d8a46a'); g.addColorStop(0.6, '#a8703c'); g.addColorStop(1, '#6a4020'); ctx.fillStyle = g; ctx.fillRect(x - tw, tt, tw * 2, tb - tt);
    ctx.strokeStyle = 'rgba(70,40,16,0.5)'; ctx.lineWidth = 0.5; for (let xx = x - tw + 3; xx < x + tw; xx += 3) { ctx.beginPath(); ctx.moveTo(xx, tt); ctx.lineTo(xx, tb); ctx.stroke(); }
    ctx.strokeStyle = '#3a3a40'; ctx.lineWidth = 1.2; [tt + 4, (tt + tb) / 2, tb - 3].forEach(y => { ctx.beginPath(); ctx.moveTo(x - tw, y); ctx.lineTo(x + tw, y); ctx.stroke(); });
    ctx.fillStyle = '#7a4a28'; ctx.beginPath(); ctx.moveTo(x - tw - 2, tt + 1); ctx.lineTo(x, tt - 9); ctx.lineTo(x + tw + 2, tt + 1); ctx.closePath(); ctx.fill(); ctx.fillStyle = 'rgba(255,220,170,0.5)'; ctx.beginPath(); ctx.moveTo(x - tw - 2, tt + 1); ctx.lineTo(x, tt - 9); ctx.lineTo(x - 2, tt + 1); ctx.closePath(); ctx.fill(); }

  ctx = part === 'town' ? ctxReal : SCRATCH;
  // ── building kit ──
  const sign = (cx, y, w, h, text, bg, fg) => { ctx.fillStyle = bg; ctx.fillRect(cx - w / 2, y, w, h); ctx.strokeStyle = 'rgba(40,20,10,0.6)'; ctx.lineWidth = 0.6; ctx.strokeRect(cx - w / 2 + 0.5, y + 0.5, w - 1, h - 1);
    ctx.save(); ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `800 ${(h * 0.72).toFixed(1)}px 'Barlow Condensed', 'Arial Narrow', sans-serif`; ctx.fillText(text, cx, y + h * 0.54, w * 0.9); ctx.restore(); };
  const siding = (x0, x1, y0, y1, c0, c1) => { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, c0); g.addColorStop(1, c1); ctx.fillStyle = g; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.strokeStyle = 'rgba(40,20,10,0.20)'; ctx.lineWidth = 0.5; for (let y = y0 + 2.6; y < y1; y += 2.6) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,240,210,0.45)'; ctx.fillRect(x0, y0, 1, y1 - y0); ctx.fillStyle = 'rgba(60,30,10,0.25)'; ctx.fillRect(x1 - 1.5, y0, 1.5, y1 - y0); };
  const cap = (x0, x1, y) => { ctx.fillStyle = 'rgba(40,20,10,0.6)'; ctx.fillRect(x0 - 1.5, y - 2.5, x1 - x0 + 3, 3); ctx.fillStyle = 'rgba(255,235,200,0.5)'; ctx.fillRect(x0 - 1.5, y - 2.5, x1 - x0 + 3, 0.8); };
  const glassWin = (x, y, w, h, shut) => { ctx.fillStyle = '#2a3440'; ctx.fillRect(x, y, w, h); ctx.fillStyle = 'rgba(160,210,240,0.45)'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w * 0.6, y); ctx.lineTo(x, y + h * 0.6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#f0e0c0'; ctx.lineWidth = 0.9; ctx.strokeRect(x, y, w, h); ctx.beginPath(); ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h); ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2); ctx.stroke();
    if (shut) { ctx.fillStyle = shut; ctx.fillRect(x - 4, y, 3.5, h); ctx.fillRect(x + w + 0.5, y, 3.5, h); } ctx.fillStyle = 'rgba(40,20,10,0.5)'; ctx.fillRect(x - 1.5, y + h, w + 3, 1.6); };
  const openWin = (x, y, w, h, shut) => { const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#0e0806'); g.addColorStop(1, '#2a1810'); ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(160,210,240,0.35)'; ctx.fillRect(x + 1, y + 1, w - 2, h * 0.22); ctx.strokeStyle = '#f0e0c0'; ctx.lineWidth = 0.9; ctx.strokeRect(x, y, w, h); ctx.beginPath(); ctx.moveTo(x, y + h * 0.24); ctx.lineTo(x + w, y + h * 0.24); ctx.stroke();
    if (shut) { ctx.fillStyle = shut; [[x - 0.5, -1], [x + w + 0.5, 1]].forEach(([hx, d]) => { ctx.beginPath(); ctx.moveTo(hx, y); ctx.lineTo(hx + d * 5, y + 1.5); ctx.lineTo(hx + d * 5, y + h - 1.5); ctx.lineTo(hx, y + h); ctx.closePath(); ctx.fill(); }); }
    ctx.fillStyle = 'rgba(40,20,10,0.6)'; ctx.fillRect(x - 1.5, y + h, w + 3, 1.8); };
  const doorway = (x0, x1, y0) => { const g = ctx.createLinearGradient(0, y0, 0, G); g.addColorStop(0, '#0e0806'); g.addColorStop(1, '#2e1c10'); ctx.fillStyle = g; ctx.fillRect(x0, y0, x1 - x0, G - y0);
    ctx.strokeStyle = '#f0dcb0'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x0 - 0.7, G); ctx.lineTo(x0 - 0.7, y0 - 0.7); ctx.lineTo(x1 + 0.7, y0 - 0.7); ctx.lineTo(x1 + 0.7, G); ctx.stroke(); };
  const walk = (x0, x1) => { ctx.fillStyle = '#8a5a32'; ctx.fillRect(x0, G, x1 - x0, 5); ctx.strokeStyle = 'rgba(40,20,10,0.5)'; ctx.lineWidth = 0.5; for (let x = x0; x < x1; x += 5) { ctx.beginPath(); ctx.moveTo(x, G); ctx.lineTo(x, G + 5); ctx.stroke(); } ctx.fillStyle = 'rgba(255,230,190,0.6)'; ctx.fillRect(x0, G, x1 - x0, 0.8); };

    g.addColorStop(0, 'rgba(255,250,220,0)'); g.addColorStop(0.45, 'rgba(255,250,220,0)'); g.addColorStop(0.5, `rgba(255,252,230,${(0.30 + 0.25 * light).toFixed(3)})`); g.addColorStop(0.55, 'rgba(255,250,220,0)'); g.addColorStop(1, 'rgba(255,250,220,0)'); ctx.fillStyle = g; ctx.fillRect(-R * 1.3, -R * 1.3, R * 2.6, R * 2.6); ctx.restore(); }
  // a pinpoint of sun on the top ball as the badge swings through square to the sun
  { const k = Math.max(0, 1 - Math.abs(sway - 0.12) / 0.08); if (k > 0.02) { const bx = 0, by = -R * 1.07 - R * 0.05; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(255,255,240,${(0.85 * k).toFixed(3)})`; ctx.lineWidth = 0.7; const l = 6 * k; ctx.beginPath(); ctx.moveTo(bx - R * 0.04 - l, by); ctx.lineTo(bx - R * 0.04 + l, by); ctx.moveTo(bx - R * 0.04, by - l); ctx.lineTo(bx - R * 0.04, by + l); ctx.stroke(); ctx.restore(); } }
  ctx.restore();
}
function drawAtmos(ctx, W, H) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(W * SUN.x, H * SUN.y, 0, W * SUN.x, H * SUN.y, W * 0.7); g.addColorStop(0, 'rgba(255,250,220,0.12)'); g.addColorStop(0.3, 'rgba(255,240,200,0.04)'); g.addColorStop(1, 'rgba(255,240,200,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  const vig = ctx.createRadialGradient(W * 0.5, H * 0.45, W * 0.32, W * 0.5, H * 0.45, W * 0.85); vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(60,24,8,0.20)'); ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
}

// ════════ PAINT — sky → clouds → rock and desert → anyone round the side-street corners → town → doors, barber pole → the balcony and boardwalks → vultures
// → street → chickens → the sheriff, the robber and the lookout → barrels, wagon, trough → hat, splash, drips → horse → tumbleweed → stumps → guns, money → bullets → smoke → trophy → light ════════
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const SCRATCH = document.createElement('canvas').getContext('2d');
const layer = () => { const c = document.createElement('canvas'); c.width = 620; c.height = 355; return c; };
const skyL = layer(), far = layer(), town = layer(), ground = layer(), props = layer();
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TURN_SECONDS = 7.5;
function paintBase() {
  [[skyL, 'sky'], [far, 'far'], [town, 'town'], [ground, 'ground'], [props, 'props']].forEach(([c, part]) => { const k = c.getContext('2d'); k.clearRect(0, 0, 620, 355); draw(k, 620, 355, part); });
}
function frame(ms) {
  const t = reduceMotion ? 0 : Math.max(0, ms) / 1000;   // the game's clock can start a hair below zero
  const phi = (t / TURN_SECONDS) * Math.PI * 2;
  ctx.clearRect(0, 0, 620, 355);
  ctx.drawImage(skyL, 0, 0);
  drawClouds(ctx, 620, 355, t);
  ctx.drawImage(far, 0, 0);
  drawPass(ctx, 620, 355, t, 'behind');
  ctx.drawImage(town, 0, 0);
  drawBankDoors(ctx, 620, 355, t);
  drawBatwings(ctx, 620, 355, t);
  drawBarberPole(ctx, 620, 355, t);
  drawPass(ctx, 620, 355, t, 'town');
  drawVultures(ctx, 620, 355, t);
  ctx.drawImage(ground, 0, 0);
  drawChickens(ctx, 620, 355, t);
  drawPass(ctx, 620, 355, t, 'street');
  ctx.drawImage(props, 0, 0);
  drawHat(ctx, 620, 355, t);
  drawSplash(ctx, 620, 355, t);
  drawDrips(ctx, 620, 355, t);
  drawHorseAt(ctx, 620, 355, t);
  drawTumbleweed(ctx, 620, 355, t);
  drawStumps(ctx, 620, 355, t);
  drawDroppedGuns(ctx, 620, 355, t);
  drawMoney(ctx, 620, 355, t);
  drawImpacts(ctx, 620, 355, t);
  drawGunsmoke(ctx, 620, 355, t);
  drawTrophy(ctx, 620, 355, phi, t);
  drawAtmos(ctx, 620, 355);
}
function loop(ms) { frame(ms); if (!reduceMotion) requestAnimationFrame(loop); }
paintBase(); frame(0);
if (!reduceMotion) requestAnimationFrame(loop);
let repainted = false;
const repaint = () => { if (!repainted) { repainted = true; paintBase(); if (reduceMotion) frame(0); } };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(repaint).catch(() => {});
setTimeout(repaint, 2000);
</script>
