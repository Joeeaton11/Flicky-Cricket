<title>Witches' Ashes Cauldron</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@500;600&display=swap');
/* Layout: same league card shell as the other cards — a witch's hollow at moonrise, above a stats grid */
:root {
  color-scheme: dark;
  --page: #070810;
  --card: #0c0f1c;
  --ink: #ffffff;
  --muted: rgba(255,255,255,0.36);
  --tier: #b884ff;
  --gold: #f0c030;
  --eng: #ffb050;
  --silver: #b8c8d8;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 16px;
}
.card {
  width: min(540px, 100%);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.70),
    0 60px 120px rgba(0,0,0,0.40);
}
.art { position: relative; line-height: 0; }
canvas { display: block; width: 100%; height: auto; background: #2a1458; }
.ovl {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 70px 18px 16px;
  background: linear-gradient(to bottom,
    rgba(12,15,28,0)    0%,
    rgba(12,15,28,0.52) 30%,
    rgba(12,15,28,0.92) 62%,
    rgba(12,15,28,1)   100%);
  pointer-events: none;
}
.pip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--display);
  font-weight: 700; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tier); margin-bottom: 8px;
}
.pip::before {
  content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--tier); box-shadow: 0 0 8px var(--tier);
}
.nm {
  font-family: var(--display); font-weight: 900;
  font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  color: var(--ink); text-shadow: 0 2px 24px rgba(0,0,0,1); margin-bottom: 5px;
}
.sub {
  font-family: var(--display); font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.info {
  padding: 13px 16px 17px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 9px 13px;
}
.lbl { display:block; font-family:var(--display); font-weight:700; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.26); margin-bottom:4px; }
.val { font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.02em; line-height:1; font-variant-numeric: tabular-nums; }
.cw { color:rgba(255,255,255,0.82); }
.cy { color:var(--gold); }
.ce { color:var(--eng); }
.cs { color:var(--silver); }
</style>

<div class="card">
  <div class="art">
    <canvas id="c" width="620" height="355" aria-label="A witch's hollow at moonrise: a big harvest moon behind a gnarled dead oak with a raven on its branch; a crooked witch's cottage with glowing windows and a smoking chimney on a hill against the last orange afterglow; bats wheeling; a winding path lined with jack-o'-lanterns through a pumpkin patch; a gust blows autumn leaves through and snuffs the lanterns out, a witch on a broomstick flies across the moon, and the lanterns relight one by one; and the Cauldron, a black-iron cauldron on claw feet bubbling with green brew and ringed with glowing runes, turning on a slate plinth, by a set of stumps and a ball"></canvas>
    <div class="ovl">
      <div class="pip">Tier 4 · Early Fantasy</div>
      <div class="nm">Witches' Ashes</div>
      <div class="sub">Halloween Cricket · The Cauldron</div>
    </div>
  </div>
  <div class="info">
    <div class="stat"><span class="lbl">Entry Cost</span><span class="val cw">2,400 coins</span></div>
    <div class="stat"><span class="lbl">Win Reward</span><span class="val cy">+2,880</span></div>
    <div class="stat"><span class="lbl">Unlock</span><span class="val ce">220 Trophies</span></div>
    <div class="stat"><span class="lbl">Prize</span><span class="val cy">Gold Chest</span></div>
  </div>
</div>

    const ag = ctx.createRadialGradient(W * 0.02, G, 0, W * 0.02, G, W * 0.55); ag.addColorStop(0, 'rgba(255,170,80,0.70)'); ag.addColorStop(0.4, 'rgba(255,110,80,0.25)'); ag.addColorStop(1, 'rgba(255,110,80,0)'); ctx.fillStyle = ag; ctx.fillRect(0, 0, W, G + 2); }

      ctx.fillStyle = `rgba(${[196, 186, 200, 190, 205][i]},${[140, 128, 145, 135, 150][i]},${[96, 90, 100, 92, 104][i]},0.58)`; ctx.beginPath(); pts.forEach(([px, py], j) => { const x = MX + px * MR, y = MY + py * MR; j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.fill(); });

  [[-2.6, -1.0, -0.55], [-1.0, -1.25, -0.2], [0.8, -1.25, 0.15], [2.4, -1.05, 0.5]].forEach(([fx, , fa]) => { const a = -PI / 2 + fa, l1 = 4 * k, l2 = 3 * k; const x1 = fx * k + Math.cos(a) * l1, y1 = -5 * k + Math.sin(a) * l1, a2 = a - 0.5 - curl; ctx.beginPath(); ctx.moveTo(fx * k, -5 * k); ctx.lineTo(x1, y1); ctx.lineTo(x1 + Math.cos(a2) * l2, y1 + Math.sin(a2) * l2); ctx.stroke(); });
  ctx.beginPath(); ctx.moveTo(-3 * k, -1.5 * k); ctx.lineTo(-5.6 * k, -3.6 * k); ctx.lineTo(-6.2 * k, -6 * k); ctx.stroke();
  ctx.fillStyle = 'rgba(30,40,20,0.5)'; ctx.beginPath(); ctx.ellipse(1 * k, -2 * k, 1.2 * k, 0.8 * k, 0.3, 0, PI * 2); ctx.fill(); ctx.restore(); ctx.restore();
  // a lip of dirt round the hole, over the arm's base
  ctx.fillStyle = '#4a3428'; ctx.beginPath(); ctx.ellipse(x, mt + 1 * k, 5.5 * k, 1.8 * k, 0, 0, PI * 2); ctx.fill();
}

// ════════ GROUND MIST & WILL-O'-THE-WISPS — soft fog drifting along the valley and through the graveyard, pale green lights bobbing among the stones ════════
const MIST = (() => { const c = document.createElement('canvas'); c.width = 420; c.height = 36; const g = c.getContext('2d'); let q = 71; const r = () => { q = (q * 16807) % 2147483647; return (q - 1) / 2147483646; };
  g.filter = 'blur(5px)'; for (let i = 0; i < 26; i++) { const x = 20 + r() * 380, y = 14 + r() * 10, rx = 24 + r() * 40, ry = 4 + r() * 5; g.fillStyle = `rgba(215,185,240,${(0.10 + r() * 0.12).toFixed(3)})`; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, PI * 2); g.fill(); } return c; })();
function drawMist(ctx, W, H, t) {
  [[H * GROUND - 22, 5.5, 0.85, 0], [H * GROUND - 6, -3.8, 0.70, 180], [H * GROUND + 10, 2.6, 0.45, 90]].forEach(([y, sp, al, off]) => { const span = W + 420, x = (((t * sp + off) % span) + span) % span - 420; ctx.globalAlpha = al; ctx.drawImage(MIST, x, y - 18); ctx.drawImage(MIST, x + span - 420 > W ? x - span + 420 : x + 420, y - 18); });
  ctx.globalAlpha = 1;
}
function drawWisps(ctx, W, H, t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  [[0.640, -4, 5.1, 0], [0.760, -10, 6.7, 2], [0.820, 2, 4.3, 4]].forEach(([fx, dy, per, ph], i) => { const a = Math.max(0, Math.sin((t / per) * PI * 2 + ph)) ** 2; if (a < 0.02) return; const x = W * fx + Math.sin(t * 0.7 + i) * 6, y = H * GROUND + dy + Math.sin(t * 1.3 + i * 2) * 3;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 9); g.addColorStop(0, `rgba(200,255,220,${(0.85 * a).toFixed(3)})`); g.addColorStop(0.3, `rgba(110,255,170,${(0.35 * a).toFixed(3)})`); g.addColorStop(1, 'rgba(110,255,170,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 9, 0, PI * 2); ctx.fill(); });
  ctx.restore();
}

// ════════ PAINT — sky → stars → clouds → hollow → mansion → bats → raven → witches → patch → scarecrow → lanterns → trophy → explosion → light ════════
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const SCRATCH = document.createElement('canvas').getContext('2d');
const skyL = document.createElement('canvas'); skyL.width = 620; skyL.height = 355;
const back = document.createElement('canvas'); back.width = 620; back.height = 355;
const front = document.createElement('canvas'); front.width = 620; front.height = 355;
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TURN_SECONDS = 12.5;
// The cauldron stops turning when it erupts and only starts again once the goo has drained: it eases to a halt over a moment,
// stands still, then picks up speed again. turnTime is the clock with that pause taken out (integrated speed, so it never jumps).
const TURN_PAUSE = { a: 6.5, r1: 0.35, b: 6.5 + 5.4, r2: 1.2 };
function turnTime(t) {
  const { a, r1, b, r2 } = TURN_PAUSE, loss = (b + r2 - a) - r1 / 2 - r2 / 2, n = Math.floor(t / SHOW), m = t - n * SHOW;
  let I; if (m < a) I = m; else if (m < a + r1) { const u = m - a; I = a + u - u * u / (2 * r1); } else if (m < b) I = a + r1 / 2; else if (m < b + r2) { const u = m - b; I = a + r1 / 2 + u * u / (2 * r2); } else I = a + r1 / 2 + r2 / 2 + (m - b - r2);
  return n * (SHOW - loss) + I;
}
function paintBase() {
  const k = skyL.getContext('2d'); k.clearRect(0, 0, 620, 355); draw(k, 620, 355, 'sky');
  const b = back.getContext('2d'); b.clearRect(0, 0, 620, 355); draw(b, 620, 355, 'back');
  const f = front.getContext('2d'); f.clearRect(0, 0, 620, 355); draw(f, 620, 355, 'front');
}
function frame(ms) {
  const t = reduceMotion ? 0 : Math.max(0, ms) / 1000;   // the game's clock can start a hair below zero
  const phi = (turnTime(t) / TURN_SECONDS) * Math.PI * 2;
  ctx.clearRect(0, 0, 620, 355);
  ctx.drawImage(skyL, 0, 0);
  drawStars(ctx, 620, 355, t);
  drawClouds(ctx, 620, 355, t);
  const [shx, shy] = boomShake(t); ctx.save(); ctx.translate(shx, shy);
  ctx.drawImage(back, 0, 0);
  drawMist(ctx, 620, 355, t);
  drawWisps(ctx, 620, 355, t);
  drawMansion(ctx, 620, 355, t);
  drawCat(ctx, 620, 355, t);
  drawBats(ctx, 620, 355, t);
  drawRaven(ctx, 620, 355, t);
  drawWitch(ctx, 620, 355, t);
  ctx.drawImage(front, 0, 0);
  drawZombie(ctx, 620, 355, t);
  drawScarecrow(ctx, 620, 355, t);
  drawLanterns(ctx, 620, 355, t);
  drawTrophy(ctx, 620, 355, phi, t);
  drawLightning(ctx, 620, 355, t);
  drawSlime(ctx, 620, 355, t, phi);
  drawBoom(ctx, 620, 355, t);
  ctx.restore();
  drawAtmos(ctx, 620, 355);
}
function loop(ms) { frame(ms); if (!reduceMotion) requestAnimationFrame(loop); }
paintBase(); frame(0);
if (!reduceMotion) requestAnimationFrame(loop);
let repainted = false;
const repaint = () => { if (!repainted) { repainted = true; paintBase(); if (reduceMotion) frame(0); } };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(repaint).catch(() => {});
setTimeout(repaint, 2000);
</script>
