<title>Brass Cup</title>
<style>

/* Layout: same league card shell as the other cards — a steampunk city at dusk, above a stats grid */
:root {

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 16px;
}
.card {
  width: min(540px, 100%);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.70),
    0 60px 120px rgba(0,0,0,0.40);
}
.art { position: relative; line-height: 0; }
canvas { display: block; width: 100%; height: auto; background: #6a5a8a; }
.ovl {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 70px 18px 16px;
  background: linear-gradient(to bottom,
    rgba(16,12,20,0)    0%,
    rgba(16,12,20,0.52) 30%,
    rgba(16,12,20,0.92) 62%,
    rgba(16,12,20,1)   100%);
  pointer-events: none;
}
.pip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--display);
  font-weight: 700; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tier); margin-bottom: 8px;
}
.pip::before {
  content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--tier); box-shadow: 0 0 8px var(--tier);
}
.nm {
  font-family: var(--display); font-weight: 900;
  font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  color: var(--ink); text-shadow: 0 2px 24px rgba(0,0,0,1); margin-bottom: 5px;
}
.sub {
  font-family: var(--display); font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.info {
  padding: 13px 16px 17px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 9px 13px;
}
.lbl { display:block; font-family:var(--display); font-weight:700; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.26); margin-bottom:4px; }
.val { font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.02em; line-height:1; font-variant-numeric: tabular-nums; }
.cw { color:rgba(255,255,255,0.82); }
.cy { color:var(--gold); }
.ce { color:var(--eng); }
.cs { color:var(--silver); }
</style>

<div class="card">

      <div class="sub">Steampunk Cricket · The Grand Orrery</div>

  </div>
  <div class="info">

    <div class="stat"><span class="lbl">Unlock</span><span class="val ce">530 Trophies</span></div>

</div>
