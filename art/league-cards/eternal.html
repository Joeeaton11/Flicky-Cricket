<title>Eternal Cup</title>

}
.card {

  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:

canvas { display: block; width: 100%; height: auto; background: #3a2018; }

  padding: 70px 18px 16px;

    rgba(16,12,20,0)    0%,
    rgba(16,12,20,0.52) 30%,
    rgba(16,12,20,0.92) 62%,
    rgba(16,12,20,1)   100%);
  pointer-events: none;
}
.pip {

  font-family: var(--display);
  font-weight: 700; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tier); margin-bottom: 8px;
}
.pip::before {
  content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--tier); box-shadow: 0 0 8px var(--tier);
}
.nm {
  font-family: var(--display); font-weight: 900;
  font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  color: var(--ink); text-shadow: 0 2px 24px rgba(0,0,0,1); margin-bottom: 5px;
}
.sub {
  font-family: var(--display); font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.info {
  padding: 13px 16px 17px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 9px 13px;
}
.lbl { display:block; font-family:var(--display); font-weight:700; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.26); margin-bottom:4px; }
.val { font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.02em; line-height:1; font-variant-numeric: tabular-nums; }
.cw { color:rgba(255,255,255,0.82); }
.cy { color:var(--gold); }
.ce { color:var(--eng); }
.cs { color:var(--silver); }
</style>

// ════════ THE CRYPT — the wall painted once as an unrolled strip, then wrapped round the room each frame column by column. Rough-hewn
// ashlar, damp and moss, a plinth course; eight round-arched alcoves between carved colonnettes, chevron moulding and a laurel keystone,
// a fluted shell in each arch-head, a pedestal with its numeral and candles either side, the hero filling the alcove; piers between with
// a carved shield and an iron torch bracket; a frieze of laurel and cricket balls, a cornice, and ribs rising into the dark vault ════════
let WALL = null;
const rowY = (h) => (STRIP_TOP - h) * PPM;         // a height on the wall → a row of the strip
const nicheU = (i) => (i + 0.5) * CIRC / HEROES.length;
const pierU = (i) => (i + 1) * CIRC / HEROES.length;
const STONE_A = '#7a7062', STONE_B = '#5a5246', STONE_C = '#3a342c';
function arched(c, x, hw, ys, yb) { c.beginPath(); c.moveTo(x - hw, yb); c.lineTo(x - hw, ys); c.arc(x, ys, hw, PI, TAU); c.lineTo(x + hw, yb); c.closePath(); }
function paintWall() {
  const cv = document.createElement('canvas'); cv.width = TW + WRAP; cv.height = TH; const c = cv.getContext('2d'), r = mkRnd(4242);
  // ── the vault: dark webs between ribs, fading into blackness overhead ──
  c.fillStyle = vGrad(c, 0, rowY(7.35), [[0, '#06050a'], [0.55, '#1c1814'], [1, '#3a332a']]); c.fillRect(0, 0, TW, rowY(7.35));
  c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 1; for (let h = 7.75; h < 10.8; h += 0.45) { c.beginPath(); c.moveTo(0, rowY(h)); c.lineTo(TW, rowY(h)); c.stroke(); }
  HEROES.forEach((_, i) => { [pierU(i), nicheU(i)].forEach((u, j) => { const x = u * PPM, w = j ? 7 : 12;
      c.fillStyle = vGrad(c, 0, rowY(7.35), [[0, 'rgba(60,52,44,0)'], [0.5, '#4a4236'], [1, '#6a6052']]); c.fillRect(x - w / 2, 0, w, rowY(7.35)); c.fillStyle = 'rgba(255,220,170,0.12)'; c.fillRect(x - w / 2, 0, 2, rowY(7.35)); }); });
  // ── the wall: rough ashlar courses of varied height, each block its own tint, chisel-pitted ──
  let y = TH; while (y > rowY(6.65)) { const bh = (0.62 + r() * 0.3) * PPM; let x = -r() * PPM; while (x < TW) { const bw = (1.2 + r() * 1.0) * PPM, v = r();
      c.fillStyle = v < 0.33 ? STONE_B : v < 0.7 ? STONE_A : '#857a6a'; c.fillRect(x, y - bh, bw, bh);
      c.fillStyle = 'rgba(255,240,210,0.08)'; c.fillRect(x + 2, y - bh + 2, bw - 4, 2); c.fillStyle = 'rgba(0,0,0,0.18)'; c.fillRect(x + 2, y - 4, bw - 4, 3);
      for (let k = 0; k < bw * bh / 90; k++) { c.fillStyle = r() < 0.5 ? 'rgba(0,0,0,0.12)' : 'rgba(255,240,210,0.07)'; c.fillRect(x + r() * bw, y - bh + r() * bh, 1.5, 1.5); }
      c.strokeStyle = 'rgba(22,18,14,0.6)'; c.lineWidth = 1.5; c.strokeRect(x, y - bh, bw, bh); x += bw; } y -= bh; }
  // damp, moss and cracks
  for (let k = 0; k < 40; k++) { const x = r() * TW, yy = r() < 0.5 ? rowY(0.6 + r()) : rowY(5 + r() * 1.5), rr = (0.3 + r() * 0.8) * PPM, g = c.createRadialGradient(x, yy, 0, x, yy, rr); g.addColorStop(0, r() < 0.5 ? 'rgba(70,90,50,0.35)' : 'rgba(30,34,26,0.3)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(x - rr, yy - rr, rr * 2, rr * 2); }
  c.strokeStyle = 'rgba(16,12,10,0.7)'; c.lineWidth = 1.2; for (let k = 0; k < 18; k++) { let x = r() * TW, yy = rowY(1 + r() * 4.5); c.beginPath(); c.moveTo(x, yy); for (let s = 0; s < 6; s++) { x += (r() - 0.5) * 14; yy += 6 + r() * 8; c.lineTo(x, yy); } c.stroke(); }
  // the plinth course
  c.fillStyle = vGrad(c, rowY(0.5), TH, [[0, '#6a6052'], [1, '#3a342c']]); c.fillRect(0, rowY(0.5), TW, 0.5 * PPM); c.fillStyle = 'rgba(255,230,190,0.25)'; c.fillRect(0, rowY(0.5), TW, 2); c.fillStyle = '#2a241e'; for (let x = 0; x < TW; x += 1.6 * PPM) c.fillRect(x, rowY(0.5), 2, 0.5 * PPM);
  // the frieze: a band of carved laurel with cricket balls set in it, and the cornice over it
  { const y0 = rowY(7.2), y1 = rowY(6.65); c.fillStyle = vGrad(c, y0, y1, [[0, '#8a7e6c'], [1, '#5a5246']]); c.fillRect(0, y0, TW, y1 - y0); c.fillStyle = '#2a241e'; c.fillRect(0, y1 - 2, TW, 2); c.fillRect(0, y0, TW, 2);
    const ym = (y0 + y1) / 2; c.strokeStyle = '#3a342c'; c.lineWidth = 2; c.beginPath(); for (let x = 0; x <= TW; x += 4) c.lineTo(x, ym + Math.sin(x / PPM * 3) * 3); c.stroke();
