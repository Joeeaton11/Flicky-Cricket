<title>PCL Green Cup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@500;600&display=swap');
/* Layout: same league card shell as the other cards — a Lahore at golden hour, above a stats grid */
:root {
  color-scheme: dark;
  --page: #070810;
  --card: #0c0f1c;
  --ink: #ffffff;
  --muted: rgba(255,255,255,0.36);
  --tier: #b884ff;
  --gold: #f0c030;
  --eng: #80ff98;
  --silver: #b8c8d8;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 16px;
}
.card {
  width: min(540px, 100%);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.70),
    0 60px 120px rgba(0,0,0,0.40);
}
.art { position: relative; line-height: 0; }
canvas { display: block; width: 100%; height: auto; background: #f2c890; }
.ovl {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 70px 18px 16px;
  background: linear-gradient(to bottom,
    rgba(12,15,28,0)    0%,
    rgba(12,15,28,0.52) 30%,
    rgba(12,15,28,0.92) 62%,
    rgba(12,15,28,1)   100%);
  pointer-events: none;
}
.pip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--display);
  font-weight: 700; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tier); margin-bottom: 8px;
}
.pip::before {
  content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--tier); box-shadow: 0 0 8px var(--tier);
}
.nm {
  font-family: var(--display); font-weight: 900;
  font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  color: var(--ink); text-shadow: 0 2px 24px rgba(0,0,0,1); margin-bottom: 5px;
}
.sub {
  font-family: var(--display); font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.info {
  padding: 13px 16px 17px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 9px 13px;
}
.lbl { display:block; font-family:var(--display); font-weight:700; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.26); margin-bottom:4px; }
.val { font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.02em; line-height:1; font-variant-numeric: tabular-nums; }
.cw { color:rgba(255,255,255,0.82); }
.cy { color:var(--gold); }
.ce { color:var(--eng); }
.cs { color:var(--silver); }
</style>

<div class="card">
  <div class="art">
    <canvas id="c" width="620" height="355" aria-label="Lahore at golden hour: the red-sandstone Badshahi Mosque with its white marble domes and tall minarets, pigeons on its parapet; the old city of painted havelis and carved balconies with Minar-e-Pakistan in the haze; Minar-e-Pakistan rising behind the rooftops; green parakeets; Basant kites over the rooftops, one cutting another loose; green-and-white bunting; a chai dhaba with a steaming kettle and a charpai; a hand-painted Pakistani truck glinting with reflective tape, and a plumed horse-drawn tanga, along the road; floodlights coming on at dusk; Pakistan's flag flying; and the Green Cup on a white-marble plinth inlaid with stone flowers, above a Mughal garden with a fountain channel, cypresses and flower beds, a tape-ball by the stumps"></canvas>
    <div class="ovl">
      <div class="pip">Tier 4 · Early Fantasy</div>
      <div class="nm">PCL</div>
      <div class="sub">Pakistan Champions League · The Green Cup</div>
    </div>
  </div>
  <div class="info">
    <div class="stat"><span class="lbl">Entry Cost</span><span class="val cw">2,000 coins</span></div>
    <div class="stat"><span class="lbl">Win Reward</span><span class="val cy">+2,400</span></div>
    <div class="stat"><span class="lbl">Unlock</span><span class="val ce">190 Trophies</span></div>
    <div class="stat"><span class="lbl">Prize</span><span class="val cy">Gold Chest</span></div>
  </div>
</div>

  [[0.665, 0.92], [0.775, 1.2], [0.90, 0.92]].forEach(([fx0, k]) => { const fx = MX(fx0); const g = ctx.createRadialGradient(W * fx, G, 0, W * fx, G, H * 0.22 * k); g.addColorStop(0, `rgba(255,190,110,${(0.32 * d).toFixed(3)})`); g.addColorStop(1, 'rgba(255,170,90,0)'); ctx.fillStyle = g; ctx.fillRect(W * fx - H * 0.25 * k, G - H * 0.26 * k, H * 0.5 * k, H * 0.27 * k); });
  [[0.665, 0.355, 0.05], [0.915, 0.355, 0.05], [0.775, 0.235, 0.08], [0.605, 0.21, 0.025], [0.985, 0.205, 0.025]].forEach(([fx0, fy, r]) => { const fx = MX(fx0); const g = ctx.createRadialGradient(W * fx, H * fy, 0, W * fx, H * fy, W * r); g.addColorStop(0, `rgba(255,245,215,${(0.30 * d).toFixed(3)})`); g.addColorStop(1, 'rgba(255,240,210,0)'); ctx.fillStyle = g; ctx.fillRect(W * (fx - r), H * fy - W * r, W * r * 2, W * r * 2); });
  { const pxl = W * MX(0.775), g = ctx.createRadialGradient(pxl, G - H * 0.06, 0, pxl, G - H * 0.06, W * 0.04); g.addColorStop(0, `rgba(255,210,120,${(0.6 * d).toFixed(3)})`); g.addColorStop(1, 'rgba(255,200,110,0)'); ctx.fillStyle = g; ctx.fillRect(pxl - W * 0.04, G - H * 0.13, W * 0.08, H * 0.13); }
  ctx.restore();
  HOUSES.forEach(([fx, fw, fy], i) => { const x = W * fx, w = W * fw, y = H * fy; for (let row = 0; row < 3; row++) for (let c = 0; c < 2; c++) { if ((i + row * 2 + c) % 3) continue; const wx = x + w * (0.22 + c * 0.40), wy = y + (G - y) * (0.16 + row * 0.27); if (wy > G - 8) continue;
    const on = Math.min(1, Math.max(0, d * 3 - ((i * 7 + row * 3 + c) % 5) * 0.4)); if (on <= 0) continue; ctx.fillStyle = `rgba(255,200,110,${(0.9 * on).toFixed(3)})`; ctx.beginPath(); ctx.moveTo(wx, wy + 6); ctx.lineTo(wx, wy + 1.5); ctx.quadraticCurveTo(wx + 1.8, wy - 1, wx + 3.6, wy + 1.5); ctx.lineTo(wx + 3.6, wy + 6); ctx.closePath(); ctx.fill(); } });
}
function drawDuskTint(ctx, W, H, d) {
  if (d <= 0.01) return;
  const g = ctx.createLinearGradient(0, 0, 0, H * GROUND); g.addColorStop(0, `rgba(50,30,90,${(0.35 * d).toFixed(3)})`); g.addColorStop(0.6, `rgba(120,50,90,${(0.12 * d).toFixed(3)})`); g.addColorStop(1, 'rgba(160,60,60,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * GROUND);
  ctx.fillStyle = `rgba(90,40,50,${(0.12 * d).toFixed(3)})`; ctx.fillRect(0, H * GROUND, W, H * (1 - GROUND));
}

// ════════ THE FLAG — Pakistan's flag streaming from the pole: a white band at the hoist, dark green field, white crescent and star ════════
function drawFlag(ctx, W, H, t) {
  const fx = W * 0.315, fy = H * 0.175, fw = W * 0.075, fh = W * 0.05, N = 14, wv = (u) => Math.sin(t * 4.2 - u * 5.5) * fh * 0.09 * u + Math.sin(t * 2.3 - u * 3) * fh * 0.04 * u;
  const P = (u, v) => [fx + u * fw, fy + v * fh + wv(u)];
  for (let k = 0; k < N; k++) { const u0 = k / N, u1 = (k + 1) / N, [ax, ay] = P(u0, 0), [bx, by] = P(u1, 0), [cx, cy] = P(u1, 1), [dx, dy] = P(u0, 1), shade = 0.85 + 0.15 * Math.cos(t * 4.2 - u0 * 5.5);
    ctx.fillStyle = u0 < 0.25 ? `rgb(${(250 * shade) | 0},${(250 * shade) | 0},${(245 * shade) | 0})` : `rgb(${(4 * shade) | 0},${(98 * shade) | 0},${(56 * shade) | 0})`; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx + 0.3, by); ctx.lineTo(cx + 0.3, cy); ctx.lineTo(dx, dy); ctx.closePath(); ctx.fill(); }
  const [mx, my] = P(0.62, 0.5); crescent(ctx, mx, my, fh * 0.27, -0.75, '#ffffff');
}

// ════════ THE TRUCK — a hand-painted Pakistani truck rumbling along the road: carved wooden crown over the cab, every panel painted
// with flowers and patterns, chains and bells swinging from the bumper, wheels turning ════════
function drawTruck(ctx, W, H, t) {
  const m = t % SHOW, w = win(m, TRUCK); if (w < 0) return;
  const s = W * 0.17, stop = W * 0.715, X = (ww) => ww < 0.32 ? lerp(-s * 0.7, stop, 1 - Math.pow(1 - ww / 0.32, 2)) : ww < 0.62 ? stop : lerp(stop, W + s * 0.7, Math.pow((ww - 0.62) / 0.38, 2));
  const x = X(w), moving = w < 0.31 || w > 0.63, y = H * GROUND + H * 0.040, bounce = moving ? Math.abs(Math.sin(t * 9)) * 0.8 : Math.abs(Math.sin(t * 31)) * 0.25;
  ctx.save(); ctx.translate(x, y - bounce);
  ctx.fillStyle = 'rgba(20,10,10,0.35)'; ctx.beginPath(); ctx.ellipse(s * 0.05, bounce + 1, s * 0.55, 2.2, 0, 0, PI * 2); ctx.fill();
  // cargo body (rear, to the left): tall painted panels on a wooden frame
  const bx0 = -s * 0.52, bx1 = s * 0.12, btop = -s * 0.44, bbot = -s * 0.10;
  ctx.fillStyle = '#f0c030'; ctx.fillRect(bx0, btop, bx1 - bx0, bbot - btop);
  const panels = ['#e8203a', '#1a8ad8', '#20a040', '#e040a0']; for (let k = 0; k < 4; k++) { const px = bx0 + 2 + k * (bx1 - bx0 - 4) / 4, pw = (bx1 - bx0 - 4) / 4 - 2; ctx.fillStyle = panels[k]; ctx.fillRect(px, btop + 3, pw, (bbot - btop) * 0.55);
    // a painted flower or an eye on each panel
    const cx = px + pw / 2, cy = btop + 3 + (bbot - btop) * 0.27, pr = Math.min(pw, (bbot - btop) * 0.5) * 0.28; if (k % 2) { for (let p = 0; p < 5; p++) { const a = p / 5 * PI * 2; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * pr * 0.7, cy + Math.sin(a) * pr * 0.7, pr * 0.5, pr * 0.3, a, 0, PI * 2); ctx.fill(); } ctx.fillStyle = '#ffd040'; ctx.beginPath(); ctx.arc(cx, cy, pr * 0.35, 0, PI * 2); ctx.fill(); }
    else { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(cx, cy, pr * 1.1, pr * 0.6, 0, 0, PI * 2); ctx.fill(); ctx.fillStyle = '#1a1a40'; ctx.beginPath(); ctx.arc(cx, cy, pr * 0.42, 0, PI * 2); ctx.fill(); } }
  ctx.fillStyle = '#7a3a18'; ctx.fillRect(bx0, bbot - (bbot - btop) * 0.30, bx1 - bx0, (bbot - btop) * 0.30);           // lower wooden boards with stripes
  ['#ffd040', '#e8203a', '#ffffff'].forEach((c, k) => { ctx.fillStyle = c; ctx.fillRect(bx0, bbot - (bbot - btop) * 0.30 + 2 + k * 2.5, bx1 - bx0, 1.2); });
  ctx.fillStyle = '#c8301a'; ctx.beginPath(); ctx.moveTo(bx0 - 2, btop); ctx.lineTo(bx1 + 1, btop); ctx.lineTo(bx1 + 1, btop - 5); ctx.quadraticCurveTo((bx0 + bx1) / 2, btop - 9, bx0 - 2, btop - 5); ctx.closePath(); ctx.fill();   // arched top rail
  ctx.fillStyle = '#ffd040'; for (let k = 0; k < 9; k++) ctx.fillRect(bx0 + k * (bx1 - bx0) / 9, btop - 4.5, 2, 2);
  // cab (front, to the right): rounded bonnet, windscreen, the carved and painted crown (taj) overhanging the roof
  const cx0 = bx1 + 1, cx1 = s * 0.48, ctop = -s * 0.36;
  ctx.fillStyle = '#1a8ad8'; ctx.beginPath(); ctx.moveTo(cx0, bbot); ctx.lineTo(cx0, ctop); ctx.lineTo(cx0 + (cx1 - cx0) * 0.55, ctop); ctx.lineTo(cx0 + (cx1 - cx0) * 0.68, ctop + s * 0.12); ctx.quadraticCurveTo(cx1, ctop + s * 0.13, cx1, bbot - s * 0.04); ctx.lineTo(cx1, bbot); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#bfe4f4'; ctx.beginPath(); ctx.moveTo(cx0 + (cx1 - cx0) * 0.30, ctop + 3); ctx.lineTo(cx0 + (cx1 - cx0) * 0.53, ctop + 3); ctx.lineTo(cx0 + (cx1 - cx0) * 0.64, ctop + s * 0.11); ctx.lineTo(cx0 + (cx1 - cx0) * 0.30, ctop + s * 0.11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd040'; ctx.fillRect(cx0, ctop + s * 0.15, cx1 - cx0, 1.6); ctx.fillStyle = '#e8203a'; ctx.fillRect(cx0, ctop + s * 0.17, cx1 - cx0, 1.2);
  ctx.fillStyle = '#ffffff'; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(cx0 + 4 + k * 5, ctop + s * 0.22, 1.4, 0, PI * 2); ctx.fill(); }
  { const tw0 = cx0 - 3, tw1 = cx0 + (cx1 - cx0) * 0.62, ty = ctop; const g = ctx.createLinearGradient(0, ty - 12, 0, ty); g.addColorStop(0, '#ffd860'); g.addColorStop(1, '#c87818'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(tw0, ty); ctx.lineTo(tw0, ty - 6); ctx.quadraticCurveTo((tw0 + tw1) / 2, ty - 15, tw1 + 4, ty - 7); ctx.lineTo(tw1 + 4, ty); ctx.closePath(); ctx.fill();
    ['#e8203a', '#20a040', '#1a8ad8'].forEach((c, k) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(tw0 + 4 + k * 6, ty - 5 - (k === 1 ? 2 : 0), 1.7, 0, PI * 2); ctx.fill(); }); }
  ctx.fillStyle = '#fff8d0'; ctx.beginPath(); ctx.arc(cx1 - 1, bbot - s * 0.06, 2, 0, PI * 2); ctx.fill();
  // bumper with dangling chains and bells, swinging with the motion
  ctx.fillStyle = '#d8d8d0'; ctx.fillRect(bx0 - 2, bbot, cx1 - bx0 + 3, 2.2);
  for (let k = 0; k < 9; k++) { const cx = bx0 + 2 + k * (cx1 - bx0) / 9, sway = Math.sin(t * 9 + k) * 1.5, L = 5 + (k % 3); ctx.strokeStyle = '#e8d8a0'; ctx.lineWidth = 0.6; ctx.beginPath(); ctx.moveTo(cx, bbot + 2); ctx.lineTo(cx + sway, bbot + 2 + L); ctx.stroke(); ctx.fillStyle = '#ffd040'; ctx.beginPath(); ctx.arc(cx + sway, bbot + 2.5 + L, 1.1, 0, PI * 2); ctx.fill(); }
  // wheels, turning
  [-s * 0.38, -s * 0.18, s * 0.33].forEach(wx => { const wr = s * 0.07; ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(wx, -wr * 0.6, wr, 0, PI * 2); ctx.fill(); ctx.fillStyle = '#e8203a'; ctx.beginPath(); ctx.arc(wx, -wr * 0.6, wr * 0.5, 0, PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffd040'; ctx.lineWidth = 0.7; for (let k = 0; k < 4; k++) { const a = x / (s * 0.07) + k * PI / 2; ctx.beginPath(); ctx.moveTo(wx, -wr * 0.6); ctx.lineTo(wx + Math.cos(a) * wr * 0.5, -wr * 0.6 + Math.sin(a) * wr * 0.5); ctx.stroke(); } });
  // chamak-patti: strips of reflective tape along the rails that flash as the sun catches them
  for (let k = 0; k < 16; k++) { const px = bx0 + 2 + k * (s * 0.95) / 16, py = k % 2 ? btop - 1.5 : bbot - 1, fl = Math.pow(Math.max(0, Math.sin((x + px) * 0.06 + k * 1.7 + t * 1.5)), 14);
    ctx.fillStyle = fl > 0.25 ? `rgba(255,255,240,${(0.6 + 0.4 * fl).toFixed(3)})` : (k % 3 ? '#c8d0dc' : '#ff6a8a'); ctx.fillRect(px, py, 3, 1.4);
    if (fl > 0.5) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,255,230,${(0.5 * fl).toFixed(3)})`; ctx.beginPath(); ctx.arc(px + 1.5, py + 0.7, 3.5, 0, PI * 2); ctx.fill(); ctx.restore(); } }
  // a painted verse panel on the tailboard
  { const vx = bx0 + 3, vy = bbot - (bbot - btop) * 0.28, vw = s * 0.16, vh = (bbot - btop) * 0.18; ctx.fillStyle = '#13894a'; ctx.fillRect(vx, vy, vw, vh); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.6; ctx.beginPath(); for (let k = 0; k < 3; k++) { const lx = vx + vw - 3 - k * vw * 0.3; ctx.moveTo(lx, vy + vh * 0.6); ctx.quadraticCurveTo(lx - 2, vy + vh * 0.2, lx - 4, vy + vh * 0.55); ctx.quadraticCurveTo(lx - 5, vy + vh * 0.8, lx - 6.5, vy + vh * 0.5); } ctx.stroke(); }
  // a puff of dust from the back wheels
  if (moving) for (let k = 0; k < 4; k++) { const ph = ((t * 1.3 + k / 4) % 1); ctx.fillStyle = `rgba(220,190,150,${(0.35 * (1 - ph)).toFixed(3)})`; ctx.beginPath(); ctx.arc(bx0 - 4 - ph * 14, -2 - ph * 5, 2 + ph * 4, 0, PI * 2); ctx.fill(); }
  ctx.restore();
}

// ════════ PARAKEETS — a squabbling flock of rose-ringed parakeets darting across the old city, dipping and swerving ════════
function drawParakeets(ctx, W, H, t) {
  const m = t % SHOW, w = win(m, PARAKEETS); if (w < 0) return;
  for (let i = 0; i < 6; i++) { const u = w * 1.15 - i * 0.03; if (u < 0 || u > 1) continue; const x = lerp(-W * 0.06, W * 1.08, u) + Math.sin(u * 9 + i) * 8, y = H * (0.20 + 0.035 * Math.sin(i * 2.3)) + Math.sin(u * 14 + i * 1.7) * H * 0.02, f = Math.sin(t * 28 + i * 1.3), s = 3.6;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.cos(u * 14 + i * 1.7) * 0.2);
    ctx.fillStyle = '#3aa848'; ctx.beginPath(); ctx.ellipse(0, 0, s * 0.9, s * 0.35, 0, 0, PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.7, 0); ctx.lineTo(-s * 2.2, s * 0.15); ctx.lineTo(-s * 0.7, s * 0.25); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2a8a3a'; ctx.beginPath(); ctx.moveTo(-s * 0.2, -s * 0.1); ctx.quadraticCurveTo(0, -s * 1.3 * f, s * 0.4, -s * 0.1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8203a'; ctx.beginPath(); ctx.arc(s * 1.0, s * 0.05, s * 0.22, 0, PI * 2); ctx.fill(); ctx.fillStyle = '#3aa848'; ctx.beginPath(); ctx.arc(s * 0.75, -s * 0.05, s * 0.32, 0, PI * 2); ctx.fill(); ctx.restore(); }
}

// ════════ THE FOUNTAINS — little jets playing along the garden channel, sparkling in the sun ════════
function drawFountains(ctx, W, H, t) {
  const cy = H * (CHANNEL[0] + CHANNEL[1]) / 2;
  FOUNTAINS.forEach((f, i) => { const x = W * f, h = H * (0.028 + 0.004 * Math.sin(t * 2.3 + i)), sway = Math.sin(t * 1.7 + i) * 0.8;
    ctx.strokeStyle = 'rgba(235,248,255,0.85)'; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.moveTo(x, cy); ctx.quadraticCurveTo(x + sway, cy - h * 0.7, x + sway * 1.5, cy - h); ctx.stroke();
    for (let k = 0; k < 6; k++) { const ph = ((t * 1.6 + k / 6 + i * 0.13) % 1), side = k % 2 ? 1 : -1, dx = side * ph * 4, dy = -h + ph * ph * h * 0.95; ctx.fillStyle = `rgba(240,250,255,${(0.8 * (1 - ph)).toFixed(3)})`; ctx.beginPath(); ctx.arc(x + sway * 1.5 + dx, cy + dy, 0.8, 0, PI * 2); ctx.fill(); }
    const sp = Math.pow(Math.max(0, Math.sin(t * 3.1 + i * 2)), 10); if (sp > 0.1) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,250,220,${(0.9 * sp).toFixed(3)})`; ctx.beginPath(); ctx.arc(x + sway * 1.5, cy - h, 1.6, 0, PI * 2); ctx.fill(); ctx.restore(); }
    ctx.strokeStyle = `rgba(255,255,255,${(0.35 + 0.2 * Math.sin(t * 3 + i)).toFixed(3)})`; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.ellipse(x, cy + 0.5, 3 + Math.sin(t * 3 + i) * 0.8, 1, 0, 0, PI * 2); ctx.stroke(); });
}

// ════════ PIGEONS — a flock perched along the mosque parapet; once a loop they burst up, wheel round the domes, and settle ════════
function drawPigeons(ctx, W, H, t) {
  const m = t % SHOW, w = win(m, FLOCK), N = 16;
  for (let i = 0; i < N; i++) { const f0 = 0.62 + 0.36 * ((i * 0.618) % 1), hx = W * MX(f0), hy = H * 0.395 - (Math.abs(f0 - 0.775) < 0.095 ? H * 0.09 : 0);
    let x = hx, y = hy, fly = false, f = 0;
    if (w >= 0) { const u = Math.min(1, Math.max(0, (w - i * 0.008) / 0.95)), e = ease(Math.min(1, u * 4)) * ease(Math.min(1, (1 - u) * 4)), a = u * PI * 2.2 + i * 0.4, cx = W * MX(0.775), cy = H * 0.22;
      x = lerp(hx, cx + Math.cos(a) * W * (0.12 + 0.02 * (i % 4)), e); y = lerp(hy, cy + Math.sin(a) * H * (0.07 + 0.01 * (i % 3)), e); fly = e > 0.05; f = Math.sin(t * 22 + i); }
    ctx.fillStyle = '#5a5a68';
    if (fly) { const s = 3.2; ctx.strokeStyle = '#4a4a58'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - s, y - s * 0.5 * f); ctx.quadraticCurveTo(x - s * 0.4, y - s * 0.3 * f - 1, x, y); ctx.quadraticCurveTo(x + s * 0.4, y - s * 0.3 * f - 1, x + s, y - s * 0.5 * f); ctx.stroke(); ctx.beginPath(); ctx.ellipse(x, y + 0.4, 1.3, 0.9, 0, 0, PI * 2); ctx.fill(); }
    else { const bob = Math.sin(t * 3 + i * 1.7) > 0.8 ? 0.6 : 0; ctx.beginPath(); ctx.ellipse(x, y - 1.5, 1.6, 1.1, 0, 0, PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(x + (i % 2 ? 1.3 : -1.3), y - 2.6 + bob, 0.8, 0, PI * 2); ctx.fill(); } }
}

// ════════ PAINT — sky → clouds → kites → mosque & city → pigeons → road → truck → lawn → flag → trophy → light ════════
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const SCRATCH = document.createElement('canvas').getContext('2d');
const skyL = document.createElement('canvas'); skyL.width = 620; skyL.height = 355;
const back = document.createElement('canvas'); back.width = 620; back.height = 355;
const front = document.createElement('canvas'); front.width = 620; front.height = 355;
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TURN_SECONDS = 11.0;
function paintBase() {
  const k = skyL.getContext('2d'); k.clearRect(0, 0, 620, 355); draw(k, 620, 355, 'sky');
  const b = back.getContext('2d'); b.clearRect(0, 0, 620, 355); draw(b, 620, 355, 'back');
  const f = front.getContext('2d'); f.clearRect(0, 0, 620, 355); draw(f, 620, 355, 'front');
}
function frame(ms) {
  const t = reduceMotion ? 0 : Math.max(0, ms) / 1000;   // the game's clock can start a hair below zero
  const phi = (t / TURN_SECONDS) * Math.PI * 2;
  ctx.clearRect(0, 0, 620, 355);
  ctx.drawImage(skyL, 0, 0);
  drawClouds(ctx, 620, 355, t);
  drawKites(ctx, 620, 355, t);
  ctx.drawImage(back, 0, 0);
  const dusk = duskAmount(t);
  drawDuskLights(ctx, 620, 355, dusk);
  drawBunting(ctx, 620, 355, t);
  drawDhaba(ctx, 620, 355, t, dusk);
  drawPigeons(ctx, 620, 355, t);
  drawParakeets(ctx, 620, 355, t);
  drawTruck(ctx, 620, 355, t);
  drawTanga(ctx, 620, 355, t);
  ctx.drawImage(front, 0, 0);
  drawFountains(ctx, 620, 355, t);
  drawFlag(ctx, 620, 355, t);
  drawTrophy(ctx, 620, 355, phi, t);
  drawDuskTint(ctx, 620, 355, dusk);
  drawAtmos(ctx, 620, 355);
}
function loop(ms) { frame(ms); if (!reduceMotion) requestAnimationFrame(loop); }
paintBase(); frame(0);
if (!reduceMotion) requestAnimationFrame(loop);
let repainted = false;
const repaint = () => { if (!repainted) { repainted = true; paintBase(); if (reduceMotion) frame(0); } };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(repaint).catch(() => {});
setTimeout(repaint, 2000);
</script>
