<title>Jungle Cup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@500;600&display=swap');
/* Layout: same league card shell as the other cards — a lost jungle valley, above a stats grid */
:root {
  color-scheme: dark;
  --page: #060a06;
  --card: #0c140c;
  --ink: #ffffff;
  --muted: rgba(255,255,255,0.36);
  --tier: #ff8ad8;
  --gold: #f0c030;
  --eng: #b0ff80;
  --silver: #b8c8d8;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--page);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 32px 16px;
}
.card {
  width: min(540px, 100%);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 20px 60px rgba(0,0,0,0.70),
    0 60px 120px rgba(0,0,0,0.40);
}
.art { position: relative; line-height: 0; }
canvas { display: block; width: 100%; height: auto; background: #2a4a2a; }
.ovl {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 70px 18px 16px;
  background: linear-gradient(to bottom,
    rgba(12,20,12,0)    0%,
    rgba(12,20,12,0.52) 30%,
    rgba(12,20,12,0.92) 62%,
    rgba(12,20,12,1)   100%);
  pointer-events: none;
}
.pip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--display);
  font-weight: 700; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--tier); margin-bottom: 8px;
}
.pip::before {
  content: ''; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--tier); box-shadow: 0 0 8px var(--tier);
}
.nm {
  font-family: var(--display); font-weight: 900;
  font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
  color: var(--ink); text-shadow: 0 2px 24px rgba(0,0,0,1); margin-bottom: 5px;
}
.sub {
  font-family: var(--display); font-weight: 600;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
}
.info {
  padding: 13px 16px 17px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px; padding: 9px 13px;
}
.lbl { display:block; font-family:var(--display); font-weight:700; font-size:9px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.26); margin-bottom:4px; }
.val { font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:0.02em; line-height:1; font-variant-numeric: tabular-nums; }
.cw { color:rgba(255,255,255,0.82); }
.cy { color:var(--gold); }
.ce { color:var(--eng); }
.cs { color:var(--silver); }
</style>

<div class="card">
  <div class="art">
    <canvas id="c" width="620" height="355" aria-label="Morning in a lost jungle valley: flat-topped mountains in the haze with thin waterfalls, a ruined pyramid in the trees, a big waterfall thundering off a mossy cliff into a river, a giant buttressed tree and a toppled carved stone; a long-necked dinosaur calls in the distance and macaws burst across the valley, the sun breaks through in shafts of gold, and a pterosaur glides overhead; at the centre the Sun Temple trophy, a turning Aztec pyramid of stone, turquoise and gold crowned by a golden cricket ball in a sun disc"></canvas>
    <div class="ovl">
      <div class="pip">Tier 5 · Deep Fantasy</div>
      <div class="nm">Jungle Cup</div>
      <div class="sub">Lost World Cricket · The Sun Temple</div>
    </div>
  </div>
  <div class="info">
    <div class="stat"><span class="lbl">Entry Cost</span><span class="val cw">7,000 coins</span></div>
    <div class="stat"><span class="lbl">Win Reward</span><span class="val cy">+8,400</span></div>
    <div class="stat"><span class="lbl">Unlock</span><span class="val ce">440 Trophies</span></div>
    <div class="stat"><span class="lbl">Prize</span><span class="val cs">Platinum Chest</span></div>
  </div>
</div>


<script>
const PI = Math.PI, TAU = PI * 2;
const SHOW = 26.0;                                 // length of the shared schedule, seconds
// the story: morning in a lost valley — flat-topped mountains in the haze, a waterfall thundering off the cliff, a ruined pyramid in the trees
// → far off, a long-necked dinosaur lifts its head and calls; the macaws burst out of the canopy and stream across the valley (headline 1)
// → the sun breaks through, shafts of gold sweep the valley and the Sun Temple blazes (headline 2)
// → a pterosaur glides across the sky (headline 3), and spider monkeys swing across the canopy
const CALL = [4.2, 6.4], FLOCK = [5.4, 11.0], SUNBREAK = [12.0, 16.2], PTERO = [16.6, 21.4];
const RAIN = [0.2, 3.6], RAINBOW = [2.4, 9.5], KINGF = [8.4, 10.4], MONKEYS = [20.4, 25.4], REVEAL = [12.4, 22.8];   // a shower then a rainbow; a kingfisher dive; monkeys crossing the canopy; the lost city revealed as the mist burns off
const TURN_SECONDS = 20;
const HZ = 182;                                    // the valley floor's far edge
const FALL = { x0: 92, x1: 128, top: 74, pool: 226 };   // the big waterfall
const TEPUI_FALLS = [];   // thin falls off the mesas: x, top, bottom, width

function leaf(ctx, x, y, ang, len, wid, c0, c1, rib) {   // a broad tropical leaf
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); const g = ctx.createLinearGradient(0, -wid, 0, wid); g.addColorStop(0, c1); g.addColorStop(0.5, c0); g.addColorStop(1, c1); ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(len * 0.25, -wid, len * 0.75, -wid * 0.9, len, 0); ctx.bezierCurveTo(len * 0.75, wid * 0.9, len * 0.25, wid, 0, 0); ctx.fill();
  if (rib) { ctx.strokeStyle = rib; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * 0.96, 0); for (let i = 1; i < 7; i++) { const u = i / 7; ctx.moveTo(len * u, 0); ctx.lineTo(len * (u + 0.08), -wid * 0.7 * Math.sin(u * PI)); ctx.moveTo(len * u, 0); ctx.lineTo(len * (u + 0.08), wid * 0.7 * Math.sin(u * PI)); } ctx.stroke(); }
  ctx.restore();
}
function frondJ(ctx, x, y, ang, len, col) {   // a palm/fern frond: arching rib with tapering leaflets
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * 0.5, -len * 0.18, len, len * 0.06); ctx.stroke();
  for (let i = 1; i < 16; i++) { const u = i / 16, px = len * u, py = -len * 0.18 * 4 * u * (1 - u) * 0.5 + len * 0.06 * u * u, s = (1 - u * 0.8) * len * 0.2 + 2;
    [-1, 1].forEach(sd => { ctx.beginPath(); ctx.moveTo(px, py); ctx.quadraticCurveTo(px + s * 0.5, py + sd * s * 0.5, px + s * 0.75, py + sd * s * 0.95); ctx.quadraticCurveTo(px + s * 0.2, py + sd * s * 0.4, px, py); ctx.fill(); }); }
  ctx.restore();
}
function blob(ctx, x, y, r, seed, k = 7) {   // an organic lumpy crown
  ctx.beginPath(); for (let i = 0; i <= 40; i++) { const a = i / 40 * TAU, rr = r * (1 + 0.12 * Math.sin(a * k + seed) + 0.07 * Math.sin(a * (k + 4) + seed * 2)); ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.82); } ctx.closePath();
}
function foliage(ctx, cx, cy, rx, ry, seed, n, dark, light) {   // a mass of foliage built leaf by leaf, back to front, darker at the back
  const r = mkRnd(seed), pc = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)], A = pc(dark), B = pc(light);
  for (let i = 0; i < n; i++) { const u = i / n, a = r() * TAU, d = Math.sqrt(r()), x = cx + Math.cos(a) * rx * d, y = cy + Math.sin(a) * ry * d - u * ry * 0.3, k = Math.min(1, u * 0.9 + (cy - y) / ry * 0.25 + 0.1);
    const col = `rgb(${A.map((v, j) => Math.round(v + (B[j] - v) * k)).join(',')})`, sh = `rgb(${A.map(v => Math.round(v * 0.7)).join(',')})`;
    leaf(ctx, x, y, (r() < 0.5 ? PI * 0.15 : PI * 0.85) + (r() - 0.5) * 1.2, 12 + r() * 14, 4 + r() * 4, col, sh, k > 0.6 ? 'rgba(20,50,10,0.35)' : null); }
}
function tepui(ctx, pts, top, base, col, edge, rnd) {   // a flat-topped mountain: a ragged plateau over sheer, streaked cliffs
  const [x0, x1] = pts, fg = ctx.createLinearGradient(x0, 0, x1, 0); fg.addColorStop(0, edge); fg.addColorStop(0.25, col); fg.addColorStop(1, edge); ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(x0 - 14, base);
  const steps = 14; for (let i = 0; i <= steps; i++) { const u = i / steps, x = x0 + (x1 - x0) * u, y = top + (rnd() - 0.5) * 4 + (i === 0 || i === steps ? 8 : 0); ctx.lineTo(x, y); }
  ctx.lineTo(x1 + 16, base); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip(); ctx.strokeStyle = edge; for (let i = 0; i < 22; i++) { const x = x0 + rnd() * (x1 - x0); ctx.globalAlpha = 0.15 + rnd() * 0.25; ctx.lineWidth = 0.6 + rnd() * 1.4; ctx.beginPath(); ctx.moveTo(x, top + 4 + rnd() * 6); ctx.lineTo(x + (rnd() - 0.5) * 3, top + 20 + rnd() * (base - top - 20)); ctx.stroke(); }
  ctx.globalAlpha = 1; const g = ctx.createLinearGradient(0, top, 0, base); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(200,220,190,0.45)'); ctx.fillStyle = g; ctx.fillRect(x0 - 20, top, x1 - x0 + 40, base - top); ctx.restore();
  ctx.fillStyle = 'rgba(255,236,170,0.35)'; ctx.fillRect(x0, top - 1, x1 - x0, 2);   // the sunlit rim
  for (let i = 0; i < 14; i++) { const x = x0 + (i + 0.5) * (x1 - x0) / 14; ctx.fillStyle = i % 2 ? 'rgba(80,124,80,0.75)' : 'rgba(96,140,84,0.75)'; ctx.beginPath(); ctx.ellipse(x, top - 1, (x1 - x0) / 20, 3.4, 0, PI, 0); ctx.fill(); }   // forest on the plateau
}

function palm(ctx, x0, y0, x1, y1, bend, scale, dark, light) {   // a tall palm: a ringed, gently curving trunk and a crown of arching fronds
  const tg = ctx.createLinearGradient(x0 - 4, 0, x0 + 4, 0); tg.addColorStop(0, '#3a3020'); tg.addColorStop(0.4, '#8a7650'); tg.addColorStop(1, '#3a3020');
  const N = 26; for (let i = 0; i < N; i++) { const u = i / N, v = (i + 1) / N, P = (w) => [lerp(x0, x1, w) + Math.sin(w * PI) * bend, lerp(y0, y1, w)], [ax, ay] = P(u), [bx, by] = P(v), wd = (4.2 - u * 1.6) * scale;
    ctx.strokeStyle = tg; ctx.lineWidth = wd; ctx.lineCap = 'butt'; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = 'rgba(30,24,14,0.5)'; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(bx - wd / 2, by); ctx.lineTo(bx + wd / 2, by); ctx.stroke(); }   // the trunk's rings
  ctx.fillStyle = '#5a4a2a'; ctx.beginPath(); ctx.arc(x1, y1 + 2, 3 * scale, 0, TAU); ctx.fill();
  [[-2.7, 1], [-2.2, 1.1], [-1.6, 0.9], [-0.9, 1], [-0.4, 1.05], [-3.2, 0.8], [0.2, 0.85], [-1.25, 0.7]].forEach(([a, l], i) => frondJ(ctx, x1, y1, a, 34 * l * scale, i % 2 ? dark : light));
  ctx.fillStyle = '#6a5a30'; [[-3, 4], [2, 5], [0, 6]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(x1 + dx * scale, y1 + dy * scale, 1.8 * scale, 0, TAU); ctx.fill(); });   // coconuts
}
function kapok(ctx, x, base, top, s, col, hi) {   // a giant emergent tree: tall bare trunk, spreading branches, a flat umbrella crown
  ctx.strokeStyle = col; ctx.lineWidth = 2.4 * s; ctx.beginPath(); ctx.moveTo(x, base); ctx.quadraticCurveTo(x - 2 * s, (base + top) / 2, x, top + 6 * s); ctx.stroke();
  ctx.lineWidth = 1.2 * s; ctx.beginPath(); ctx.moveTo(x, top + 8 * s); ctx.quadraticCurveTo(x - 10 * s, top + 4 * s, x - 18 * s, top + 2 * s); ctx.moveTo(x, top + 8 * s); ctx.quadraticCurveTo(x + 10 * s, top + 4 * s, x + 17 * s, top + 1 * s); ctx.stroke();
  [[-16, 0, 13], [0, -3, 15], [15, 0, 12], [-7, -6, 10], [8, -7, 10]].forEach(([dx, dy, r]) => { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x + dx * s, top + dy * s, r * s, r * s * 0.42, 0, 0, TAU); ctx.fill(); ctx.fillStyle = hi; ctx.beginPath(); ctx.ellipse(x + dx * s - 2 * s, top + dy * s - 2 * s, r * s * 0.7, r * s * 0.22, 0, 0, TAU); ctx.fill(); });
}
function drawSky(ctx, W, H) {
  const g = ctx.createLinearGradient(0, 0, 0, HZ); g.addColorStop(0, '#2a6a80'); g.addColorStop(0.45, '#8ec0a8'); g.addColorStop(0.8, '#f2dc9a'); g.addColorStop(1, '#ffeab0'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const sun = ctx.createRadialGradient(470, 70, 0, 470, 70, 240); sun.addColorStop(0, 'rgba(255,250,220,0.7)'); sun.addColorStop(0.1, 'rgba(255,238,180,0.45)'); sun.addColorStop(0.5, 'rgba(255,214,130,0.14)'); sun.addColorStop(1, 'rgba(255,200,120,0)'); ctx.fillStyle = sun; ctx.fillRect(0, 0, W, H);
  return;   // (the clouds are drawn live, drifting)
  const r = mkRnd(4141);
  [[60, 40, 120, 18], [200, 62, 90, 12], [300, 30, 110, 14], [520, 48, 130, 18], [460, 120, 90, 9], [120, 112, 80, 8]].forEach(([x, y, w, h]) => { for (let i = 0; i < 7; i++) { const cx = x + (r() - 0.5) * w, cy = y + (r() - 0.5) * h * 0.6, rx = w * (0.25 + r() * 0.2), ry = h * (0.5 + r() * 0.4);
    const cg = ctx.createRadialGradient(cx, cy - ry * 0.3, 0, cx, cy, rx); cg.addColorStop(0, 'rgba(255,252,236,0.55)'); cg.addColorStop(0.6, 'rgba(255,230,180,0.3)'); cg.addColorStop(1, 'rgba(255,220,170,0)'); ctx.fillStyle = cg; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.fill(); } });
}
function drawBack(ctx, W, H) {
  const r = mkRnd(5252);
  // far mesas, hazy blue-green; nearer ones greener
  tepui(ctx, [-30, 120], 120, HZ, '#b4c4a0', '#6a8676', r);
  tepui(ctx, [150, 300], 108, HZ, '#b8c49a', '#5e7c6a', r);
  tepui(ctx, [400, 530], 100, HZ, '#bcc69a', '#587a66', r);
  tepui(ctx, [548, 660], 124, HZ, '#a4b68c', '#4e705c', r);
  const mist = ctx.createLinearGradient(0, 140, 0, HZ + 6); mist.addColorStop(0, 'rgba(240,236,210,0)'); mist.addColorStop(1, 'rgba(240,236,214,0.6)'); ctx.fillStyle = mist; ctx.fillRect(0, 130, W, HZ - 124);
  // the lost city: a ruined stepped pyramid rising out of the trees, far off on the right
  ctx.fillStyle = 'rgba(96,120,106,0.9)'; [[0, 46], [9, 38], [17, 31], [24, 24], [30, 17]].forEach(([dy, hw]) => ctx.fillRect(522 - hw, HZ - 6 - dy - 9, hw * 2, 9)); ctx.fillRect(514, HZ - 54, 16, 9);
  ctx.fillStyle = 'rgba(70,96,84,0.9)'; ctx.fillRect(519, HZ - 50, 6, 44);   // its stairway
  ctx.fillStyle = 'rgba(230,226,200,0.35)'; ctx.fillRect(476, HZ - 40, 92, 34);   // haze over it
  // far canopy: a band of hazy treetops, with tall emergent trees
  ctx.fillStyle = '#6e9a7a'; for (let x = -10; x < W + 10; x += 12) { blob(ctx, x, HZ + 4 + Math.sin(x * 0.07) * 3, 13 + r() * 6, x); ctx.fill(); }
  [[236, 140, 20], [66, 146, 18], [176, 150, 14]].forEach(([x, y, s], i) => { ctx.strokeStyle = '#6a8a76'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, HZ + 4); ctx.quadraticCurveTo(x - 3, (y + HZ) / 2, x + 1, y + 4); ctx.stroke(); foliage(ctx, x, y, s * 1.1, s * 0.55, 40 + i, 34, '#6a947a', '#b4d0a0'); });   // emergent trees in the haze
  const m2 = ctx.createLinearGradient(0, HZ - 14, 0, HZ + 18); m2.addColorStop(0, 'rgba(236,232,206,0)'); m2.addColorStop(0.5, 'rgba(236,232,206,0.55)'); m2.addColorStop(1, 'rgba(236,232,206,0.2)'); ctx.fillStyle = m2; ctx.fillRect(0, HZ - 14, W, 32);
  // mid canopy: a richer green layer of crowns stepping down into the valley
  for (let x = 150; x < W + 20; x += 15) { const y = HZ + 22 + Math.sin(x * 0.05) * 5 + r() * 6; ctx.fillStyle = r() < 0.5 ? '#4a7c4a' : '#548a50'; blob(ctx, x, y, 16 + r() * 8, x); ctx.fill(); ctx.fillStyle = 'rgba(255,236,160,0.22)'; blob(ctx, x - 4, y - 6, 9 + r() * 4, x + 1); ctx.fill(); }
  kapok(ctx, 214, HZ + 24, 128, 1.15, '#5e8a64', 'rgba(255,240,190,0.3)'); kapok(ctx, 250, HZ + 26, 146, 0.9, '#6a9470', 'rgba(255,240,190,0.28)');   // giant kapok trees towering out of the valley
  const m3 = ctx.createLinearGradient(0, HZ + 6, 0, HZ + 50); m3.addColorStop(0, 'rgba(230,236,206,0.4)'); m3.addColorStop(1, 'rgba(230,236,206,0)'); ctx.fillStyle = m3; ctx.fillRect(0, HZ + 6, W, 44);
}
function drawMid(ctx, W, H) {
  const r = mkRnd(6363);
  // the valley floor: a mossy clearing, lit warm in the middle
  const gg = ctx.createLinearGradient(0, HZ + 30, 0, H); gg.addColorStop(0, '#5a8a3a'); gg.addColorStop(0.4, '#3c6a28'); gg.addColorStop(1, '#1e3e14'); ctx.fillStyle = gg; ctx.beginPath(); ctx.moveTo(0, HZ + 44); ctx.bezierCurveTo(200, HZ + 34, 420, HZ + 36, W, HZ + 46); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  const pool = ctx.createRadialGradient(310, 262, 0, 310, 262, 200); pool.addColorStop(0, 'rgba(255,230,140,0.35)'); pool.addColorStop(1, 'rgba(255,230,140,0)'); ctx.fillStyle = pool; ctx.fillRect(0, HZ, W, H - HZ);
  for (let i = 0; i < 260; i++) { const x = r() * W, y = HZ + 40 + r() * (H - HZ - 40); ctx.fillStyle = r() < 0.5 ? 'rgba(120,170,60,0.35)' : 'rgba(20,50,10,0.3)'; ctx.fillRect(x, y, 1.5, 1.5 + r() * 2); }   // grass texture
  // old paving round the trophy: worn carved slabs half-sunk in moss
  for (let row = 0; row < 6; row++) { const y = 286 + row * 13, hw = 46 + row * 12, n = 3 + Math.floor(row / 2); for (let k = 0; k < n; k++) { const x0 = 310 - hw + k * (hw * 2 / n) + 2, w = hw * 2 / n - 4, hh = 9 + row * 1.5;   // a causeway of worn slabs leading up to the plinth
    ctx.fillStyle = 'rgba(20,30,10,0.5)'; ctx.fillRect(x0 + 1, y + 1, w, hh); const sg = ctx.createLinearGradient(0, y, 0, y + hh); sg.addColorStop(0, '#a8a284'); sg.addColorStop(1, '#6a6650'); ctx.fillStyle = sg; ctx.fillRect(x0, y, w, hh);
    if (r() < 0.5) { ctx.fillStyle = 'rgba(80,140,50,0.75)'; ctx.beginPath(); ctx.ellipse(x0 + r() * w, y + hh, 6 + r() * 8, 2.4, 0, 0, TAU); ctx.fill(); } } }
  // ── the left cliff and its waterfall: a sheer face of big fractured rock facets, lit from the right (the sun's side), darker and wet round the fall ──
  const cliff = [[-10, 40], [30, 50], [62, 58], [86, 68], [96, 64], [132, 66], [146, 74], [160, 96], [172, 132], [178, 172], [172, 210], [154, 232], [-10, 236]];
  ctx.fillStyle = '#2e2c22'; poly(ctx, cliff); ctx.fill();
  ctx.save(); poly(ctx, cliff); ctx.clip();
  // big irregular slabs of rock, stacked: each a ragged polygon, lit along its upper edges, casting a dark lip of shadow onto the slab below
  const slabs = []; for (let i = 0; i < 80; i++) slabs.push([-14 + r() * 196, 46 + r() * 196, 12 + r() * 16]);
  slabs.sort((p, q) => p[1] - q[1]).forEach(([x, y, R]) => { const n = 6 + Math.floor(r() * 3), pts = [];
    for (let k = 0; k < n; k++) { const an = k / n * TAU + (r() - 0.5) * 0.6, rr = R * (0.65 + r() * 0.45); pts.push([x + Math.cos(an) * rr * 1.25, y + Math.sin(an) * rr * 0.8]); }
    const lit = 0.55 + 0.45 * Math.min(1, Math.max(0, x / 175)), v = 0.8 + r() * 0.4;
    ctx.fillStyle = 'rgba(14,14,8,0.6)'; ctx.save(); ctx.translate(1.5, 3); poly(ctx, pts); ctx.fill(); ctx.restore();   // its shadow

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(c, W, H, part) { if (part === 'sky') drawSky(c, W, H); else if (part === 'back') drawBack(c, W, H); else if (part === 'mid') drawMid(c, W, H); else drawFront(c, W, H); }
function paintBase() {
  const k = skyL.getContext('2d'); k.clearRect(0, 0, 620, 355); draw(k, 620, 355, 'sky'); draw(k, 620, 355, 'back');   // sky and the far valley flattened together
  const b = back.getContext('2d'); b.clearRect(0, 0, 620, 355); draw(b, 620, 355, 'back');   // (kept on its own too, to put treetops back in front of the dinosaur)
  const md = mid.getContext('2d'); md.clearRect(0, 0, 620, 355); draw(md, 620, 355, 'mid');
  const f = front.getContext('2d'); f.clearRect(0, 0, 620, 355); draw(f, 620, 355, 'front');
}
function frame(ms) {
  const t = reduceMotion ? 0 : Math.max(0, ms) / 1000;   // the game's clock can start a hair below zero
  ctx.clearRect(0, 0, 620, 355);
  ctx.drawImage(skyL, 0, 0);
  drawClouds(ctx, 620, 355, t);
  drawCity(ctx, 620, 355, t);
  drawPtero(ctx, 620, 355, t);
  drawSauropod(ctx, 620, 355, t);
  drawMist(ctx, 620, 355, t);
  drawRays(ctx, 620, 355, t);
  ctx.drawImage(mid, 0, 0);
  drawFalls(ctx, 620, 355, t);
  drawFallExtras(ctx, 620, 355, t);
  drawRiver(ctx, 620, 355, t);
  drawPool(ctx, 620, 355, t);
  drawFish(ctx, 620, 355, t);
  drawDragonflies(ctx, 620, 355, t);
  drawKingfisher(ctx, 620, 355, t);
  drawFlock(ctx, 620, 355, t);
  drawDapple(ctx, 620, 355, t);
  drawButterflies(ctx, 620, 355, t);
  drawHummingbird(ctx, 620, 355, t);
  drawToucan(ctx, 620, 355, t);
  drawFrog(ctx, 620, 355, t);
  drawBall(ctx, 620, 355, t);
  drawTrophy(ctx, 620, 355, t);
  drawBraziers(ctx, 620, 355, t);
  ctx.drawImage(front, 0, 0);
  drawVines(ctx, 620, 355, t);
  drawMonkeys(ctx, 620, 355, t);
  drawNear(ctx, 620, 355, t);
  drawFireflies(ctx, 620, 355, t);
  drawAtmos(ctx, 620, 355, t);
}
function loop(ms) { frame(ms); if (!reduceMotion) requestAnimationFrame(loop); }
paintBase(); frame(0);
if (!reduceMotion) requestAnimationFrame(loop);
let repainted = false;
const repaint = () => { if (!repainted) { repainted = true; paintBase(); if (reduceMotion) frame(0); } };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(repaint).catch(() => {});
setTimeout(repaint, 2000);
</script>
