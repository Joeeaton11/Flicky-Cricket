<title>Old Trafford 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: full-bleed WebGL stadium; chunky game-style control dock along the bottom, title tag top-left, name tags floating over buildings. Deliberately one look (bright day sky). */
:root{
  --ink:#2a0d10; --red:#d8232f; --red-dark:#8e1019; --cream:#fff6e8; --gold:#ffcf3a; --panel:rgba(42,13,16,.8);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:#1b0a0c;color:var(--cream);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1b0a0c}
#stage canvas{display:block;touch-action:none}
#stage.phone canvas{border-radius:28px;box-shadow:0 0 0 6px #3a1418,0 20px 60px rgba(0,0,0,.6)}
.tag{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  font-family:var(--display);font-size:clamp(20px,4vw,30px);letter-spacing:.02em;color:var(--cream);
  text-shadow:0 3px 0 var(--red-dark),0 5px 10px rgba(0,0,0,.35);pointer-events:none;line-height:1}
.tag small{display:block;font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-shadow:0 2px 0 var(--red-dark);margin-top:6px}
.dock{position:fixed;left:0;right:0;bottom:0;padding-block:0 calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
.panel{pointer-events:auto;display:flex;flex-direction:column;gap:8px;max-width:min(760px,100%);background:linear-gradient(#4a1418,#2a0b0e);border:3px solid #120405;
  border-radius:18px;padding:10px 12px 12px;box-shadow:0 0 0 2px #b0141f inset,0 10px 30px rgba(0,0,0,.45)}
.panel[data-min="1"] .grp{display:none}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.now{font-family:var(--display);font-size:17px;color:var(--gold);text-shadow:0 2px 0 #000;line-height:1.1;min-width:0}
.now small{display:block;font-family:var(--body);font-weight:800;font-size:11px;color:var(--cream);opacity:.85;text-shadow:none;letter-spacing:.02em}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cap{font-weight:800;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#f0b9b9;width:44px;flex:none}
.seg{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1}
button{font-family:var(--display);font-size:14px;letter-spacing:.03em;color:var(--cream);background:linear-gradient(#e9333f,#b0141f);
  border:2px solid #5e0a10;border-radius:11px;padding:6px 11px;box-shadow:0 3px 0 #5e0a10;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #5e0a10}
button.on{background:linear-gradient(#ffe066,#f2b51a);color:var(--ink);text-shadow:none;border-color:#8a5a00;box-shadow:0 3px 0 #8a5a00}
button.ghost{background:transparent;border-color:#7a2a30;box-shadow:none;font-size:13px;padding:4px 10px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
kbd{font-family:var(--body);font-size:10px;opacity:.6;margin-left:4px}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.nm{position:absolute;transform:translate(-50%,calc(-100% - 8px));white-space:nowrap;font-weight:800;font-size:12px;color:var(--ink);background:#fff6e8;
  border:2px solid var(--red-dark);border-radius:9px;padding:2px 8px;box-shadow:0 2px 0 var(--red-dark)}
.nm::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--red-dark)}
.nm.end{background:var(--gold)}
#err{position:fixed;inset:auto 16px 50% 16px;text-align:center;font-weight:800;background:var(--panel);padding:14px;border-radius:12px}
</style>

<div id="stage"></div>
<div id="labels"></div>
<div class="tag">Old Trafford<small>Real layout · toy style</small></div>
<div class="hint">Drag to spin · pinch or scroll to zoom</div>
<div id="err" hidden>The 3D view could not start in this browser.</div>
<div class="dock"><div class="panel" id="panel">
  <div class="top"><div class="now" id="now">Game view<small>The phone camera the game uses</small></div><button class="ghost" id="t-min" aria-expanded="true">Hide</button></div>
  <div class="grp"><span class="cap">View</span><div class="seg" role="group" aria-label="View">
    <button id="c-game" class="on">Game<kbd>1</kbd></button><button id="c-bat">Batter<kbd>2</kbd></button><button id="c-bowl">Bowler<kbd>3</kbd></button>
    <button id="c-pitch">Boundary<kbd>4</kbd></button><button id="c-pav">Pavilion<kbd>5</kbd></button><button id="c-orbit">Fly round<kbd>6</kbd></button><button id="c-blimp">Blimp<kbd>7</kbd></button></div></div>
  <div class="grp"><span class="cap">Light</span><div class="seg" role="group" aria-label="Light">
    <button id="l-day" class="on">Day</button><button id="l-gold">Golden hour</button><button id="l-night">Floodlit night</button></div></div>
  <div class="grp"><span class="cap">Show</span><div class="seg" role="group" aria-label="Show">
    <button id="t-labels" class="on">Names</button><button id="t-wave">Mexican wave</button><button id="t-phone">Phone frame</button></div></div>
</div></div>

<script>
(function(){
if(!window.THREE){document.getElementById('err').hidden=false;return;}
const T=THREE, TAU=Math.PI*2;
let seed=11; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647); const pick=a=>a[Math.floor(rnd()*a.length)];

/* ================= LAYOUT (metres; north = -z, east = +x) =================
   Pitch runs north–south (turned in 2010/11).
   North, James Anderson End: The Point (NW) · Victorian Pavilion with two clock towers + two glass storeys (N) · Hilton Garden Inn (NE).
   South, Brian Statham End: Players & Media Centre (raised glass pod).
   East: big two-tier open stand; behind it Warwick Road and the Metrolink line, Old Trafford tram stop at the south-east corner.
   West: two-tier open stand with dark seats; car park + indoor cricket school beyond (NW).
   Beyond: Manchester city centre to the north-east, the football stadium to the north-west. */
const RX=68, RZ=74;                       // playing area radii (E–W, N–S), boundary ≈ 65–72 m
const pt=(t,d,y=0)=>new T.Vector3((RX+d)*Math.cos(t),y,(RZ+d)*Math.sin(t));
const N=-Math.PI/2, S=Math.PI/2, E=0, W=Math.PI;

// ---------------- renderer ----------------
const stage=document.getElementById('stage');
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputEncoding=T.sRGBEncoding; renderer.toneMapping=T.NoToneMapping;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap; stage.appendChild(renderer.domElement);
const scene=new T.Scene(); const camera=new T.PerspectiveCamera(40,1,1,4000);
const controls=new T.OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.maxPolarAngle=Math.PI*.49; controls.minDistance=20; controls.maxDistance=1400;

// ---------------- textures ----------------
function cvs(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=8;return t;}
const skyTex=(a,b,c)=>cvs(4,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,a);gr.addColorStop(.55,b);gr.addColorStop(1,c);g.fillStyle=gr;g.fillRect(0,0,w,h);});
const SKY_DAY=skyTex('#2f8fff','#8fd0ff','#e4f4ff'), SKY_NIGHT=skyTex('#050a24','#14204e','#3a2a5a');
const grassTex=cvs(1024,1024,(g,w,h)=>{for(let i=0;i<20;i++)for(let j=0;j<20;j++){g.fillStyle=(i+j)%2?'#56b532':((i%2)?'#4aa62b':'#3f9a24');g.fillRect(j*w/20,i*h/20,w/20,h/20);}for(let i=0;i<4000;i++){g.fillStyle=`rgba(20,${100+rnd()*90|0},20,.1)`;g.fillRect(rnd()*w,rnd()*h,2,2);}});
const squareTex=cvs(256,128,(g,w,h)=>{g.fillStyle='#4aa52b';g.fillRect(0,0,w,h);for(let i=0;i<9;i++){g.fillStyle=i==4?'#c49a5c':(i%2?'#5fae36':'#55a631');g.fillRect(i*w/9+2,0,w/9-4,h);}
  g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(w*4/9-8,14);g.lineTo(w*5/9+8,14);g.moveTo(w*4/9-8,h-14);g.lineTo(w*5/9+8,h-14);g.stroke();});
function paint(base,dark,light,w=256){const t=cvs(w,w,(g)=>{g.fillStyle=base;g.fillRect(0,0,w,w);for(let i=0;i<900;i++){g.fillStyle=rnd()<.5?dark:light;g.globalAlpha=.06+rnd()*.08;g.beginPath();g.ellipse(rnd()*w,rnd()*w,4+rnd()*18,2+rnd()*8,rnd()*3,0,7);g.fill();}g.globalAlpha=1;});t.wrapS=t.wrapT=T.RepeatWrapping;return t;}
const concreteTex=paint('#c4b8a6','#8f8472','#efe6d6'), redTex=paint('#e01f2c','#9a0f18','#ff6a6f');
const brickTex=cvs(256,256,(g,w,h)=>{g.fillStyle='#7e3322';g.fillRect(0,0,w,h);for(let r=0;r<16;r++)for(let c=0;c<10;c++){const o=r%2?14:0;g.fillStyle=`hsl(${8+rnd()*8},${55+rnd()*15}%,${36+rnd()*10}%)`;g.fillRect(c*28+o-14,r*16+1,25,13);}});
brickTex.wrapS=brickTex.wrapT=T.RepeatWrapping;
function stripTex(rows,frame,glass,band){return cvs(256,256,(g,w,h)=>{g.fillStyle=frame;g.fillRect(0,0,w,h);const rh=h/rows;for(let r=0;r<rows;r++){
  const gr=g.createLinearGradient(0,r*rh,w,r*rh+rh);gr.addColorStop(0,glass[0]);gr.addColorStop(1,glass[1]);g.fillStyle=gr;g.fillRect(4,r*rh+rh*.18,w-8,rh*.64);
  g.fillStyle='rgba(255,255,255,.55)';for(let c=0;c<16;c++)g.fillRect(c*w/16,r*rh+rh*.18,2,rh*.64);g.fillStyle=band;g.fillRect(0,r*rh,w,rh*.12);}});}
const hiltonTex=stripTex(6,'#eceef0',['#2a4c78','#8fc2ee'],'#c8ccd2'); hiltonTex.wrapS=T.RepeatWrapping;
const pointGlass=stripTex(2,'#c4121f',['#1e3c66','#9fd4ff'],'#a00d18');
const mediaGlass=stripTex(2,'#d8232f',['#20406c','#a6dcff'],'#c41a26');
const pavGlass=stripTex(2,'#f4f2ee',['#244a7a','#9fd0ff'],'#e0ddd6');
const officeTex=stripTex(8,'#cfd4da',['#33557f','#9fc8ee'],'#b5bcc4'); officeTex.wrapS=officeTex.wrapT=T.RepeatWrapping;
const houseTex=cvs(128,128,(g,w,h)=>{g.fillStyle='#a5523a';g.fillRect(0,0,w,h);for(let r=0;r<2;r++)for(let c=0;c<3;c++){g.fillStyle='#fff';g.fillRect(c*42+10,r*60+14,24,34);g.fillStyle='#3a4a66';g.fillRect(c*42+13,r*60+17,18,28);}});
function rose(g,cx,cy,s){g.fillStyle='#2e8b3a';g.fillRect(cx-s*.06,cy,s*.12,s*.9);[[0,0,.42,'#c4121f'],[-.15,-.05,.25,'#e3303c'],[.15,-.05,.25,'#e3303c'],[0,-.15,.2,'#ff5a64'],[0,0,.1,'#a00d18']].forEach(([x,y,r,c])=>{g.fillStyle=c;g.beginPath();g.arc(cx+x*s,cy+y*s,r*s,0,7);g.fill();});}
const roseFlag=cvs(256,160,(g,w,h)=>{g.fillStyle='#d8232f';g.fillRect(0,0,w,h);g.fillStyle='#fff';g.beginPath();g.arc(w/2,h/2,62,0,7);g.fill();rose(g,w/2,h*.45,70);});
const clockTex=cvs(256,256,(g)=>{g.fillStyle='#fffbef';g.beginPath();g.arc(128,128,120,0,7);g.fill();g.lineWidth=12;g.strokeStyle='#3a2a20';g.stroke();g.fillStyle='#3a2a20';
  for(let i=0;i<12;i++){const a=i/12*TAU;g.fillRect(128+Math.cos(a)*96-5,128+Math.sin(a)*96-5,10,10);}g.lineCap='round';g.lineWidth=12;g.beginPath();g.moveTo(128,128);g.lineTo(128,58);g.stroke();g.lineWidth=9;g.beginPath();g.moveTo(128,128);g.lineTo(178,150);g.stroke();});
const fasciaTex=cvs(512,64,(g,w,h)=>{g.fillStyle='#f7f3ea';g.fillRect(0,0,w,h);for(let i=0;i<4;i++){const x=i*128;g.fillStyle=i%2?'#d8232f':'#1f2a5e';g.fillRect(x+4,6,120,h-12);
  if(i%2==0){g.fillStyle='#fff';g.beginPath();g.arc(x+64,h/2,20,0,7);g.fill();rose(g,x+64,h/2-6,26);}else{g.fillStyle='#ffd21f';g.fillRect(x+16,h/2-4,96,8);}}});
fasciaTex.wrapS=T.RepeatWrapping;
const backTex=cvs(512,128,(g,w,h)=>{g.fillStyle='#e9e3d8';g.fillRect(0,0,w,h);for(let i=0;i<2;i++){const x=i*256;g.fillStyle='#d8232f';g.fillRect(x+10,14,236,h-28);
  g.fillStyle='#fff';g.beginPath();g.arc(x+60,h/2,34,0,7);g.fill();rose(g,x+60,h/2-10,44);g.fillStyle='#fff';for(let k=0;k<3;k++)g.fillRect(x+110,34+k*22,120-k*30,10);}});
backTex.wrapS=T.RepeatWrapping;
const screenTex=cvs(256,128,(g,w,h)=>{g.fillStyle='#10131a';g.fillRect(0,0,w,h);g.fillStyle='#d8232f';g.fillRect(8,8,w-16,30);g.fillStyle='#ffcf3a';for(let i=0;i<5;i++)g.fillRect(16+i*46,56,30,52);});

// ---------------- materials ----------------
const M=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.26,metalness:.02,envMapIntensity:.35},o));
const mat={fascia:M(0xffffff,{map:fasciaTex,roughness:.3}),back:M(0xffffff,{map:backTex,roughness:.4}),red:M(0xe8202e,{roughness:.18}),redDark:M(0x9a141f),brick:M(0xffffff,{map:brickTex,roughness:.7}),white:M(0xf7f5f0,{roughness:.32}),
  concrete:M(0xffffff,{map:concreteTex,roughness:.6}),grey:M(0x9aa1aa,{roughness:.45}),slate:M(0x4e5462),dark:M(0x23262e),grass:M(0xffffff,{map:grassTex,roughness:.95,envMapIntensity:.05}),
  turf:M(0x4aa834,{roughness:.8}),square:M(0xffffff,{map:squareTex,roughness:.95,envMapIntensity:.05}),board:M(0x2a2f6e,{roughness:.25}),
  seatGrey:M(0x8c939c,{roughness:.45}),seatDark:M(0x2b2f38,{roughness:.4}),seatRed:M(0xc81e2a,{roughness:.32}),
  copper:M(0x4fb08a,{roughness:.3}),gold:M(0xffc53a,{roughness:.2,metalness:.5}),road:M(0x4a4c52,{roughness:.8}),park:M(0x6b6e75,{roughness:.8}),
  tree:M(0x3fa83a,{roughness:.55}),tree2:M(0x2f8f35,{roughness:.55}),trunk:M(0x6b4423),yellow:M(0xffd21f,{roughness:.25}),rail:M(0x8a8f96,{metalness:.6,roughness:.3}),
  glassP:M(0xffffff,{map:pointGlass,roughness:.08}),glassM:M(0xffffff,{map:mediaGlass,roughness:.08}),glassPav:M(0xffffff,{map:pavGlass,roughness:.08}),
  hilton:M(0xffffff,{map:hiltonTex,roughness:.2}),office:M(0xffffff,{map:officeTex,roughness:.15,metalness:.2}),house:M(0xffffff,{map:houseTex,roughness:.6}),
  body:M(0xffffff,{roughness:.45}),skin:M(0xffffff,{roughness:.5}),cloud:M(0xffffff,{roughness:.9,emissive:0x555555}),lamp:M(0xffffff,{roughness:.2})};
const add=(o,p=scene)=>{o.castShadow=o.receiveShadow=true;p.add(o);return o;};
const OUT=new T.MeshBasicMaterial({color:0x2a0d10,side:T.BackSide});
const box=(w,h,d,m,x,y,z,p=scene)=>{const mn=Math.min(w,h,d);const geo=mn>.8?new T.RoundedBoxGeometry(w,h,d,3,Math.min(mn*.18,1.4)):new T.BoxGeometry(w,h,d);
  const o=add(new T.Mesh(geo,m),p);o.position.set(x,y,z);
  if(Math.max(w,h,d)>6&&mn>.8){const ol=new T.Mesh(geo,OUT);ol.scale.set(1+.7/w,1+.7/h,1+.7/d);ol.castShadow=false;o.add(ol);}return o;};
const cyl=(rt,rb,h,m,x,y,z,seg=16,p=scene)=>{const o=add(new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg),m),p);o.position.set(x,y,z);return o;};
const plane=(w,h,m,x,y,z,p)=>{const o=new T.Mesh(new T.PlaneGeometry(w,h),m);o.position.set(x,y,z);p.add(o);return o;};
// group sitting on the ellipse at angle t, offset d, its local +z facing the pitch centre
function at(t,d){const g=new T.Group();g.position.copy(pt(t,d));scene.add(g);g.lookAt(0,0,0);return g;}

// ---------------- lights ----------------
const hemi=new T.HemisphereLight(0xcfe8ff,0x6a5a3a,.45); scene.add(hemi);
(function(){const es=new T.Scene();const sk=new T.Mesh(new T.SphereGeometry(100,32,16),new T.MeshBasicMaterial({map:SKY_DAY,side:T.BackSide}));es.add(sk);
  const sb=new T.Mesh(new T.SphereGeometry(14,16,8),new T.MeshBasicMaterial({color:0xffffff}));sb.position.set(-50,70,30);es.add(sb);
  const gr=new T.Mesh(new T.CircleGeometry(100,32),new T.MeshBasicMaterial({color:0x5cc13f}));gr.rotation.x=-Math.PI/2;gr.position.y=-10;es.add(gr);
  scene.environment=new T.PMREMGenerator(renderer).fromScene(es,.04).texture;})();
const sun=new T.DirectionalLight(0xffe2b8,1.55); sun.position.set(-200,300,140); sun.castShadow=true; sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-260,right:260,top:260,bottom:-260,near:10,far:900}); sun.shadow.bias=-.0005; scene.add(sun);
const rim=new T.DirectionalLight(0x8fd8ff,.9); rim.position.set(160,90,-240); scene.add(rim);
scene.background=SKY_DAY; scene.fog=new T.Fog(0xbfe2ff,800,2200);

// ---------------- ground, field, square ----------------
add(new T.Mesh(new T.CircleGeometry(1600,64),mat.turf)).rotation.x=-Math.PI/2;
const fs=new T.Shape();fs.absellipse(0,0,RX,RZ,0,TAU);const fg=new T.ShapeGeometry(fs,120);const uv=fg.attributes.uv,ps=fg.attributes.position;
for(let i=0;i<uv.count;i++)uv.setXY(i,(ps.getX(i)+RX)/(2*RX),(ps.getY(i)+RZ)/(2*RZ));
const field=add(new T.Mesh(fg,mat.grass));field.rotation.x=-Math.PI/2;field.position.y=.05;
const sq=add(new T.Mesh(new T.PlaneGeometry(28,24),mat.square));sq.rotation.x=-Math.PI/2;sq.position.y=.08;   // the square: pitches run north–south
for(const z of [-10.1,10.1])for(const dx of [-.3,0,.3])cyl(.09,.09,.9,mat.white,dx,.5,z,6);

// ---------------- bands on concentric ellipses (treads, risers, walls), over an angle range ----------------
function band(d0,d1,y0,y1,m,a0=0,a1=TAU,tile=8){const n=Math.max(8,Math.ceil(Math.abs(a1-a0)/TAU*240)),p=[],idx=[],uv=[];
  const L=Math.abs(a1-a0)*Math.sqrt(((RX+d0)**2+(RZ+d0)**2)/2);
  for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n,c=Math.cos(t),s=Math.sin(t);p.push((RX+d0)*c,y0,(RZ+d0)*s,(RX+d1)*c,y1,(RZ+d1)*s);uv.push(i/n*L/tile,0,i/n*L/tile,1);}

const KEYS=['game','bat','bowl','pitch','pav','orbit','blimp'];
KEYS.forEach(n=>document.getElementById('c-'+n).onclick=()=>go(n));
const nowEl=document.getElementById('now');const _go=go;go=function(n){_go(n);nowEl.innerHTML=NAMES[n][0]+'<small>'+NAMES[n][1]+'</small>';};
addEventListener('keydown',e=>{const k=+e.key;if(k>=1&&k<=7&&!e.metaKey&&!e.ctrlKey)go(KEYS[k-1]);});
const panel=document.getElementById('panel'),tm=document.getElementById('t-min');
tm.onclick=()=>{const m=panel.dataset.min==='1';panel.dataset.min=m?'0':'1';tm.textContent=m?'Hide':'Show controls';tm.setAttribute('aria-expanded',m);};
let wave=false,night=false;
const tl=document.getElementById('t-labels');tl.onclick=()=>{showLabels=!showLabels;tl.classList.toggle('on',showLabels);};
const tw=document.getElementById('t-wave');tw.onclick=()=>{wave=!wave;tw.classList.toggle('on',wave);};
const SKY_GOLD=skyTex('#3b6fd8','#ffb46b','#ffe2b0');
const LIGHT={day:{bg:SKY_DAY,fog:0xbfe2ff,sun:[0xffe2b8,1.55],sp:[-200,300,140],hemi:.45,rim:.9,lamps:0,disc:0xfff6d8,dp:[-900,520,700]},
  gold:{bg:SKY_GOLD,fog:0xffd2a0,sun:[0xffb066,1.6],sp:[-320,110,60],hemi:.35,rim:1.1,lamps:0,disc:0xffc27a,dp:[-1100,170,300]},
  night:{bg:SKY_NIGHT,fog:0x1a1a3a,sun:[0x9fb4ff,.12],sp:[-200,300,140],hemi:.18,rim:.15,lamps:1.4,disc:0xf4f2e8,dp:[700,600,-900]}};
function light(k){const L=LIGHT[k];scene.background=L.bg;scene.fog.color.set(L.fog).convertSRGBToLinear();sun.color.set(L.sun[0]).convertSRGBToLinear();sun.intensity=L.sun[1];
  sun.position.set(...L.sp);hemi.intensity=L.hemi;rim.intensity=L.rim;mat.lamp.emissive.set(L.lamps?0xfff4c8:0).convertSRGBToLinear();lamps.forEach(l=>l.intensity=L.lamps);
  sunDisc.material.color.set(L.disc);sunDisc.position.set(...L.dp);sunDisc.lookAt(0,0,0);sunDisc.scale.setScalar(k==='night'?.6:1);
  cloudMat.emissiveIntensity=k==='night'?.03:.35;cloudMat.color.set(k==='gold'?0xffe6d0:k==='night'?0x5a6080:0xffffff).convertSRGBToLinear();
  ['day','gold','night'].forEach(n=>document.getElementById('l-'+n).classList.toggle('on',n===k));}
['day','gold','night'].forEach(n=>document.getElementById('l-'+n).onclick=()=>light(n));
const tp=document.getElementById('t-phone');tp.onclick=()=>{phone=!phone;tp.classList.toggle('on',phone);stage.classList.toggle('phone',phone);resize();};
function resize(){const W=innerWidth,H=innerHeight;let w=W,h=H;if(phone){h=H-24;w=Math.round(h*1170/2532);if(w>W-32){w=W-32;h=Math.round(w*2532/1170);}}
  renderer.setSize(w,h);composer.setSize(w,h);bloom.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();if(view==='game')go('game');}
const composer=new T.EffectComposer(renderer);composer.addPass(new T.RenderPass(scene,camera));
const bloom=new T.UnrealBloomPass(new T.Vector2(512,512),.14,.4,.97);composer.addPass(bloom);composer.addPass(new T.ShaderPass(T.GammaCorrectionShader));
const grade=new T.ShaderPass({uniforms:{tDiffuse:{value:null}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;varying vec2 vUv;void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float l=dot(c,vec3(.299,.587,.114));
  c=mix(vec3(l),c,1.18);c=(c-.5)*1.06+.5;c+=vec3(.05,.025,-.02)*smoothstep(.45,1.,l)+vec3(-.02,0.,.045)*(1.-smoothstep(0.,.45,l));
  float v=smoothstep(1.05,.35,length(vUv-.5)*1.25);c*=mix(.82,1.,v);gl_FragColor=vec4(clamp(c,0.,1.),1.);}`});
composer.addPass(grade);
addEventListener('resize',resize);resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------- loop ----------------
const clock=new T.Clock();let wa=0,tz=-300,td=1;
(function tick(){const dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;
  if(tween){const k=Math.min(1,(performance.now()-tween.start)/800),e=1-Math.pow(1-k,3);camera.position.lerpVectors(tween.from,tween.to,e);controls.target.lerpVectors(tween.ft,tween.tt,e);camera.fov=tween.ff+(tween.tf-tween.ff)*e;camera.updateProjectionMatrix();if(k>=1)tween=null;}
  if(!reduce){wa+=dt*1.5;placeCrowd(time,wave,wa);
    flags.forEach(f=>{const p=f.geo.attributes.position;for(let i=0;i<p.count;i++){const x=f.base[i*3];p.array[i*3+2]=Math.sin(x*1.8-time*5)*.3*(x/(3.6*f.s));}p.needsUpdate=true;});
    floaters.forEach(f=>{f.b.position.set(f.p.x,f.p.y+3.4+Math.abs(Math.sin(time*2.2+f.ph))*3,f.p.z);});
    tz+=dt*16*td;if(tz>300)td=-1;if(tz<-300)td=1;tram.position.z=tz;
    clouds.rotation.y+=dt*.004;}
  controls.update();composer.render();drawLabels();requestAnimationFrame(tick);})();
})();
</script>
